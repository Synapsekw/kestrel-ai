          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapScore" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/survey-timeline:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [maps]
      operationId: getSurveyTimeline
      summary: Counts per class for every survey (map) of this project, oldest first, with the change since the previous comparable survey.
      parameters:
        - { name: model_id, in: query, required: false, schema: { type: string }, description: compare on this model instead of the newest run's }
        - { name: conf, in: query, required: false, schema: { type: number, minimum: 0, maximum: 1 }, description: compare at this confidence instead of the newest run's }
        - { name: verified_only, in: query, required: false, schema: { type: boolean, default: false }, description: "count only verified detections (accepted, edited or drawn by a person): `counts` and `deltas` are built from each run's `verified_counts`" }
      responses:
