      required: [kind, id, match, zone_id, class_id, x, y, w, h]
      properties:
        kind: { type: string, enum: [detection, label] }
        id: { type: string }
        match: { type: string, enum: [tp, fp, fn] }
        zone_id: { type: string }
        class_id: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
    MapScore:
      type: object
      required: [run_id, iou, labels_version, has_zones, overall, per_class, per_zone, matches]
      properties:
        run_id: { type: string }
        iou: { type: number }
        labels_version: { type: integer }
        has_zones: { type: boolean }
        overall: { $ref: "#/components/schemas/MapScoreRow" }
        per_class:
          type: array
          items: { $ref: "#/components/schemas/MapScoreRow" }
        per_zone:
          type: array
          items: { $ref: "#/components/schemas/MapScoreZoneRow" }
        matches:
          type: array
          items: { $ref: "#/components/schemas/MapScoreMatch" }
      example:
        run_id: "r0000000-7777-4000-8000-000000000001"
        iou: 0.5
        labels_version: 3
        has_zones: true
        overall: { class_id: null, tp: 18, fp: 2, fn: 3, precision: 0.9, recall: 0.857, f1: 0.878, predicted: 20, actual: 21, count_error: -1, count_error_pct: -4.76 }
        per_class: [{ class_id: "c1a2b3c4-0000-4000-8000-000000000001", tp: 18, fp: 2, fn: 3, precision: 0.9, recall: 0.857, f1: 0.878, predicted: 20, actual: 21, count_error: -1, count_error_pct: -4.76 }]
        per_zone: []
        matches:
          - { kind: detection, id: "d0000000-1111-4000-8000-000000000001", match: tp, zone_id: "z0000000-9999-4000-8000-000000000001", class_id: "c1a2b3c4-0000-4000-8000-000000000001", x: 1200, y: 1200, w: 180, h: 120 }
          - { kind: detection, id: "d0000000-1111-4000-8000-000000000002", match: fp, zone_id: "z0000000-9999-4000-8000-000000000001", class_id: "c1a2b3c4-0000-4000-8000-000000000001", x: 3000, y: 2400, w: 170, h: 110 }
          - { kind: label, id: "l0000000-1212-4000-8000-000000000001", match: fn, zone_id: "z0000000-9999-4000-8000-000000000001", class_id: "c1a2b3c4-0000-4000-8000-000000000004", x: 4100, y: 3300, w: 200, h: 140 }
    MapExportFormat:
      type: string
      enum: [geojson, gpkg, csv]
    MapExportContent:
      type: string
      enum: [run, labels, run_score]
    MapExportRequest:
      type: object
      required: [map_id, content, formats]
      properties:
        map_id: { type: string }
        content: { $ref: "#/components/schemas/MapExportContent" }
        run_id: { type: string, description: required for run and run_score }
        formats:
          type: array
          items: { $ref: "#/components/schemas/MapExportFormat" }
          minItems: 1
          uniqueItems: true
    MapMoveRequest:
      type: object
      required: [target_project_id]
      properties:
        target_project_id: { type: string, description: an open or recently opened detection project }
      example: { target_project_id: "7f1c2e3a-1111-4000-8000-000000000002" }
    # ------------------------------------------------------------ detection workspace
    CountPair:
      type: object
      description: "a count shown as total (verified): total is every state except rejected; verified is accepted, edited or drawn by a person"
      required: [total, verified]
      properties:
        total: { type: integer, minimum: 0 }
        verified: { type: integer, minimum: 0 }
      example: { total: 6, verified: 4 }
    ModelSnapshot:
      type: object
      description: "the library model as it was when the run started, so the run still reads after the model is deleted; empty for cloud-provider runs and runs made before snapshots"
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        task: { type: string, enum: [detect, obb] }
        format: { type: string, enum: [pt, onnx] }
        class_names:
          type: array
          items: { type: string }
        origin: { type: string, enum: [trained, imported, starter] }
      example: { id: "m0000000-2222-4000-8000-000000000001", name: "yolo11m-coco", task: detect, format: pt, class_names: [truck, car], origin: starter }
    RunClassMap:
      type: object
      description: "model class name to project class id; null ignores that class (its detections are not written); empty when the run used no mapping"
      additionalProperties: { type: [string, "null"] }
      example: { truck: "c1a2b3c4-0000-4000-8000-000000000004", car: null }
    RunKind:
      type: string
      description: "`images` is a photo run (a query run over one photo source); `map` is a map run"
      enum: [images, map]
    ReviewProgress:
      type: object
      required: [total, reviewed]
      properties:
        total: { type: integer, minimum: 0, description: detections of the run }
        reviewed: { type: integer, minimum: 0, description: detections no longer unreviewed }
      example: { total: 530, reviewed: 412 }
    RunSummary:
      type: object
      required: [id, kind, source_id, source_label, model_id, model_name, conf, job_state, pinned, counts, verified_counts, review, created_at]
      properties:
        id: { type: string, description: the query run or map run id }
        kind: { $ref: "#/components/schemas/RunKind" }
        source_id: { type: [string, "null"] }
        source_label: { type: [string, "null"], description: "the source's label, else its folder or map name" }
        model_id: { type: [string, "null"] }
        model_name: { type: [string, "null"], description: "from the run's model snapshot, or the cloud provider's model" }
        conf: { type: number }
        job_state:
          description: the state of the run's latest job; null before one exists
          oneOf:
            - { $ref: "#/components/schemas/JobState" }
            - { type: "null" }
        pinned: { type: boolean }
        counts: { type: object, additionalProperties: { type: integer }, description: per project class id; every state except rejected }
        verified_counts: { type: object, additionalProperties: { type: integer }, description: per project class id; accepted, edited or drawn by a person }
        review: { $ref: "#/components/schemas/ReviewProgress" }
        created_at: { type: string, format: date-time }
      example:
        id: "r0000000-7777-4000-8000-000000000001"
        kind: map
        source_id: "50000000-3333-4000-8000-000000000002"
        source_label: "May survey"
        model_id: "m0000000-2222-4000-8000-000000000001"
        model_name: "machinery-v3"
        conf: 0.25
        job_state: succeeded
        pinned: false
        counts: { "c1a2b3c4-0000-4000-8000-000000000001": 42, "c1a2b3c4-0000-4000-8000-000000000004": 17 }
        verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 30 }
        review: { total: 59, reviewed: 34 }
        created_at: "2026-09-22T11:00:00Z"
    RunSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RunSummary" }
        next_cursor: { type: [string, "null"] }
    RunCreate:
      type: object
      description: "one run per source. A library model (`model_id`), or a cloud provider (`provider` and `query`)."
      required: [source_ids]
      properties:
        source_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        model_id: { type: string, description: a library model id }
        provider: { $ref: "#/components/schemas/ProviderName" }
        query: { type: string, minLength: 1, description: "free text for a cloud provider, e.g. dump trucks" }
        conf: { type: number, minimum: 0, maximum: 1, default: 0.25 }
        tiling: { $ref: "#/components/schemas/Tiling" }
        target_gsd_cm:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: "map runs: resample windows to this GSD; defaults to the model's training GSD"
      example: { source_ids: ["50000000-3333-4000-8000-000000000001", "50000000-3333-4000-8000-000000000002"], model_id: "m0000000-2222-4000-8000-000000000001", conf: 0.25 }
    RunCreatedItem:
      type: object
      required: [run_id, source_id, kind, job]
      properties:
        run_id: { type: string }
        source_id: { type: string }
        kind: { $ref: "#/components/schemas/RunKind" }
        job: { $ref: "#/components/schemas/Job" }
    RunCreated:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/RunCreatedItem" }
    RunPatch:
      type: object
      required: [pinned]
      additionalProperties: false
      properties:
        pinned: { type: boolean, description: true pins this run and unpins the other runs of its source }
      example: { pinned: true }
    UnmappedClassesError:
      type: object
      description: the `Error` envelope for `unmapped_classes`
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, description: "`unmapped_classes`, or `validation_error` for a malformed body" }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
              properties:
                model_id: { type: string }
                unmapped:
                  type: array
                  description: model class names with no project class
                  items: { type: string }
      example:
        error:
          code: unmapped_classes
          message: "2 of the model's classes are not mapped to project classes."
          details: { model_id: "m0000000-2222-4000-8000-000000000001", unmapped: [crane, "concrete mixer"] }
    ModelClassMapOut:
      type: object
      required: [model_id, model_classes, mapping, unmapped]
      properties:
        model_id: { type: string }
        model_classes:
          type: array
          description: the model's class names, in index order
          items: { type: string }
        mapping:
          type: object
          description: model class name to project class id, or null to ignore it
          additionalProperties: { type: [string, "null"] }
        unmapped:
          type: array
          description: model class names that have no entry in `mapping` yet
          items: { type: string }
      example:
        model_id: "m0000000-2222-4000-8000-000000000001"
        model_classes: [excavator, "dump truck", crane]
        mapping: { excavator: "c1a2b3c4-0000-4000-8000-000000000001", "dump truck": "c1a2b3c4-0000-4000-8000-000000000004" }
        unmapped: [crane]
    ModelClassMapPut:
      type: object
      required: [mapping]
      properties:
        mapping:
          type: object
          description: model class name to project class id, or null to ignore it
          additionalProperties: { type: [string, "null"] }
        new_classes:
          type: array
          default: []
          uniqueItems: true
          description: model class names to add as project classes, each mapped to itself
          items: { type: string, minLength: 1 }
      example: { mapping: { excavator: "c1a2b3c4-0000-4000-8000-000000000001", "dump truck": null }, new_classes: [crane] }
    MapDetectionReview:
      type: object
      required: [detection_ids, action]
      properties:
        detection_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        action:
          type: string
          enum: [accept, reject, unreview, reclass]
          description: "`unreview` puts a detection back to unreviewed; `reclass` needs `class_id` and sets the state `edited`"
        class_id: { type: string, description: required for reclass }
      example: { detection_ids: ["d0000000-1111-4000-8000-000000000001"], action: accept }
    MapDetectionReviewResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer, minimum: 0 }
      example: { updated: 1 }
    MapDetectionCreate:
      type: object
      required: [class_id, x, y, w, h]
      properties:
        class_id: { type: string }
        x: { type: number, description: full-resolution map pixels }
        y: { type: number }
        w: { type: number, exclusiveMinimum: 0 }
        h: { type: number, exclusiveMinimum: 0 }
        angle: { type: [number, "null"] }
      example: { class_id: "c1a2b3c4-0000-4000-8000-000000000001", x: 2400, y: 1300, w: 170, h: 110 }
    NextUnreviewed:
      type: object
      required: [detection, remaining]
      properties:
        detection:
          oneOf:
            - { $ref: "#/components/schemas/MapDetection" }
            - { type: "null" }
        remaining: { type: integer, minimum: 0, description: unreviewed detections left in the run }
      example:
        detection: { id: "d0000000-1111-4000-8000-000000000002", class_id: "c1a2b3c4-0000-4000-8000-000000000001", confidence: 0.64, x: 3000, y: 2400, w: 170, h: 110, angle: null, review_state: unreviewed, provenance_kind: local_model }
        remaining: 118
    AcceptAbove:
      type: object
      required: [min_confidence]
      properties:
        min_confidence: { type: number, minimum: 0, maximum: 1 }
      example: { min_confidence: 0.8 }
    LonLat:
      type: array
      description: "[longitude, latitude] in WGS84 degrees"
      minItems: 2
      maxItems: 2
      items: { type: number }
    PixelPoint:
      type: array
      description: "[x, y] in full-resolution map pixels"
      minItems: 2
      maxItems: 2
      items: { type: number }
    SiteArea:
      type: object
      required: [id, name, polygon_wgs84, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        polygon_wgs84:
          type: array
          minItems: 3
          description: the outline, not closed (the first point is not repeated)
          items: { $ref: "#/components/schemas/LonLat" }
        created_at: { type: string, format: date-time }
      example:
        id: "5a000000-aaaa-4000-8000-000000000001"
        name: "North laydown yard"
        polygon_wgs84: [[47.7610, 29.4960], [47.7640, 29.4960], [47.7640, 29.4980], [47.7610, 29.4980]]
        created_at: "2026-09-23T09:00:00Z"
    SiteAreaCreate:
      type: object
      description: "either `polygon_wgs84`, or `map_id` with `polygon_px` drawn on that map (the server converts it with the map's georeference)"
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        polygon_wgs84:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/LonLat" }
        map_id: { type: string }
        polygon_px:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/PixelPoint" }
      example: { name: "North laydown yard", map_id: "a0000000-6666-4000-8000-000000000001", polygon_px: [[1000, 800], [4000, 800], [4000, 3000], [1000, 3000]] }
    SiteAreaPatch:
      type: object
      description: "a new outline is either `polygon_wgs84`, or `map_id` with `polygon_px`"
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        polygon_wgs84:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/LonLat" }
        map_id: { type: string }
        polygon_px:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/PixelPoint" }
      example: { name: "North yard" }
    SiteAreaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SiteArea" }
    ClassCountRow:
      type: object
      required: [class_id, name, colour, total, verified]
      properties:
        class_id: { type: string }
        name: { type: string }
        colour: { type: string }
        total: { type: integer, minimum: 0 }
        verified: { type: integer, minimum: 0 }
      example: { class_id: "c1a2b3c4-0000-4000-8000-000000000001", name: excavator, colour: "#f97316", total: 6, verified: 4 }
    SourceAnalytics:
      type: object
      required: [source, unit, image_count, run, classes, review]
      properties:
        source: { $ref: "#/components/schemas/Source" }
        unit:
          type: string
          enum: [objects, detections]
          description: "`objects` for a map source; `detections` for photos, where one object can appear in several photos"
        image_count: { type: [integer, "null"], description: photos in a photo source; null for a map }
        run:
          description: the run that represents the source; null before any run
          oneOf:
            - { $ref: "#/components/schemas/RunSummary" }
            - { type: "null" }
        classes:
          type: array
          items: { $ref: "#/components/schemas/ClassCountRow" }
        review: { $ref: "#/components/schemas/ReviewProgress" }
    AreaRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    AreaSurveyCell:
      type: object
      required: [partial, counts]
      properties:
        partial: { type: boolean, description: part of the area lies outside this map }
        counts:
          type: object
          description: per class id
          additionalProperties: { $ref: "#/components/schemas/CountPair" }
    AreaSurvey:
      type: object
      required: [map_id, map_name, captured_on, state, per_area]
      properties:
        map_id: { type: string }
        map_name: { type: string }
        captured_on: { type: [string, "null"], format: date }
        state: { type: string, enum: [ok, not_comparable, not_counted], description: as in the survey timeline }
        per_area:
          type: object
          description: "per site area id; an area that does not overlap this map has no key"
          additionalProperties: { $ref: "#/components/schemas/AreaSurveyCell" }
    AreaAnalytics:
      type: object
      required: [areas, surveys]
      properties:
        areas:
          type: array
          items: { $ref: "#/components/schemas/AreaRef" }
        surveys:
          type: array
          description: oldest first, as in the survey timeline
          items: { $ref: "#/components/schemas/AreaSurvey" }
    PhotoBatch:
      type: object
      required: [source, run, classes]
      properties:
        source: { $ref: "#/components/schemas/Source" }
        run:
          oneOf:
            - { $ref: "#/components/schemas/RunSummary" }
            - { type: "null" }
        classes:
          type: array
          description: detections, not objects
          items: { $ref: "#/components/schemas/ClassCountRow" }
    PhotoBatchAnalytics:
      type: object
      required: [batches]
      properties:
        batches:
          type: array
          items: { $ref: "#/components/schemas/PhotoBatch" }
    DetectExportRequest:
      type: object
      required: [format]
      properties:
        format: { type: string, enum: [csv, pdf] }
        source_id: { type: [string, "null"], description: "PDF: report this source only; omitted or null reports every source. CSV: this source only, else every source." }
      example: { format: pdf, source_id: "50000000-3333-4000-8000-000000000002" }
    PromoteRequest:
      type: object
      properties:
        min_confidence: { type: number, minimum: 0, maximum: 1, default: 0 }
        dry_run:
          type: boolean
          default: false
          description: count the boxes a promotion would accept without changing anything (`promoted_at` stays as it is)
      example: { min_confidence: 0.5 }
    PromoteResult:
      type: object
      required: [query_run, accepted]
      properties:
        query_run: { $ref: "#/components/schemas/QueryRun" }
        accepted: { type: integer }
      example:
        query_run:
          id: "q0000000-8888-4000-8000-000000000001"
          kind: cloud_provider
          model_id: null
          provider: anthropic
          model_name: claude-opus-5
          query: dump trucks
          image_ids: ["10000000-5555-4000-8000-000000000001"]
          tiling: { enabled: true, tile_size: 1280, overlap: 0.2, nms_iou: 0.5 }
          conf: 0.25
          job_id: "j0000000-4444-4000-8000-000000000003"
          box_count: 7
          source_id: "50000000-3333-4000-8000-000000000001"
          model_snapshot: {}
          class_map: {}
          pinned: false
          counts: { "c1a2b3c4-0000-4000-8000-000000000001": 7 }
          verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 6 }
          promoted_at: "2026-09-17T13:30:00Z"
          created_at: "2026-09-17T13:00:00Z"
        accepted: 6

    UnpromoteResult:
      type: object
      required: [query_run, reverted]
      properties:
        query_run: { $ref: "#/components/schemas/QueryRun" }
        reverted: { type: integer }
      example:
        query_run:
          id: "q0000000-8888-4000-8000-000000000001"
          kind: cloud_provider
          model_id: null
          provider: anthropic
          model_name: claude-opus-5
          query: dump trucks
          image_ids: ["10000000-5555-4000-8000-000000000001"]
          tiling: { enabled: true, tile_size: 1280, overlap: 0.2, nms_iou: 0.5 }
          conf: 0.25
          job_id: "j0000000-4444-4000-8000-000000000003"
          box_count: 7
          source_id: "50000000-3333-4000-8000-000000000001"
          model_snapshot: {}
          class_map: {}
          pinned: false
          counts: { "c1a2b3c4-0000-4000-8000-000000000001": 7 }
          verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 6 }
          promoted_at: null
          created_at: "2026-09-17T13:00:00Z"
        reverted: 6

    ResultsExportFormat:
      type: string
      enum: [csv, yolo, coco, html]
    ResultsExportRequest:
      type: object
      required: [formats]
      properties:
        formats:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/ResultsExportFormat" }
        include_unreviewed: { type: boolean, default: false, description: also export proposals nobody has reviewed yet; every row carries its review state }
        image_ids:
          type: array
          description: defaults to every image of the project
          items: { type: string }
      example: { formats: [csv, html], include_unreviewed: false }
    RevealRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, description: relative to the project folder }
      example: { path: "exports/2026-09-19_101500" }
    JobType:
      type: string
      enum: [import, dataset, train, infer, export, results_export, map_import, map_detect, map_export, library_import, library_export, library_starter, library_adopt, map_move, accept_above, recount, area_recount, detect_export]
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    Job:
      type: object
      required: [id, project_id, type, state, progress, message, log_path, params, result, error, created_at, started_at, finished_at]
      properties:
        id: { type: string }
        project_id: { type: string, description: "the project id, or `library` for library jobs" }
        type: { $ref: "#/components/schemas/JobType" }
        state: { $ref: "#/components/schemas/JobState" }
        progress: { type: number, minimum: 0, maximum: 1 }
        message: { type: string }
        log_path: { type: string, description: "relative: runs/<job_id>/job.log" }
        params:
          type: object
          additionalProperties: true
        result:
          type: [object, "null"]
          additionalProperties: true
          description: "type-specific: import {source_id, imported, duplicates, failed}; dataset {dataset_id}; train {model_id, metrics} (a library model id); infer {query_run_id, boxes}; library_import and library_starter {model_id}; library_export {format, path}; accept_above {run_id, accepted}; recount {run_id}; area_recount {runs}; detect_export {format, paths}"
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
      example:
        id: "j0000000-4444-4000-8000-000000000001"
        project_id: "7f1c2e3a-1111-4000-8000-000000000001"
        type: import
        state: running
        progress: 0.42
        message: "1386 / 3299 images"
        log_path: "runs/j0000000-4444-4000-8000-000000000001/job.log"
        params: { source_id: "50000000-3333-4000-8000-000000000001" }
        result: null
        error: null
        created_at: "2026-09-17T10:05:00Z"
        started_at: "2026-09-17T10:05:01Z"
        finished_at: null
    JobPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        next_cursor: { type: [string, "null"] }
    JobLog:
      type: object
      required: [lines, path]
      properties:
        lines:
          type: array
          items: { type: string }
        path: { type: string }
      example:
        lines: ["2026-09-17 10:05:01 INFO job started", "2026-09-17 10:05:09 INFO 50 / 3299 images"]
        path: "runs/j0000000-4444-4000-8000-000000000001/job.log"

    Event:
      type: object
      description: websocket message (see `x-websocket`)
      required: [type, project_id, job_id, progress, message, payload]
      properties:
        type:
          type: string
          enum:
            [
              job.progress,
              job.state,
              images.changed,
              boxes.changed,
              agent.changed,
              maps.changed,
              map_runs.changed,
              map_labels.changed,
            ]
        project_id: { type: string, description: "the project id, or `library` for library jobs" }
        job_id: { type: [string, "null"] }
        progress: { type: [number, "null"] }
        message: { type: string }
        payload:
          type: object
          additionalProperties: true
      example:
        type: job.progress
        project_id: "7f1c2e3a-1111-4000-8000-000000000001"
        job_id: "j0000000-4444-4000-8000-000000000001"
        progress: 0.42
        message: "1386 / 3299 images"
        payload: {}
