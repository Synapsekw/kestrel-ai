            [
              { src: [812.0, -1204.0], dst: [583120.4, 3265410.2] },
              { src: [6120.0, -980.0], dst: [583402.9, 3265421.7] },
              { src: [3300.0, -4100.0], dst: [583255.1, 3265246.0] },
            ],
        }
    GeorefFitRequest:
      type: object
      required: [model, points]
      properties:
        model: { $ref: "#/components/schemas/GeorefModel" }
        points:
          {
            type: array,
            minItems: 2,
            maxItems: 12,
            items: { $ref: "#/components/schemas/GeorefPointInput" },
          }
        units:
          {
            oneOf: [{ $ref: "#/components/schemas/LinearUnit" }, { type: "null" }],
            description: "the drawing's units, for the scale_mismatch warning; null or absent for a raster",
          }
    GeorefFit:
      type: object
      required:
        [model, transform, rmse_m, residuals_m, warnings, scale, rotation_deg]
      properties:
        model: { $ref: "#/components/schemas/GeorefModel" }
        transform:
          { type: array, items: { type: number }, minItems: 6, maxItems: 6 }
        rmse_m: { type: number }
        residuals_m: { type: array, items: { type: number } }
        warnings:
          { type: array, items: { $ref: "#/components/schemas/GeorefWarning" } }
        scale:
          {
            type: number,
            description: "metres per drawing unit (the mean of the two axes for affine)",
          }
        rotation_deg:
          {
            type: number,
            description: counter-clockwise from the drawing's x axis to east,
          }
      example:
        {
          model: similarity,
          transform: [0.0532, 0.0021, 583077.0, -0.0021, 0.0532, 3265476.3],
          rmse_m: 0.06,
          residuals_m: [0.05, 0.07, 0.06],
          warnings: [],
          scale: 0.05324,
          rotation_deg: -2.26,
        }
    DrawingVectorLayer:
      type: object
      required: [name, colour, lines]
      properties:
        name: { type: string }
        colour: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        lines:
          {
            type: array,
            items: { type: array, minItems: 4, items: { type: number } },
            description: "each a flat x0, y0, x1, y1, ... list in the site frame",
          }
    DrawingLabel:
      type: object
      required: [text, x, y, height_m, rotation]
      properties:
        text: { type: string }
        x: { type: number }
        y: { type: number }
        height_m: { type: number }
        rotation: { type: number, description: degrees counter-clockwise }
        layer:
          {
            type: string,
            description: "the DXF or LandXML layer, so hidden layers hide their labels too",
          }
    DrawingVectorTile:
      type: object
      required: [layers, labels, truncated]
      properties:
        layers:
          {
            type: array,
            items: { $ref: "#/components/schemas/DrawingVectorLayer" },
          }
        labels:
          { type: array, items: { $ref: "#/components/schemas/DrawingLabel" } }
        truncated:
          {
            type: boolean,
            description: "over 20 000 vertices matched; the shortest runs were dropped first",
          }
      example:
        layers:
          [
            {
              name: "C-ROAD",
              colour: "#ffffff",
              lines:
                [[583100.0, 3265400.0, 583180.0, 3265402.5, 583240.0, 3265430.0]],
            },
          ]
        labels:
          [
            {
              text: "ACCESS ROAD",
              x: 583150.0,
              y: 3265405.0,
              height_m: 1.5,
              rotation: 2.0,
              layer: "C-ROAD",
            },
          ]
        truncated: false
    SiteVertex:
      type: array
      description: "x, y"
      minItems: 2
      maxItems: 2
      items: { type: number }
    MapMeasurementKind:
      type: string
      enum: [distance, area, profile]
    MapDistanceResults:
      type: object
      required:
        [
          length_m,
          grid_length_m,
          scale_factor,
          length_3d_m,
          nodata_fraction,
          dsm_surface_id,
        ]
      properties:
        length_m:
          {
            type: [number, "null"],
            description: "ellipsoidal (pyproj Geod); null in a local frame",
          }
        grid_length_m: { type: number }
        scale_factor:
          { type: [number, "null"], description: "length_m / grid_length_m" }
        length_3d_m:
          {
            type: [number, "null"],
            description: "the slope length over the DSM; null without one",
          }
        nodata_fraction:
          {
            type: [number, "null"],
            minimum: 0,
            maximum: 1,
            description: "the share of the 3D line over nodata",
          }
        dsm_surface_id: { type: [string, "null"] }
    MapAreaResults:
      type: object
      required:
        [area_m2, perimeter_m, grid_area_m2, grid_perimeter_m, areal_scale_factor]
      properties:
        area_m2:
          {
            type: [number, "null"],
            description: "ellipsoidal, absolute; null in a local frame",
          }
        perimeter_m: { type: [number, "null"] }
        grid_area_m2: { type: number }
        grid_perimeter_m: { type: number }
        areal_scale_factor: { type: [number, "null"] }
    ProfileSeries:
      type: object
      required: [surface_id, label, date, z]
      properties:
        surface_id: { type: string }
        label: { type: string }
        date: { type: [string, "null"], format: date }
        z:
          {
            type: array,
            maxItems: 2000,
            items: { type: [number, "null"] },
            description: "one per station; null over nodata (drawn as a break)",
          }
    MapProfileResults:
      type: object
      required:
        [
          length_m,
          grid_length_m,
          stations_m,
          series,
          z_min,
          z_max,
          cut_area_m2,
          fill_area_m2,
          nodata_fraction,
        ]
      properties:
        length_m: { type: [number, "null"] }
        grid_length_m: { type: number }
        stations_m:
          {
            type: array,
            maxItems: 2000,
            items: { type: number },
            description: "chainage of each station; empty in listMapMeasurements rows (placeholders), GET the measurement for the data",
          }
        series:
          {
            type: array,
            maxItems: 3,
            items: { $ref: "#/components/schemas/ProfileSeries" },
            description: "one series per surface; empty in listMapMeasurements rows (placeholders), GET the measurement for the data",
          }
        z_min: { type: [number, "null"] }
        z_max: { type: [number, "null"] }
        cut_area_m2:
          {
            type: [number, "null"],
            description: "between the first two series (trapezoidal); null with one series",
          }
        fill_area_m2: { type: [number, "null"] }
        nodata_fraction: { type: number, minimum: 0, maximum: 1 }
    MapMeasurementResults:
      description: "computed by the server on create and on every PATCH that moves the vertices or changes the surfaces; one shape per kind"
      anyOf:
        - $ref: "#/components/schemas/MapDistanceResults"
        - $ref: "#/components/schemas/MapAreaResults"
        - $ref: "#/components/schemas/MapProfileResults"
    MapMeasurement:
      type: object
      required:
        [
          id,
          name,
          note,
          kind,
          crs_wkt,
          epsg,
          vertices,
          surface_ids,
          map_id,
          results,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        note: { type: [string, "null"] }
        kind: { $ref: "#/components/schemas/MapMeasurementKind" }
        crs_wkt:
          {
            type: [string, "null"],
            description: "the frame it was drawn in (the site CRS at creation); null for local metres",
          }
        epsg: { type: [integer, "null"] }
        vertices:
          {
            type: array,
            minItems: 2,
            maxItems: 5000,
            items: { $ref: "#/components/schemas/SiteVertex" },
            description: "in crs_wkt; an area ring is not closed",
          }
        vertices_site:
          {
            type: array,
            items: { $ref: "#/components/schemas/SiteVertex" },
            description: "only with frame=site: the vertices in the current site frame",
          }
        surface_ids: { type: array, maxItems: 3, items: { type: string } }
        map_id:
          {
            type: [string, "null"],
            description: "the map of the right date at creation",
          }
        results: { $ref: "#/components/schemas/MapMeasurementResults" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MapMeasurementPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/MapMeasurement" } }
        next_cursor: { type: [string, "null"] }
      example:
        items:
          - id: "mm000000-1414-4000-8000-000000000001"
            name: "Distance 1"
            note: null
            kind: distance
            crs_wkt: 'PROJCRS["WGS 84 / UTM zone 38N"]'
            epsg: 32638
            vertices: [[583100.0, 3265400.0], [583148.1, 3265403.2]]
            surface_ids: []
            map_id: "a0000000-6666-4000-8000-000000000002"
            results:
              {
                length_m: 48.2,
                grid_length_m: 48.21,
                scale_factor: 0.99981,
                length_3d_m: null,
                nodata_fraction: null,
                dsm_surface_id: null,
              }
            created_at: "2026-09-27T09:00:00Z"
            updated_at: "2026-09-27T09:00:00Z"
        next_cursor: null
    MapMeasurementCreate:
      type: object
      required: [kind, vertices]
      properties:
        kind: { $ref: "#/components/schemas/MapMeasurementKind" }
        vertices:
          {
            type: array,
            minItems: 2,
            maxItems: 5000,
            items: { $ref: "#/components/schemas/SiteVertex" },
            description: "in the site frame; distance and profile at least 2, area at least 3 and simple",
          }
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            description: "numbered like Distance 3 when absent",
          }
        note: { type: string, maxLength: 2000 }
        surface_ids:
          {
            type: array,
            uniqueItems: true,
            maxItems: 3,
            items: { type: string },
            description: "profile: 1 to 3 surfaces; distance: an optional DSM for the 3D length; area: none",
          }
        map_id:
          {
            type: [string, "null"],
            description: "the map of the right date; null when absent",
          }
      example:
        {
          kind: profile,
          vertices: [[583100.0, 3265400.0], [583290.0, 3265460.0]],
          surface_ids: ["s0000000-9999-4000-8000-000000000001"],
        }
    MapMeasurementPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        note:
          { type: [string, "null"], maxLength: 2000, description: null clears it }
        vertices:
          {
            type: array,
            minItems: 2,
            maxItems: 5000,
            items: { $ref: "#/components/schemas/SiteVertex" },
            description: in the site frame,
          }
        surface_ids:
          { type: array, uniqueItems: true, maxItems: 3, items: { type: string } }
    MeasurementKind:
      type: string
      enum: [cloud, volume, map]
    MeasurementSubKind:
      type: string
      description: "cloud: its CloudMeasurementKind, including C's area and profile; volume: volume; map: its MapMeasurementKind"
      enum: [point, distance, height, vertical, area, profile, volume]
    MeasurementUnit:
      type: string
      enum: [m, m2, m3, deg, mm_per_m]
    MeasurementStatus:
      type: string
      description: "a volume's calculating and a cloud measurement's computing are both computing"
      enum: [ready, computing, stale, failed]
    MeasurementItem:
      type: object
      required:
        [
          kind,
          sub_kind,
          id,
          name,
          headline,
          unit,
          data_type,
          data_id,
          status,
          created_at,
          updated_at,
        ]
      properties:
        kind: { $ref: "#/components/schemas/MeasurementKind" }
        sub_kind: { $ref: "#/components/schemas/MeasurementSubKind" }
        id:
          {
            type: string,
            description: "the id in its own table (cloud, volume or map measurement)",
          }
        name: { type: string }
        headline:
          {
            type: [number, "null"],
            description: "the kind's headline figure in unit; null while computing, failed, or not mapped yet",
          }
        unit:
          {
            oneOf:
              [{ $ref: "#/components/schemas/MeasurementUnit" }, { type: "null" }],
          }
        data_type:
          {
            oneOf:
              [{ $ref: "#/components/schemas/DataItemType" }, { type: "null" }],
            description: "what it was measured on: a point cloud, a volume's top surface (elevation), or a map measurement's map",
          }
        data_id: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/MeasurementStatus" }
        created_at: { type: string, format: date-time, description: the page key }
        updated_at: { type: string, format: date-time }
    MeasurementPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/MeasurementItem" } }
        next_cursor: { type: [string, "null"] }
      example:
        items:
          - {
              kind: map,
              sub_kind: profile,
              id: "mm000000-1414-4000-8000-000000000002",
              name: "Section across the pit",
              headline: 199.2,
              unit: m,
              data_type: map,
              data_id: "a0000000-6666-4000-8000-000000000002",
              status: ready,
              created_at: "2026-09-27T09:10:00Z",
              updated_at: "2026-09-27T09:10:00Z",
            }
          - {
              kind: volume,
              sub_kind: volume,
              id: "v0000000-8888-4000-8000-000000000001",
              name: "Pile 1",
              headline: 1250.4,
              unit: m3,
              data_type: elevation,
              data_id: "s0000000-9999-4000-8000-000000000001",
              status: ready,
              created_at: "2026-09-26T15:00:00Z",
              updated_at: "2026-09-26T15:02:00Z",
            }
          - {
              kind: cloud,
              sub_kind: distance,
              id: "cm000000-1515-4000-8000-000000000001",
              name: "Distance 3",
              headline: 12.84,
              unit: m,
              data_type: point_cloud,
              data_id: "p0000000-1111-4000-8000-000000000001",
              status: ready,
              created_at: "2026-09-25T11:00:00Z",
              updated_at: "2026-09-25T11:00:00Z",
            }
        next_cursor: null
    SiteRing:
      type: array
      description: "x, y vertices in the site frame; not closed"
      minItems: 3
      maxItems: 5000
      items: { $ref: "#/components/schemas/SiteVertex" }
    VolumeMaterial:
      type: object
      required: [name, density_t_m3]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        density_t_m3:
          {
            type: number,
            exclusiveMinimum: 0,
            maximum: 30,
            description: "tonnes per cubic metre; tonnage is the net volume times this",
          }
      example: { name: "Gravel", density_t_m3: 1.8 }
    MapRunScope:
      type: string
      description: "a region run covers part of one map and never represents a survey (timeline, analytics and recounts skip it)"
      enum: [map, region]
    RunRegion:
      type: object
      description: "run a map source's model over part of one map only"
      required: [map_id, polygon_site]
      properties:
        map_id: { type: string }
        polygon_site: { $ref: "#/components/schemas/SiteRing" }
    SiteAreaCategory:
      type: string
      enum: [general, laydown, exclusion, excavation, other]
