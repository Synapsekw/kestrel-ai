      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        polygon:
          type: array
          items: { $ref: "#/components/schemas/MapPoint" }
          minItems: 3
          maxItems: 1000
    MapZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MapZone" }
    MapLabel:
