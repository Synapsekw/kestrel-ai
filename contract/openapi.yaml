        skipped: false
        model_id: "m0000000-2222-4000-8000-000000000001"
        items:
          - id: "b0000000-6666-4000-8000-000000000002"
            image_id: "10000000-5555-4000-8000-000000000001"
            class_id: "c1a2b3c4-0000-4000-8000-000000000004"
            x: 1210.5
            y: 802.0
            w: 96.0
            h: 61.0
            angle: 0.0
            confidence: 0.81
            provenance: { kind: local_model, model_id: "m0000000-2222-4000-8000-000000000001", provider: null, model_name: "yolo11m-coco", query_run_id: null }
            review_state: unreviewed
            reviewed_at: null
            created_at: "2026-09-17T11:00:00Z"

    ProvenanceKind:
      type: string
      enum: [person, local_model, cloud_provider]
    ReviewState:
      type: string
      enum: [unreviewed, accepted, rejected, edited]
    Provenance:
      type: object
      required: [kind, model_id, provider, model_name, query_run_id]
      properties:
        kind: { $ref: "#/components/schemas/ProvenanceKind" }
        model_id: { type: [string, "null"] }
        provider: { type: [string, "null"] }
        model_name: { type: [string, "null"] }
        query_run_id: { type: [string, "null"] }
      example: { kind: person, model_id: null, provider: null, model_name: null, query_run_id: null }
    Box:
      type: object
      required: [id, image_id, class_id, x, y, w, h, angle, confidence, provenance, review_state, reviewed_at, created_at]
      properties:
        id: { type: string }
        image_id: { type: string }
        class_id: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        angle:
          type: number
          minimum: 0
          exclusiveMaximum: 180
          description: >-
            Rotation in degrees about the box's own centre, clockwise in image coordinates.
            `x`, `y`, `w`, `h` always describe the unrotated box. A rectangle has 180 degree
            symmetry, so the range is [0, 180) and 190 is stored as 10.
        confidence: { type: [number, "null"] }
        provenance: { $ref: "#/components/schemas/Provenance" }
        review_state: { $ref: "#/components/schemas/ReviewState" }
        reviewed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
      example:
        id: "b0000000-6666-4000-8000-000000000001"
        image_id: "10000000-5555-4000-8000-000000000001"
        class_id: "c1a2b3c4-0000-4000-8000-000000000001"
        x: 512.0
        y: 300.0
        w: 140.0
        h: 90.0
        angle: 0.0
        confidence: null
        provenance: { kind: person, model_id: null, provider: null, model_name: null, query_run_id: null }
