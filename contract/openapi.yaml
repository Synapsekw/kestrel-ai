    WorkspaceLayerKind:
      type: string
      enum: [map, surface, drawing]
    WorkspaceLayerGroup:
      type: string
      enum: [base, elevation, drawing]
    SiteTileKind:
      type: string
      enum: [map, surface, volume_diff, drawing_raster]
    WorkspaceLayer:
      type: object
      required:
        [
          kind,
          id,
          name,
          group,
          status,
          in_frame,
          tile_kind,
          vector,
          version,
          date,
          date_is_import_date,
          footprint_site,
          max_zoom,
          meta,
          surface_kind,
          elevation_role,
          drawing_format,
          placed,
        ]
      properties:
        kind: { $ref: "#/components/schemas/WorkspaceLayerKind" }
        id: { type: string }
        name: { type: string }
        group: { $ref: "#/components/schemas/WorkspaceLayerGroup" }
        status: { type: string, enum: [importing, ready, failed] }
        in_frame:
          {
            type: boolean,
            description: "false for a map with no CRS, an item of the other frame, or a drawing not placed; such a row is listed greyed and has no tiles",
          }
        tile_kind:
          {
            oneOf:
              [{ $ref: "#/components/schemas/SiteTileKind" }, { type: "null" }],
