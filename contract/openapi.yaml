      - $ref: "#/components/parameters/projectId"
    post:
      tags: [maps]
      operationId: estimateMapRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapRunCreate" }
      responses:
        "200":
          description: windows, skipped windows and cost
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapRunEstimate" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [maps]
      operationId: createMapRun
      summary: Detect across the whole map (a `map_detect` job).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapRunCreate" }
      responses:
        "202":
          description: run created, job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapRunWithJob" }
        "409":
          description: "the project is not a detection project (`code` is `wrong_project_kind`, details `{kind, allowed}`), or the chosen library model's weights file is missing (`code` is `model_unavailable`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    get:
      tags: [maps]
      operationId: getMapRun
      responses:
        "200":
          description: the run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapRun" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [maps]
      operationId: deleteMapRun
      summary: Delete the run and its detections. 409 while its job is queued or running.
      responses:
        "204": { description: deleted }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
