        path: { type: string, description: "relative: datasets/<name>; data.yaml lives inside" }
        image_count: { type: integer }
        train_count: { type: integer }
        val_count: { type: integer }
        job_id: { type: [string, "null"], description: materialise job }
        created_at: { type: string, format: date-time }
      example:
        id: "d0000000-7777-4000-8000-000000000001"
        name: v1
        classes:
          - { id: "c1a2b3c4-0000-4000-8000-000000000001", name: excavator, colour: "#f97316", hotkey: "1", order: 0 }
        split_method: by_group
        split_params: { val_fraction: 0.2, seed: 42 }
        path: "datasets/v1"
        image_count: 30
        train_count: 24
        val_count: 6
        job_id: "j0000000-4444-4000-8000-000000000002"
        created_at: "2026-09-17T12:00:00Z"
    DatasetCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, pattern: "^[A-Za-z0-9._-]+$" }
        split_method: { $ref: "#/components/schemas/SplitMethod" }
        val_fraction: { type: number, minimum: 0.05, maximum: 0.5, default: 0.2 }
        seed: { type: integer, default: 42 }
        image_ids:
          type: array
          description: defaults to every image with at least one accepted or edited box
          items: { type: string }
      example: { name: v1, split_method: by_group, val_fraction: 0.2, seed: 42 }
    DatasetWithJob:
      type: object
      required: [dataset, job]
      properties:
        dataset: { $ref: "#/components/schemas/Dataset" }
        job: { $ref: "#/components/schemas/Job" }
    DatasetPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Dataset" }
        next_cursor: { type: [string, "null"] }
    DatasetStats:
      type: object
      required: [image_count, train_count, val_count, boxes_per_class, groups]
      properties:
        image_count: { type: integer }
        train_count: { type: integer }
        val_count: { type: integer }
        boxes_per_class:
          type: array
          items:
            type: object
            required: [class_id, class_name, train, val]
            properties:
              class_id: { type: string }
              class_name: { type: string }
              train: { type: integer }
              val: { type: integer }
        groups:
          type: array
          items:
            type: object
            required: [group_key, split, image_count]
            properties:
              group_key: { type: string }
              split: { type: string, enum: [train, val] }
              image_count: { type: integer }
      example:
        image_count: 30
        train_count: 24
        val_count: 6
        boxes_per_class:
          - { class_id: "c1a2b3c4-0000-4000-8000-000000000001", class_name: excavator, train: 31, val: 9 }
        groups:
          - { group_key: "0031", split: train, image_count: 24 }
          - { group_key: "0033", split: val, image_count: 6 }

    ClassMetrics:
      type: object
      required: [class_name, map50, map50_95, precision, recall]
      properties:
        class_name: { type: string }
        map50: { type: number }
        map50_95: { type: number }
        precision: { type: number }
        recall: { type: number }
    ModelMetrics:
      type: object
      required: [map50, map50_95, precision, recall, per_class]
      properties:
        map50: { type: number }
        map50_95: { type: number }
        precision: { type: number }
        recall: { type: number }
        per_class:
          type: array
          items: { $ref: "#/components/schemas/ClassMetrics" }
      example:
        map50: 0.71
        map50_95: 0.44
        precision: 0.78
        recall: 0.66
        per_class:
          - { class_name: excavator, map50: 0.8, map50_95: 0.5, precision: 0.82, recall: 0.7 }
    ModelProvenance:
      type: object
      description: >-
        A snapshot taken when the model was registered, never a live link: the project, dataset or
        base model it names may have been renamed, moved or deleted since. Every field is optional
        and nullable.
      properties:
        project_id: { type: [string, "null"] }
        project_name: { type: [string, "null"] }
        project_folder: { type: [string, "null"] }
        dataset_id: { type: [string, "null"] }
        dataset_name: { type: [string, "null"] }
        run_id: { type: [string, "null"], description: the training job id }
        base_model_id: { type: [string, "null"], description: the library model training started from }
        base_model_name: { type: [string, "null"] }
        source_file: { type: [string, "null"], description: the file an imported model was copied from }
      example:
        project_id: "7f1c2e3a-1111-4000-8000-000000000001"
        project_name: Ahmadia
        project_folder: "E:\\Projects\\Ahmadia"
        dataset_id: "d0000000-7777-4000-8000-000000000001"
        dataset_name: v1
        run_id: "j0000000-4444-4000-8000-000000000005"
        base_model_id: "m0000000-2222-4000-8000-000000000002"
        base_model_name: yolo11n-coco
        source_file: null
    LibraryModel:
      type: object
      description: a model in the app-wide library (`%APPDATA%\kestrel-ai\library`), usable by every project
      required: [id, name, notes, supplier, task, format, origin, state, class_names, class_aliases, provenance, hyperparameters, metrics, exports, artifacts, train_gsd_cm, sha256, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        notes: { type: string }
        supplier: { type: [string, "null"], description: "free text for imported models, e.g. the client or partner who supplied it" }
        task: { type: string, enum: [detect, obb], description: "`detect` for boxes, `obb` for rotated boxes" }
        format: { type: string, enum: [pt, onnx] }
        origin: { type: string, enum: [trained, imported, starter] }
        state: { type: string, enum: [ready, unavailable], description: "`unavailable` when the weights file is missing from the library folder" }
        class_names:
          type: array
          description: class names the weights predict, in index order
          items: { type: string }
        class_aliases:
          type: object
          description: model class name to project class name (for COCO weights, `truck` to `dump_truck`)
          additionalProperties: { type: string }
        provenance: { $ref: "#/components/schemas/ModelProvenance" }
        hyperparameters:
          type: object
          additionalProperties: true
        metrics:
          oneOf:
            - $ref: "#/components/schemas/ModelMetrics"
            - type: "null"
        exports:
          type: object
          description: "format to path relative to the model's library folder, e.g. `{onnx: exports/weights.onnx}`"
          additionalProperties: { type: string }
        artifacts:
          type: object
          description: "training artifacts present, keyed `results_csv`, `confusion_matrix`, `pr_curve`; paths relative to the model's library folder"
          additionalProperties: { type: string }
        train_gsd_cm: { type: [number, "null"], description: ground size of one pixel in the training images, in centimetres; the default target GSD for map runs }
        sha256: { type: string, description: of the weights file; the same file cannot be added twice }
        created_at: { type: string, format: date-time }
      example:
        id: "m0000000-2222-4000-8000-000000000001"
        name: ahmadia-v1-n
        notes: "First model trained on the April flights."
        supplier: null
        task: detect
        format: pt
        origin: trained
        state: ready
        class_names: [excavator, dump_truck]
        class_aliases: {}
        provenance:
          project_id: "7f1c2e3a-1111-4000-8000-000000000001"
          project_name: Ahmadia
          project_folder: "E:\\Projects\\Ahmadia"
          dataset_id: "d0000000-7777-4000-8000-000000000001"
          dataset_name: v1
          run_id: "j0000000-4444-4000-8000-000000000005"
          base_model_id: "m0000000-2222-4000-8000-000000000002"
          base_model_name: yolo11n-coco
          source_file: null
        hyperparameters: { epochs: 50, imgsz: 1280, batch: 8, patience: 50, augmentation: aerial }
        metrics:
          map50: 0.71
          map50_95: 0.44
          precision: 0.78
          recall: 0.66
          per_class:
            - { class_name: excavator, map50: 0.8, map50_95: 0.5, precision: 0.82, recall: 0.7 }
            - { class_name: dump_truck, map50: 0.62, map50_95: 0.38, precision: 0.74, recall: 0.62 }
        exports: { onnx: "exports/weights.onnx" }
        artifacts: { results_csv: "artifacts/results.csv", confusion_matrix: "artifacts/confusion_matrix.png", pr_curve: "artifacts/PR_curve.png" }
        train_gsd_cm: 2.0
        sha256: "9f2c4a1b7e3d5f6a8b0c2d4e6f8a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f2a"
        created_at: "2026-09-18T09:00:00Z"
    LibraryModelPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LibraryModel" }
        next_cursor: { type: [string, "null"] }
      example:
        items:
          - id: "m0000000-2222-4000-8000-000000000001"
            name: ahmadia-v1-n
            notes: "First model trained on the April flights."
            supplier: null
            task: detect
            format: pt
            origin: trained
            state: ready
            class_names: [excavator, dump_truck]
            class_aliases: {}
            provenance:
              project_id: "7f1c2e3a-1111-4000-8000-000000000001"
              project_name: Ahmadia
              project_folder: "E:\\Projects\\Ahmadia"
              dataset_id: "d0000000-7777-4000-8000-000000000001"
              dataset_name: v1
              run_id: "j0000000-4444-4000-8000-000000000005"
              base_model_id: "m0000000-2222-4000-8000-000000000002"
              base_model_name: yolo11n-coco
              source_file: null
            hyperparameters: { epochs: 50, imgsz: 1280, batch: 8, patience: 50, augmentation: aerial }
            metrics:
              map50: 0.71
              map50_95: 0.44
              precision: 0.78
              recall: 0.66
              per_class:
                - { class_name: excavator, map50: 0.8, map50_95: 0.5, precision: 0.82, recall: 0.7 }
                - { class_name: dump_truck, map50: 0.62, map50_95: 0.38, precision: 0.74, recall: 0.62 }
            exports: { onnx: "exports/weights.onnx" }
            artifacts: { results_csv: "artifacts/results.csv", confusion_matrix: "artifacts/confusion_matrix.png", pr_curve: "artifacts/PR_curve.png" }
            train_gsd_cm: 2.0
            sha256: "9f2c4a1b7e3d5f6a8b0c2d4e6f8a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f2a"
            created_at: "2026-09-18T09:00:00Z"
          - id: "m0000000-2222-4000-8000-000000000002"
            name: yolo11n-coco
            notes: ""
            supplier: null
            task: detect
            format: pt
            origin: starter
            state: ready
            class_names: [person, bicycle, car, motorcycle, airplane, bus, train, truck]
            class_aliases: { truck: dump_truck }
            provenance: {}
            hyperparameters: {}
            metrics: null
            exports: {}
            artifacts: {}
            train_gsd_cm: null
            sha256: "0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c"
            created_at: "2026-09-17T10:10:00Z"
        next_cursor: null
    LibraryModelImport:
      type: object
      required: [name, weights_path]
      properties:
        name: { type: string, minLength: 1 }
        weights_path: { type: string, minLength: 1, description: absolute path to an existing .pt file (404 not_found when missing or not absolute); copied into the library, the original is only read }
        class_aliases:
          type: object
          default: {}
          additionalProperties: { type: string }
        supplier: { type: [string, "null"], description: who supplied the model, free text }
      example: { name: client-x-machinery, weights_path: "E:\\Models\\client-x\\best.pt", class_aliases: { truck: dump_truck }, supplier: "Client X" }
    LibraryModelPatch:
      type: object
      description: every field is optional
      properties:
        name: { type: string, minLength: 1 }
        notes: { type: string }
        supplier: { type: [string, "null"] }
        class_aliases:
          type: object
          additionalProperties: { type: string }
      example: { name: ahmadia-v1-n, notes: "Good on excavators, weak on small trucks.", supplier: null }
    ModelUsage:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          description: recently opened projects that use the model; projects that are not on the recent list are not scanned
          items:
            type: object
            required: [project_id, name, folder, preannotation, query_runs, map_runs]
            properties:
              project_id: { type: string }
              name: { type: string }
              folder: { type: string }
              preannotation: { type: boolean, description: the project's pre-annotation model is this model }
              query_runs: { type: integer, description: detection runs on images that used the model }
              map_runs: { type: integer, description: map runs that used the model }
      example:
        projects:
          - { project_id: "7f1c2e3a-1111-4000-8000-000000000001", name: Ahmadia, folder: "E:\\Projects\\Ahmadia", preannotation: true, query_runs: 2, map_runs: 1 }
    LibraryStatus:
      type: object
      required: [available, root, error]
      properties:
        available: { type: boolean }
        root: { type: string, description: absolute path of the library folder }
        error: { type: [string, "null"], description: why the library could not be opened; null when it is available }
      example: { available: true, root: "C:\\Users\\operator\\AppData\\Roaming\\kestrel-ai\\library", error: null }
    StarterAcquire:
      type: object
      properties:
        name: { type: [string, "null"], minLength: 1, description: "library name; defaults to `<key>-coco`" }
      example: { name: yolo11n-coco }
    AdoptionStatus:
      type: object
      required: [pending, adopted, missing, job_id]
      properties:
        pending: { type: integer, description: old project models not yet in the library }
        adopted: { type: integer, description: old project models now in the library }
        missing:
          type: array
          description: old project models that could not be adopted
          items:
            type: object
            required: [old_model_id, name, error]
            properties:
              old_model_id: { type: string }
              name: { type: string }
              error: { type: string }
        job_id: { type: [string, "null"], description: the adoption job that is queued or running }
      example:
        pending: 0
        adopted: 3
        missing: []
        job_id: null
    StarterModelKey:
      type: string
      enum: [yolo26n, yolo26s, yolo26m, yolo26l, yolo26x, yolo12n, yolo12s, yolo12m, yolo12l, yolo12x, yolo11n, yolo11s, yolo11m, yolo11l, yolo11x, yolov10n, yolov10s, yolov10m, yolov10b, yolov10l, yolov10x, yolov9t, yolov9s, yolov9m, yolov9c, yolov9e, yolov8n, yolov8s, yolov8m, yolov8l, yolov8x, yolov5nu, yolov5su, yolov5mu, yolov5lu, yolov5xu, yolov5n6u, yolov5s6u, yolov5m6u, yolov5l6u, yolov5x6u, yolov3u, yolov3-tinyu, yolov3-sppu]
    StarterModel:
      type: object
      required: [key, name, description, size_mb, available]
      properties:
        key: { $ref: "#/components/schemas/StarterModelKey" }
        name: { type: string }
        description: { type: string, description: one sentence for the operator on when to pick this size }
        size_mb: { type: number, description: size of the bundled file, 0 when it is not available }
        available: { type: boolean }
        family: { type: string, description: YOLO generation displayed in the model selector }
        task: { type: string, enum: [detect], description: axis-aligned box detection supported by the current training pipeline }
      example:
        key: yolo11n
        name: YOLO11 nano
        description: Fastest to train and run; the right first choice for a new project.
        size_mb: 5.4
        available: true
    StarterModelPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StarterModel" }
        next_cursor: { type: [string, "null"], description: always null, the catalogue is one page }
    TrainRequest:
      type: object
      required: [name, dataset_id, base_model_id]
      properties:
        name: { type: string, minLength: 1 }
        dataset_id: { type: string }
        base_model_id: { type: string, description: "a library model id (any library model, including starter COCO weights)" }
        epochs: { type: integer, minimum: 1, maximum: 1000, default: 50 }
        imgsz: { type: integer, minimum: 320, maximum: 4096, default: 1280 }
        batch: { type: [integer, "null"], description: null = auto }
        patience: { type: integer, minimum: 0, default: 50 }
        augmentation:
          type: string
          enum: [default, aerial]
          default: default
        device: { type: string, default: "0", description: "\"0\" for the first GPU, \"cpu\" otherwise" }
      example: { name: ahmadia-v1-n, dataset_id: "d0000000-7777-4000-8000-000000000001", base_model_id: "m0000000-2222-4000-8000-000000000002", epochs: 3, imgsz: 1280, batch: null, patience: 50, augmentation: aerial, device: "0" }
    ExportRequest:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [onnx, engine]
        imgsz: { type: integer, minimum: 320, maximum: 4096, default: 1280 }
        half: { type: boolean, default: false, description: FP16; only meaningful for engine (built on GPU 0); onnx is exported on the CPU }
      example: { format: onnx, imgsz: 1280 }
    JobRef:
      type: object
      required: [job]
      properties:
        job: { $ref: "#/components/schemas/Job" }

    AgentMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 2000 }
    AgentPlan:
      type: object
      additionalProperties: false
      required: [name, classes, starter_model_key, image_guidance, labeling_query]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        classes:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        starter_model_key: { $ref: "#/components/schemas/StarterModelKey" }
        image_guidance: { type: string, minLength: 1, maxLength: 4000 }
        labeling_query: { type: string, minLength: 1, maxLength: 2000 }
      example:
        name: Site machinery
        classes: [excavator, dump_truck]
        starter_model_key: yolo11n
        image_guidance: Choose varied flights, lighting and camera angles. Include empty scenes and avoid near-duplicate consecutive frames.
        labeling_query: Find every excavator and dump truck. Draw a tight bounding box around each visible machine.
    AgentChatRequest:
      type: object
      additionalProperties: false
      required: [provider, messages]
      properties:
        provider: { $ref: "#/components/schemas/ProviderName" }
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: "#/components/schemas/AgentMessage" }
        plan:
          anyOf:
            - $ref: "#/components/schemas/AgentPlan"
            - type: "null"
      example:
        provider: openai
        messages: [{ role: user, content: Help me detect excavators and dump trucks in aerial photos. }]
    AgentChatResponse:
      type: object
      additionalProperties: false
      required: [message, plan, model_name]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
        plan:
          anyOf:
            - $ref: "#/components/schemas/AgentPlan"
            - type: "null"
        model_name: { type: string }

    AgentTurnState:
      type: string
      enum: [running, awaiting_approval, succeeded, failed, cancelled]
    AgentToolStatus:
      type: string
      enum: [running, ok, error, denied, awaiting_approval]
    AgentTurnCreate:
      type: object
      additionalProperties: false
      required: [provider, message]
      properties:
        provider: { $ref: "#/components/schemas/ProviderName" }
        message: { type: string, minLength: 1, maxLength: 4000 }
      example: { provider: anthropic, message: "Label the first 500 images with excavator and dump_truck" }
    AgentApprovalDecision:
      type: object
      additionalProperties: false
      required: [approve]
      properties:
        approve: { type: boolean }
      example: { approve: true }
    AgentApproval:
      type: object
      required: [title, detail, estimated_cost]
      properties:
        title: { type: string }
        detail: { type: string }
        estimated_cost: { type: [number, "null"], description: USD, for cloud labeling }
      example: { title: "Label 500 images with Claude", detail: "500 images, 4000 requests to anthropic", estimated_cost: 80.0 }
    AgentNavigate:
      type: object
      required: [screen, image_id]
      properties:
        screen:
          type: string
          enum: [home, images, label, review, datasets, models, train, detect, export, settings, editor]
        image_id: { type: [string, "null"] }
    AgentTurn:
      type: object
      required: [id, state, provider, model_name, error, tool_calls, created_at, finished_at]
      properties:
        id: { type: string }
        state: { $ref: "#/components/schemas/AgentTurnState" }
        provider: { $ref: "#/components/schemas/ProviderName" }
        model_name: { type: string }
        error: { type: [string, "null"] }
        tool_calls: { type: integer, description: tool calls made so far in this turn }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
      example:
        id: "t0000000-9999-4000-8000-000000000001"
        state: running
        provider: anthropic
        model_name: claude-opus-5
        error: null
        tool_calls: 2
        created_at: "2026-09-22T10:00:00Z"
        finished_at: null
    AgentItem:
      type: object
      required: [id, seq, turn_id, kind, text, tool_name, tool_input, tool_status, tool_summary, job_ids, approval, navigate, created_at]
      properties:
        id: { type: string }
        seq: { type: integer }
        turn_id: { type: string }
        kind:
          type: string
          enum: [user, assistant, tool]
        text: { type: string, description: message text; empty for tool items }
        tool_name: { type: [string, "null"] }
        tool_input:
          type: [object, "null"]
          additionalProperties: true
        tool_status:
          anyOf:
            - $ref: "#/components/schemas/AgentToolStatus"
            - type: "null"
        tool_summary: { type: [string, "null"], description: short human-readable outcome }
        job_ids:
          type: array
          items: { type: string }
        approval:
          anyOf:
            - $ref: "#/components/schemas/AgentApproval"
            - type: "null"
        navigate:
          anyOf:
            - $ref: "#/components/schemas/AgentNavigate"
            - type: "null"
        created_at: { type: string, format: date-time }
      example:
        id: "i0000000-9999-4000-8000-000000000002"
        seq: 2
        turn_id: "t0000000-9999-4000-8000-000000000001"
        kind: tool
        text: ""
        tool_name: label_images
        tool_input: { selection: { sort: path, order: asc, offset: 0, limit: 500 } }
        tool_status: ok
        tool_summary: "Started labeling 500 images"
        job_ids: ["j0000000-4444-4000-8000-000000000003"]
        approval: null
        navigate: null
        created_at: "2026-09-22T10:00:05Z"
    AgentConversation:
      type: object
      required: [items, turn]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentItem" }
        turn:
          anyOf:
            - $ref: "#/components/schemas/AgentTurn"
            - type: "null"
      example: { items: [], turn: null }

    ProviderName:
      type: string
      enum: [openai, anthropic]
    Provider:
      type: object
      required: [name, has_key, model_name, requests_per_minute, cost_per_request]
      properties:
        name: { $ref: "#/components/schemas/ProviderName" }
        has_key: { type: boolean, description: whether a key is stored in Credential Manager }
        model_name: { type: string }
        requests_per_minute: { type: integer }
        cost_per_request: { type: number, description: USD per request, user-editable estimate }
      example: { name: anthropic, has_key: true, model_name: claude-opus-5, requests_per_minute: 30, cost_per_request: 0.02 }
    ProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Provider" }
      example:
        items:
          - { name: openai, has_key: false, model_name: gpt-5, requests_per_minute: 30, cost_per_request: 0.02 }
          - { name: anthropic, has_key: true, model_name: claude-opus-5, requests_per_minute: 30, cost_per_request: 0.02 }
    ProviderUpdate:
      type: object
      properties:
        model_name: { type: string, minLength: 1 }
        requests_per_minute: { type: integer, minimum: 1, maximum: 10000 }
        cost_per_request: { type: number, minimum: 0 }
      example: { model_name: claude-opus-5, requests_per_minute: 30 }
    ProviderKey:
      type: object
      required: [api_key]
      properties:
        api_key: { type: string, minLength: 1, format: password }
      example: { api_key: "sk-…" }
    ProviderTestResult:
      type: object
      required: [ok, message, model_name]
      properties:
        ok: { type: boolean }
        message: { type: string }
        model_name: { type: string }
      example: { ok: true, message: "responded in 1.2 s", model_name: claude-opus-5 }

    Tiling:
      type: object
      required: [enabled, tile_size, overlap, nms_iou]
      properties:
        enabled: { type: boolean, default: true }
        tile_size: { type: integer, minimum: 256, maximum: 4096, default: 1280 }
        overlap: { type: number, minimum: 0, maximum: 0.5, default: 0.2 }
        nms_iou: { type: number, minimum: 0, maximum: 1, default: 0.5 }
      example: { enabled: true, tile_size: 1280, overlap: 0.2, nms_iou: 0.5 }
    QueryRunKind:
      type: string
      enum: [local_model, cloud_provider]
    QueryRun:
      type: object
      required: [id, kind, source_id, model_id, provider, model_name, model_snapshot, class_map, query, image_ids, tiling, conf, job_id, box_count, pinned, counts, verified_counts, promoted_at, created_at]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/QueryRunKind" }
        source_id: { type: [string, "null"], description: the photo source the run covers; null for runs started before runs belonged to sources }
        model_snapshot: { $ref: "#/components/schemas/ModelSnapshot" }
        class_map: { $ref: "#/components/schemas/RunClassMap" }
        pinned: { type: boolean, description: "the operator's choice of this run to represent its source" }
        counts: { type: object, additionalProperties: { type: integer }, description: "detections per project class id, every review state except rejected" }
        verified_counts: { type: object, additionalProperties: { type: integer }, description: "detections per project class id that are accepted, edited or drawn by a person" }
        model_id: { type: [string, "null"] }
        provider: { type: [string, "null"] }
        model_name: { type: [string, "null"] }
        query: { type: string, description: free text for cloud providers; empty for local models }
        image_ids:
          type: array
          items: { type: string }
        tiling: { $ref: "#/components/schemas/Tiling" }
        conf: { type: number, description: confidence threshold applied to results }
        job_id: { type: [string, "null"] }
        box_count: { type: integer, description: boxes written so far }
        promoted_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
      example:
        id: "q0000000-8888-4000-8000-000000000001"
        kind: cloud_provider
        model_id: null
        provider: anthropic
        model_name: claude-opus-5
        query: dump trucks
        image_ids: ["10000000-5555-4000-8000-000000000001", "10000000-5555-4000-8000-000000000002"]
        tiling: { enabled: true, tile_size: 1280, overlap: 0.2, nms_iou: 0.5 }
        conf: 0.25
        job_id: "j0000000-4444-4000-8000-000000000003"
        box_count: 7
        source_id: "50000000-3333-4000-8000-000000000001"
        model_snapshot: {}
        class_map: {}
        pinned: false
        counts: { "c1a2b3c4-0000-4000-8000-000000000001": 7 }
        verified_counts: {}
        promoted_at: null
        created_at: "2026-09-17T13:00:00Z"
    QueryRunCreate:
      type: object
      required: [kind, image_ids]
      properties:
        kind: { $ref: "#/components/schemas/QueryRunKind" }
        model_id: { type: string, description: "a library model id; required for local_model" }
        provider: { $ref: "#/components/schemas/ProviderName" }
        query: { type: string, minLength: 1, description: required for cloud_provider, e.g. "dump trucks" }
        image_ids:
          type: array
          items: { type: string }
          minItems: 1
        tiling: { $ref: "#/components/schemas/Tiling" }
        conf: { type: number, minimum: 0, maximum: 1, default: 0.25 }
      example: { kind: cloud_provider, provider: anthropic, query: dump trucks, image_ids: ["10000000-5555-4000-8000-000000000001"], tiling: { enabled: true, tile_size: 1280, overlap: 0.2, nms_iou: 0.5 }, conf: 0.25 }
    QueryRunWithJob:
      type: object
      required: [query_run, job]
      properties:
        query_run: { $ref: "#/components/schemas/QueryRun" }
        job: { $ref: "#/components/schemas/Job" }
    QueryRunPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QueryRun" }
        next_cursor: { type: [string, "null"] }
    CostEstimate:
      type: object
      required: [images, tiles, requests, cost_per_request, estimated_cost]
      properties:
        images: { type: integer }
        tiles: { type: integer, description: total tiles across all images }
        requests: { type: integer }
        cost_per_request: { type: number }
        estimated_cost: { type: number, description: USD; 0 for local models }
      example: { images: 5, tiles: 40, requests: 40, cost_per_request: 0.02, estimated_cost: 0.8 }
    GeoMapStatus:
      type: string
      enum: [importing, ready, failed]
    TileGrid:
      type: object
      description: 256 px tiles in the map's pixel grid. At zoom z one tile pixel covers 2^(max_zoom - z) map pixels.
      required: [tile_size, max_zoom]
      properties:
        tile_size: { type: integer, enum: [256] }
        max_zoom: { type: integer, minimum: 0 }
    GeoMapPatch:
      type: object
      additionalProperties: false
      properties:
        captured_on: { type: [string, "null"], format: date, description: when the imagery was flown; null clears it }
    SurveyBasis:
      type: object
      required: [model_id, model_name, conf]
      properties:
        model_id: { type: [string, "null"] }
        model_name: { type: [string, "null"] }
        conf: { type: number }
    SurveyClass:
      type: object
      required: [id, name, colour]
      properties:
        id: { type: string }
        name: { type: string }
        colour: { type: string }
    Survey:
      type: object
      required: [map_id, map_name, captured_on, date_is_import_date, run_id, model_name, conf, pinned, counts, verified_counts, deltas, state, reason]
      properties:
        map_id: { type: string }
        map_name: { type: string }
        captured_on: { type: [string, "null"], format: date }
        date_is_import_date: { type: boolean, description: the date shown is the import date, because the survey date is unknown }
        run_id: { type: [string, "null"] }
        model_name: { type: [string, "null"] }
        conf: { type: [number, "null"] }
        pinned: { type: boolean, description: the run was pinned by the operator rather than picked by the comparison rule }
        counts: { type: object, additionalProperties: { type: integer }, description: "per class id: the total, or the verified count when `verified_only` was asked for" }
        verified_counts: { type: object, additionalProperties: { type: integer }, description: "per class id: accepted, edited or drawn by a person" }
        deltas: { type: object, additionalProperties: { type: integer }, description: change since the previous comparable survey; absent for a class that survey did not have }
        state: { type: string, enum: [ok, not_comparable, not_counted] }
        reason: { type: [string, "null"], description: why this survey cannot be compared }
    SurveyTimeline:
      type: object
      required: [basis, classes, surveys]
      properties:
        basis: { oneOf: [{ $ref: "#/components/schemas/SurveyBasis" }, { type: "null" }] }
        classes:
          type: array
          items: { $ref: "#/components/schemas/SurveyClass" }
        surveys:
          type: array
          description: oldest first
          items: { $ref: "#/components/schemas/Survey" }
    GeoMap:
      type: object
      required: [id, name, status, error, source_path, source_size, width, height, band_count, dtype, crs_wkt, epsg, proj4, geotransform, bounds_native, bounds_wgs84, gsd_cm, captured_on, tile_grid, labels_version, job_id, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/GeoMapStatus" }
        error: { type: [string, "null"] }
        captured_on: { type: [string, "null"], format: date, description: when the imagery was flown; null until known }
        source_path: { type: string, description: the original file; never copied or modified }
        source_size: { type: integer }
        width: { type: integer }
        height: { type: integer }
        band_count: { type: integer }
        dtype: { type: string }
        crs_wkt: { type: [string, "null"], description: null when the file has no coordinates }
        epsg: { type: [integer, "null"] }
        proj4: { type: [string, "null"], description: for the client-side coordinate readout }
        geotransform:
          type: [array, "null"]
          description: GDAL order (x0, px_w, row_rot, y0, col_rot, px_h)
          items: { type: number }
          minItems: 6
          maxItems: 6
        bounds_native:
          type: [array, "null"]
          description: minx, miny, maxx, maxy in the map CRS
          items: { type: number }
          minItems: 4
          maxItems: 4
        bounds_wgs84:
          type: [array, "null"]
          description: west, south, east, north
          items: { type: number }
          minItems: 4
          maxItems: 4
        gsd_cm: { type: [number, "null"], description: ground size of one pixel in centimetres }
        tile_grid: { $ref: "#/components/schemas/TileGrid" }
        labels_version: { type: integer }
        job_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
      example:
        id: "a0000000-6666-4000-8000-000000000001"
        name: "Site north ortho"
        status: ready
        error: null
        captured_on: "2026-04-15"
        source_path: "D:/orthos/site-north.tif"
        source_size: 3221225472
        width: 80000
        height: 60000
        band_count: 4
        dtype: uint8
        crs_wkt: "PROJCS[\"WGS 84 / UTM zone 33N\"]"
        epsg: 32633
        proj4: "+proj=utm +zone=33 +datum=WGS84 +units=m +no_defs"
        geotransform: [500000, 0.03, 0, 4983000, 0, -0.03]
        bounds_native: [500000, 4981200, 502400, 4983000]
        bounds_wgs84: [15.0, 44.98, 15.03, 45.0]
        gsd_cm: 3.0
        tile_grid: { tile_size: 256, max_zoom: 9 }
        labels_version: 3
        job_id: "j0000000-4444-4000-8000-000000000001"
        created_at: "2026-09-22T10:00:00Z"
    GeoMapCreate:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, description: absolute path of a .tif/.tiff file }
        name: { type: string, minLength: 1, maxLength: 200 }
    GeoMapWithJob:
      type: object
      required: [map, job]
      properties:
        map: { $ref: "#/components/schemas/GeoMap" }
        job: { $ref: "#/components/schemas/Job" }
    GeoMapList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GeoMap" }
    MapRunCreate:
      type: object
      required: [map_id, kind]
      properties:
        map_id: { type: string }
        kind: { $ref: "#/components/schemas/QueryRunKind" }
        model_id: { type: string, description: "a library model id; required for local_model" }
        provider: { $ref: "#/components/schemas/ProviderName" }
        query: { type: string, minLength: 1, description: required for cloud_provider }
        tile_size: { type: integer, minimum: 256, maximum: 4096, default: 1280 }
        overlap: { type: number, minimum: 0, maximum: 0.5, default: 0.2 }
        nms_iou: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        conf: { type: number, minimum: 0, maximum: 1, default: 0.25 }
        target_gsd_cm:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: the model's training GSD; windows are resampled to it when it differs from the map's by more than 15 %
      example: { map_id: "a0000000-6666-4000-8000-000000000001", kind: local_model, model_id: "m0000000-2222-4000-8000-000000000001", tile_size: 1280, overlap: 0.2, nms_iou: 0.5, conf: 0.25, target_gsd_cm: 2.0 }
    MapRun:
      type: object
      required: [id, map_id, source_id, kind, model_id, provider, model_name, model_snapshot, class_map, query, tile_size, overlap, nms_iou, conf, target_gsd_cm, job_id, state, pinned, counts, verified_counts, area_counts, detection_count, created_at]
      properties:
        id: { type: string }
        map_id: { type: string }
        source_id: { type: [string, "null"], description: the map source; null for runs on maps imported before maps had sources }
        model_snapshot: { $ref: "#/components/schemas/ModelSnapshot" }
        class_map: { $ref: "#/components/schemas/RunClassMap" }
        pinned: { type: boolean, description: "the operator's choice of this run to represent its map in analytics and the survey timeline" }
        verified_counts: { type: object, additionalProperties: { type: integer }, description: "objects per project class id that are accepted, edited or drawn by a person" }
        area_counts:
          type: object
          description: "per site area id, per class id: `{total, verified}`; an area that does not overlap the map has no key"
          additionalProperties:
            type: object
            additionalProperties: { $ref: "#/components/schemas/CountPair" }
        kind: { $ref: "#/components/schemas/QueryRunKind" }
        model_id: { type: [string, "null"] }
        provider: { type: [string, "null"] }
        model_name: { type: [string, "null"] }
        query: { type: string }
        tile_size: { type: integer }
        overlap: { type: number }
        nms_iou: { type: number }
        conf: { type: number }
        target_gsd_cm: { type: [number, "null"] }
        job_id: { type: [string, "null"] }
        state:
          description: the state of the run's latest job; null before one exists
          oneOf:
            - { $ref: "#/components/schemas/JobState" }
            - { type: "null" }
        counts:
          type: object
          description: "detections per class id in every review state except rejected (the total); filled when the run finishes and kept current by review"
          additionalProperties: { type: integer }
        detection_count: { type: integer }
        created_at: { type: string, format: date-time }
      example:
        id: "r0000000-7777-4000-8000-000000000001"
        map_id: "a0000000-6666-4000-8000-000000000001"
        kind: local_model
        model_id: "m0000000-2222-4000-8000-000000000001"
        provider: null
        model_name: "machinery-v3"
        query: ""
        tile_size: 1280
        overlap: 0.2
        nms_iou: 0.5
        conf: 0.25
        target_gsd_cm: 2.0
        job_id: "j0000000-4444-4000-8000-000000000001"
        state: succeeded
        counts: { "c1a2b3c4-0000-4000-8000-000000000001": 42, "c1a2b3c4-0000-4000-8000-000000000004": 17 }
        source_id: "50000000-3333-4000-8000-000000000002"
        model_snapshot: { id: "m0000000-2222-4000-8000-000000000001", name: "machinery-v3", task: detect, format: pt, class_names: [excavator, "dump truck"], origin: trained }
        class_map: { "excavator": "c1a2b3c4-0000-4000-8000-000000000001", "dump truck": "c1a2b3c4-0000-4000-8000-000000000004" }
        pinned: false
        verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 30 }
        area_counts:
          "5a000000-aaaa-4000-8000-000000000001":
            "c1a2b3c4-0000-4000-8000-000000000001": { total: 12, verified: 9 }
        detection_count: 59
        created_at: "2026-09-22T11:00:00Z"
    MapRunWithJob:
      type: object
      required: [run, job]
      properties:
        run: { $ref: "#/components/schemas/MapRun" }
        job: { $ref: "#/components/schemas/Job" }
    MapRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MapRun" }
    MapRunEstimate:
      type: object
      required: [windows, skipped_windows, requests, scale, cost_per_request, estimated_cost]
