openapi: 3.1.0
info:
  title: Kestrel AI backend API
  version: 1.0.0
  description: |
    Contract between the Tauri/React frontend and the FastAPI sidecar. This file is the
    source of truth (spec section 2). The backend validates responses against it in tests,
    the TypeScript client is generated from it, and Prism serves it as the mock server.

    Conventions:
    - Every path below carries the `/api/v1` prefix. JSON bodies, UTF-8.
    - Every request carries the per-launch token, either as `Authorization: Bearer <token>`
      or as a `token` query parameter (needed for `<img>` sources and websocket connects).
    - Ids are UUID strings. Timestamps are RFC 3339 strings in UTC.
    - Boxes are in image pixels: `x, y` top-left corner, `w, h` size.
    - Every list endpoint paginates with `limit` and `cursor` and returns `next_cursor`
      (`null` when there is no further page).
    - Every error uses the `Error` envelope `{error: {code, message, details}}`.
    - Long work returns a `Job`; progress arrives over the websocket described in
      `x-websocket` and can be polled through the `jobs` resource.
servers:
  - url: http://127.0.0.1:8765
    description: development backend origin (the packaged app uses a random free port)
  - url: http://127.0.0.1:4010
    description: Prism mock server
security:
  - bearerAuth: []
  - tokenQuery: []

x-websocket:
  path: /api/v1/events
  query: token=<per-launch token>
  description: |
    One websocket per UI instance. The server pushes `Event` objects as JSON text frames and
    never expects messages from the client. Rejected tokens are closed with code 4401 before
    the handshake completes. Event types:
    - `job.progress`: `progress` 0..1 and `message`; `payload` is `{}`.
    - `job.state`: `payload` is `{state, result, error}` for the job.
    - `images.changed`: `payload` is `{source_id, count}` after an import batch lands.
    - `boxes.changed`: `payload` is `{image_ids: [...]}` after proposals or reviews are written by a job.
    - `agent.changed`: `payload` is `{turn_id, state}` whenever the project agent's turn or transcript changes.
    - `maps.changed`: `payload` is `{map_ids: [...]}` after a GeoTIFF map is imported or updated.
    - `map_runs.changed`: `payload` is `{map_id, run_ids: [...]}` after a map detection run finishes.
    - `map_labels.changed`: `payload` is `{map_id}` after a zone or ground-truth label changes.
    - `pointclouds.changed`: `payload` is `{cloud_ids: [...]}` after a point cloud is created, changes
      status, is patched or deleted, one of its measurements changes (a profile turning `ready` or
      `failed` included), a camera height offset is set, or a report view is stored.
    - `surfaces.changed`: `payload` is `{surface_ids: [...]}` after a surface (cloud DSM or design)
      is created, built, renamed or deleted, or its build is cancelled before it started.
    - `volumes.changed`: `payload` is `{measurement_ids: [...]}` after a volume measurement is
      created, calculated, changed, becomes stale or is deleted; also when a detection run it masks
      with is reviewed, gets a drawn box, or is deleted (with its map or on its own).
    - `findings.changed`: `payload` is `{ids: [...]}` (at most 100 finding ids) or `{all: true}`
      after findings are created, changed or deleted, by a person, a box hook or a job.
    - `data.changed`: `payload` is `{types: [...]}` (data item types) after a data item of those
      types is created, changes status, is renamed or is deleted.
    - `catalogue.changed`: `project_id` is `library`; `payload` is `{type_ids: [...]}` after catalogue
      types change, or `{severity: true}` after the severity scale changes.
    - `migration.changed`: `project_id` is the migrated project's id; `payload` is
      `{folder, state, job_id}` whenever a project's migration state changes (`MigrationState`).
    - `drawings.changed`: `payload` is `{drawing_ids: [...]}` after a drawing is created, imported,
      placed, patched or deleted.
    - `map_measurements.changed`: `payload` is `{measurement_ids: [...]}` after a map measurement is
      created, changed or deleted.
    - `map_workspace.changed`: `payload` is `{fields: [...]}` (`frame`, `state`, `planned_surveys`)
      after the site frame or the persisted map workspace changes.
  message: "#/components/schemas/Event"

tags:
  - name: health
  - name: projects
  - name: sources
  - name: images
  - name: boxes
  - name: image-detect
  - name: assist
  - name: datasets
  - name: models
  - name: library
  - name: providers
  - name: query-runs
  - name: exports
  - name: jobs
  - name: agent
  - name: maps
  - name: detect
  - name: pointclouds
  - name: surfaces
  - name: volumes
  - name: catalogue
  - name: findings
  - name: data
  - name: workspace

paths:
  /api/v1/agent/chat:
    post:
      tags: [agent]
      operationId: chatWithSetupAgent
      summary: Plan a project with the configured cloud provider. No files or project data are changed.
      description: Bounded text conversation using the existing Credential Manager key. Cloud calls time out after 45 seconds. Missing credentials or a busy agent return 409; provider failures return a sanitized error. A draft must be applied through the ordinary project and background-job endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentChatRequest" }
      responses:
        "200":
          description: guidance and an optional editable project draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentChatResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and version. The launcher polls this until it returns 200.
      responses:
        "200":
          description: backend is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        default: { $ref: "#/components/responses/Error" }

  # ----------------------------------------------------------------- projects
  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: "Recently opened projects, most recent first. A project whose folder or project.db no longer exists is listed with availability missing."
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: recent projects
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project in an empty or new folder and open it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: created and opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409":
          description: the folder already contains a project (`code` is `already_exists`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/open:
    post:
      tags: [projects]
      operationId: openProject
      summary: Open an existing project folder (one that contains `project.db`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectOpen" }
      responses:
        "200":
          description: opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404":
          description: no project in that folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200":
          description: the project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Update name, pre-annotation model or import defaults (project settings screen).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [projects]
      operationId: forgetProject
      summary: Remove the project from the recent list. The project folder and everything in it stay on disk; "Open folder" brings it back.
      responses:
        "204":
          description: forgotten
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/stats:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [projects]
      operationId: getProjectStats
      summary: Statistics over all sources (spec section 5).
      responses:
        "200":
          description: statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ sources
  /api/v1/projects/{projectId}/sources:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [sources]
      operationId: listSources
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcePage" }
              example:
                items:
                  - id: "50000000-3333-4000-8000-000000000001"
                    kind: images
                    label: "Flight 15 Apr"
                    captured_on: "2019-04-15"
                    map_id: null
                    folder: "E:\\Dev\\Yolo\\Ahmadia Construction Data"
                    site: ahmadia
                    settings: { max_side: 4000, quality: 95, dedupe_threshold: 4, group_regex: "^(?P<camera>[A-Za-z0-9-]+)_(?P<flight>\\d+)_(?P<frame>\\d+)" }
                    image_count: 3299
                    duplicate_count: 0
                    job_id: "j0000000-4444-4000-8000-000000000001"
                    imported_at: "2026-09-17T10:30:00Z"
                    created_at: "2026-09-17T10:05:00Z"
                  - id: "50000000-3333-4000-8000-000000000002"
                    kind: map
                    label: "May survey"
                    captured_on: "2026-05-20"
                    map_id: "a0000000-6666-4000-8000-000000000001"
                    folder: "D:\\Surveys\\may-ortho.tif"
                    site: may-ortho
                    settings: { max_side: 4000, quality: 95, dedupe_threshold: 4 }
                    image_count: 0
                    duplicate_count: 0
                    job_id: "j0000000-4444-4000-8000-000000000002"
                    imported_at: "2026-05-21T10:00:00Z"
                    created_at: "2026-05-21T09:55:00Z"
                next_cursor: null
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [sources]
      operationId: createSource
      summary: |
        Register a folder as a source and start the import job (convert, downscale, dedupe,
        group). Re-posting the same folder re-uses the source and imports only new files.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceCreate" }
      responses:
        "202":
          description: import job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceWithJob" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/sourceId"
    get:
      tags: [sources]
      operationId: getSource
      responses:
        "200":
          description: the source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [sources]
      operationId: updateSource
      summary: |
        Rename a source or correct its survey date. For a map source the survey date is the map's
        `captured_on`; patching it here writes the map too, so both stay equal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourcePatch" }
            example: { label: "Flight 14 Sep", captured_on: "2026-09-14" }
      responses:
        "200":
          description: the updated source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/sources/{sourceId}/stats:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/sourceId"
    get:
      tags: [sources]
      operationId: getSourceStats
      responses:
        "200":
          description: statistics for one source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------- images
  /api/v1/projects/{projectId}/images:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [images]
      operationId: listImages
      summary: Data Manager listing with filters and sort on every column.
      parameters:
        - name: source_id
          in: query
          schema: { type: string }
        - name: group_key
          in: query
          schema: { type: string }
        - name: labeled
          in: query
          description: true = at least one accepted or edited box; false = none
          schema: { type: boolean }
        - name: has_pending
          in: query
          description: true = has unreviewed proposals (review queue)
          schema: { type: boolean }
        - name: search
          in: query
          description: case-insensitive substring of the image path (file name included)
          schema: { type: string }
        - $ref: "#/components/parameters/imageHasFindings"
        - $ref: "#/components/parameters/imageSeverity"
        - $ref: "#/components/parameters/imageFindingStatus"
        - $ref: "#/components/parameters/imageTypeIds"
        - $ref: "#/components/parameters/imageHasSuggestions"
        - $ref: "#/components/parameters/imageReviewed"
        - $ref: "#/components/parameters/imageUnlabeled"
        - name: ids
          in: query
          description: comma-separated image ids; when present other filters are ignored
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [path, source_id, group_key, labeled, box_count, pending_count, max_pending_confidence, capture_time, created_at, worst_severity]
            default: path
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: page of images
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImagePage" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/bulk-delete:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [images]
      operationId: bulkDeleteImages
      summary: Delete images and their boxes from the project (files under `images/` are removed; originals are never touched).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDelete" }
      responses:
        "200":
          description: deletion count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkDeleteResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/bulk-mark-empty:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [images]
      operationId: bulkMarkEmpty
      summary: Mark images as containing no machinery (or undo it). Images that have accepted or edited boxes are skipped; unknown ids are ignored. Marking rejects the images' unreviewed proposals.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkMarkEmpty" }
      responses:
        "200":
          description: how many images changed and how many were skipped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkMarkEmptyResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/imageId"
    get:
      tags: [images]
      operationId: getImage
      responses:
        "200":
          description: the image record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageDetail" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [images]
      operationId: updateImage
      summary: Mark the image as containing no machinery (it then counts as labeled and enters datasets as a negative), or undo it. Marking rejects its unreviewed proposals. 409 `conflict` while the image has accepted or edited boxes. Also sets or clears the operator's subject distance (image inspection spec §9.3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageUpdate" }
      responses:
        "200":
          description: the updated image record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageDetail" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/{imageId}/file:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/imageId"
    get:
      tags: [images]
      operationId: getImageFile
      summary: The image as JPEG, optionally downscaled so the long side is at most `max_side`.
      parameters:
        - name: max_side
          in: query
          schema: { type: integer, minimum: 64, maximum: 8192 }
      responses:
        "200":
          description: JPEG bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/{imageId}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/imageId"
    get:
      tags: [images]
      operationId: getImageThumbnail
      summary: 256 px long-side JPEG, cached under `cache/thumbs/`.
      responses:
        "200":
          description: JPEG bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/{imageId}/preannotate:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/imageId"
    post:
      tags: [images]
      operationId: preannotateImage
      deprecated: true
      x-retire-with: I-FW
      summary: |
        Replaced by `detectImage` (image inspection spec §11.2). Run the project's pre-annotation model (or `model_id`) on one image synchronously and
        write proposal boxes with `local_model` provenance. Skipped (`skipped: true`) when the
        image already has boxes from that model. Runs at `imgsz` 2560 by default.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreannotateRequest" }
      responses:
        "200":
          description: proposals now on the image (all boxes from that model, new or existing)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreannotateResult" }
        "409":
          description: "the chosen library model's weights file is missing (`code` is `model_unavailable`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }

  # -------------------------------------------------------------------- boxes
  /api/v1/projects/{projectId}/images/{imageId}/boxes:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/imageId"
    get:
      tags: [boxes]
      operationId: listBoxes
      summary: All boxes on an image (ground truth and proposals).
      responses:
        "200":
          description: boxes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoxList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [boxes]
      operationId: createBox
      summary: Create a person-drawn annotation (box, rbox, polygon or point). Provenance is `person`, review state `accepted`; on a defect type it also creates the finding (`finding_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoxCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoxWriteResult" }
        "422":
          description: "`invalid_shape` (a field the shape needs is missing), `out_of_bounds`, `empty_polygon` (nothing left after repair and clip), `point_needs_defect_type`, `too_many_annotations` (5,000 per image), `unknown_type`, or `validation_error` for a malformed body"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/boxes/{boxId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/boxId"
    patch:
      tags: [boxes]
      operationId: updateBox
      summary: |
        Move, resize or reclassify. A proposal edited this way becomes `edited` (ground truth).
        The box of a finding keeps its finding (foundation §8.5): reclassing it to another defect
        type moves the finding to that type; reclassing it to an object type deletes the finding,
        so it needs `confirm_finding_delete=true` and otherwise answers 409
        `finding_would_be_deleted`.
      parameters:
        - { name: confirm_finding_delete, in: query, required: false, schema: { type: boolean }, description: false when absent }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoxUpdate" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoxWriteResult" }
        "409":
          description: "the reclass would delete the box's finding (`code` is `finding_would_be_deleted`, details `{finding_id}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_shape` (`points` on a shape that is not a polygon, or rectangle fields on a polygon or point), `out_of_bounds`, `empty_polygon`, `point_needs_defect_type` (retyping a point to an object type), `unknown_type`, or `validation_error` for a malformed body"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [boxes]
      operationId: deleteBox
      responses:
        "204":
          description: deleted
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/boxes/review:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [boxes]
      operationId: reviewBoxes
      summary: Accept, reject or unreview proposals in bulk (A and R in the editor, undo, bulk promotion).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoxReview" }
      responses:
        "200":
          description: number of boxes changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoxReviewResult" }
        "409":
          description: "an unreview would delete a finding that has a note, photos, comments, a changed severity or a status other than `reviewed` (`code` is `finding_has_content`, details `{finding_id, finding_ids}`: the first blocking finding and all of them)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ images (I-C0)
  /api/v1/projects/{projectId}/images/index:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [images]
      operationId: getImageIndex
      summary: The browser's columnar index, one request per filter change (image inspection spec §7.1).
      parameters:
        - { name: source_id, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/imageHasFindings"
        - $ref: "#/components/parameters/imageSeverity"
        - $ref: "#/components/parameters/imageFindingStatus"
        - $ref: "#/components/parameters/imageTypeIds"
        - $ref: "#/components/parameters/imageHasSuggestions"
        - $ref: "#/components/parameters/imageReviewed"
        - $ref: "#/components/parameters/imageUnlabeled"
        - { name: search, in: query, description: case-insensitive substring of the image path, schema: { type: string } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [path, source_id, group_key, labeled, box_count, pending_count, max_pending_confidence, capture_time, created_at, worst_severity]
            default: path
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - { name: fields, in: query, description: "`geo` adds `lon` and `lat`", schema: { type: string, enum: [geo] } }
      responses:
        "200":
          description: the index
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageIndex" }
        "422":
          description: "more than 100,000 images match (`code` is `too_many_images`); filter by source"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/metadata-refresh:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [images]
      operationId: refreshImageMetadata
      summary: |
        Queue the `image_metadata` job: re-read camera metadata (XMP, EXIF intrinsics) from each
        image's original and recompute its footprint (spec §7.3). Idempotent through the metadata
        version; an image whose original is missing or ambiguous keeps its EXIF-only metadata.
      responses:
        "202":
          description: "the job; when it succeeds its `result` is `{images, updated, skipped}`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "409":
          description: "an `image_metadata` job is already queued or running (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/image-summary/rebuild:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [images]
      operationId: rebuildImageSummary
      summary: Queue the `summary_rebuild` repair job, which recomputes every image's annotation summary.
      responses:
        "202":
          description: "the job; when it succeeds its `result` is `{images}`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "409":
          description: "a `summary_rebuild` job is already queued or running (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/{imageId}/measurements:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/imageId"
    get:
      tags: [images]
      operationId: listImageMeasurements
      summary: The image's length measurements (at most 500), each with its length computed now.
      responses:
        "200":
          description: measurements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageMeasurementList" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [images]
      operationId: createImageMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageMeasurementCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageMeasurement" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "an end outside the image (`out_of_bounds`) or the image already has 500 (`too_many_measurements`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/image-measurements/{imageMeasurementId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/imageMeasurementId"
    delete:
      tags: [images]
      operationId: deleteImageMeasurement
      responses:
        "204":
          description: deleted
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/{imageId}/detect:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/imageId"
    post:
      tags: [image-detect]
      operationId: detectImage
      summary: |
        Run one library model on one image synchronously (spec §11.2): tiled when the long side
        exceeds twice the inference size (at most 64 tiles), on the GPU after at most a 2 s wait,
        else on the CPU. Replaces the model's earlier unreviewed suggestions on the image.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DetectRequest" }
      responses:
        "200":
          description: the suggestions now on the image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "the model's weights file is missing (`code` is `model_unavailable`), checked before any work"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`unmapped_classes` (details `{model_id, unmapped}`), or `validation_error` for a malformed body"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnmappedClassesError" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/detect-batch:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [image-detect]
      operationId: detectImageBatch
      summary: Create a detection run over a scope of images and queue the `infer` job (spec §11.3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DetectBatchRequest" }
      responses:
        "202":
          description: the run and its job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryRunWithJob" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "the model's weights file is missing (`code` is `model_unavailable`), or no API key is stored for a cloud provider (`code` is `conflict`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`unmapped_classes`, `model_or_provider_required`, `query_required`, `no_images` (the scope matched none), `too_many_images`, or `validation_error`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnmappedClassesError" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/{imageId}/segment/prepare:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/imageId"
    post:
      tags: [assist]
      operationId: prepareImageSegment
      summary: Warm the smart-polygon embedding for a crop (spec §10), so the first click answers fast.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SegmentPrepareRequest" }
      responses:
        "200":
          description: the embedding is resident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentPrepared" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "the smart-polygon weights are missing or failed their check (`code` is `assist_model_missing`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/images/{imageId}/segment:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/imageId"
    post:
      tags: [assist]
      operationId: segmentImage
      summary: One smart-polygon prompt with every click so far (spec §10); the best mask's outline.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SegmentRequest" }
      responses:
        "200":
          description: the outline, or null when nothing was found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SegmentResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "the smart-polygon weights are missing or failed their check (`code` is `assist_model_missing`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "a click outside the crop (`code` is `points_outside_crop`), or `validation_error` for a malformed body"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ model adoption
  /api/v1/projects/{projectId}/adoption:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [projects]
      operationId: getModelAdoption
      summary: |
        Progress of moving this project's old models into the library. Models whose
        weights file is missing are listed in `missing`; `job_id` is the adoption job that is
        queued or running, if any.
      responses:
        "200":
          description: adoption status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdoptionStatus" }
        "404":
          description: no such project (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/adoption/retry:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [projects]
      operationId: retryModelAdoption
      summary: Forget the missing and failed adoptions and start the adoption job again (a `library_adopt` job in this project).
      responses:
        "202":
          description: adoption job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404":
          description: no such project (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "an adoption job is already queued or running (`code` is `conflict`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------- library
  /api/v1/library/status:
    get:
      tags: [library]
      operationId: getLibraryStatus
      summary: Whether the app-wide model library opened at startup, and where it lives. Never answers 503.
      responses:
        "200":
          description: library status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStatus" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/models:
    get:
      tags: [library]
      operationId: listLibraryModels
      summary: Every model in the library, newest first.
      parameters:
        - name: task
          in: query
          schema: { $ref: "#/components/schemas/ModelTask" }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: library models
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryModelPage" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/models/import:
    post:
      tags: [library]
      operationId: importLibraryModel
      summary: |
        Import a `.pt` weights file into the library through a `library_import` job: hash, copy,
        load-check, read the task and class names, register. A file already in the library (same
        sha256) fails the job with a message naming the existing model. The source file is only read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryModelImport" }
      responses:
        "202":
          description: "import job queued; when it succeeds its `result` is `{model_id}`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404":
          description: "`weights_path` is not absolute, not a .pt file, or does not exist (`code` is `not_found`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/models/{modelId}:
    parameters:
      - $ref: "#/components/parameters/modelId"
    get:
      tags: [library]
      operationId: getLibraryModel
      responses:
        "200":
          description: the library model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryModel" }
        "404":
          description: no such model (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [library]
      operationId: updateLibraryModel
      summary: Rename the model or change its notes, supplier, class aliases or training scale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryModelPatch" }
      responses:
        "200":
          description: the updated library model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryModel" }
        "404":
          description: no such model (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [library]
      operationId: deleteLibraryModel
      summary: |
        Remove the model and its folder from the library. Past runs keep their own copy of the
        model's name and classes and stay readable; check `/usage` first to warn the operator.
      responses:
        "204":
          description: deleted
        "404":
          description: no such model (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/models/{modelId}/gsd-estimate:
    parameters:
      - $ref: "#/components/parameters/modelId"
    get:
      tags: [library]
      operationId: getLibraryModelGsdEstimate
      summary: |
        The scale the model was trained at, derived from the dataset it was trained on, with the
        evidence for it. A bounded read: the median of an altitude column already in the project
        database plus at most eight EXIF headers, so it is a plain request and not a job.
      responses:
        "200":
          description: the derived training scale and its evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelGsdEstimate" }
        "404":
          description: |
            no such model, or nothing can be measured - the model names no dataset, its originating
            project folder no longer opens, or its imagery carries no usable camera EXIF
            (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/models/{modelId}/usage:
    parameters:
      - $ref: "#/components/parameters/modelId"
    get:
      tags: [library]
      operationId: getLibraryModelUsage
      summary: Recently opened projects that use the model (pre-annotation, detection runs, map runs). Projects not on the recent list are not scanned.
      responses:
        "200":
          description: the projects that use the model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelUsage" }
        "404":
          description: no such model (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/models/{modelId}/artifacts/{artifact}:
    parameters:
      - $ref: "#/components/parameters/modelId"
      - name: artifact
        in: path
        required: true
        schema:
          type: string
          enum: [results_csv, confusion_matrix, pr_curve]
    get:
      tags: [library]
      operationId: getLibraryModelArtifact
      summary: A training artifact file (results.csv, confusion matrix PNG, PR curve PNG) kept with the library model.
      responses:
        "200":
          description: the file
          content:
            image/png:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string }
        "404":
          description: no such model, or the model has no such artifact (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/models/{modelId}/export:
    parameters:
      - $ref: "#/components/parameters/modelId"
    post:
      tags: [library]
      operationId: exportLibraryModel
      summary: Export to ONNX or TensorRT through a `library_export` job; the path lands in `exports[format]` of the library model.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "202":
          description: "export job queued; when it succeeds its `result` is `{format, path}`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404":
          description: no such model (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/starters/{key}/acquire:
    parameters:
      - name: key
        in: path
        required: true
        schema: { $ref: "#/components/schemas/StarterModelKey" }
    post:
      tags: [library]
      operationId: acquireStarterModel
      summary: Add one supported YOLO starter to the library through a `library_starter` job.
      description: Reuses bundled or cached weights; otherwise downloads the chosen asset. Progress and cancellation use the library jobs resource. The successful `job.result.model_id` identifies the library model.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StarterAcquire" }
      responses:
        "202":
          description: starter acquisition queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404":
          description: no such starter model (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/assist-models:
    get:
      tags: [assist]
      operationId: listAssistModels
      summary: The assist model catalogue (the smart-polygon model) and whether each is on this machine.
      responses:
        "200":
          description: the catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistModelPage" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/assist-models/{key}/acquire:
    parameters:
      - $ref: "#/components/parameters/assistModelKey"
    post:
      tags: [assist]
      operationId: acquireAssistModel
      summary: Download the model's weights through an `assist_acquire` library job and check their sha256.
      responses:
        "202":
          description: "the job; when it succeeds its `result` is `{key}`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "409":
          description: "an `assist_acquire` job for this key is already queued or running (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/assist-models/{key}/import:
    parameters:
      - $ref: "#/components/parameters/assistModelKey"
    post:
      tags: [assist]
      operationId: importAssistModel
      summary: Import the weights from a local file (air-gapped machines) through an `assist_acquire` library job.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistModelImport" }
      responses:
        "202":
          description: "the job; when it succeeds its `result` is `{key}`; a file whose sha256 does not match fails the job"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404":
          description: "`path` is not absolute or does not exist (`code` is `not_found`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/jobs:
    get:
      tags: [library]
      operationId: listLibraryJobs
      summary: Library jobs (import, export, starter), newest first. Their `project_id` is `library`.
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/JobState" }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/JobType" }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: library jobs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [library]
      operationId: getLibraryJob
      responses:
        "200":
          description: the job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404":
          description: no such job (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/jobs/{jobId}/log:
    parameters:
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [library]
      operationId: getLibraryJobLog
      parameters:
        - name: tail
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 200 }
      responses:
        "200":
          description: last lines of the job log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobLog" }
        "404":
          description: no such job (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/jobId"
    post:
      tags: [library]
      operationId: cancelLibraryJob
      summary: Request cancellation. The state becomes `cancelled` once the worker notices; finished jobs are returned unchanged.
      responses:
        "200":
          description: the job after the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404":
          description: no such job (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/starter-models:
    get:
      tags: [models]
      operationId: listStarterModels
      summary: All supported YOLO box-detection starters. Available means cached or bundled locally; other models can be acquired through a background job.
      responses:
        "200":
          description: the supported catalogue grouped by family
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StarterModelPage" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- providers
  /api/v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: Cloud providers with configuration and whether a key is stored. Keys are never returned.
      responses:
        "200":
          description: providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/providers/{provider}:
    parameters:
      - $ref: "#/components/parameters/provider"
    patch:
      tags: [providers]
      operationId: updateProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderUpdate" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/providers/{provider}/key:
    parameters:
      - $ref: "#/components/parameters/provider"
    put:
      tags: [providers]
      operationId: setProviderKey
      summary: Store the API key in Windows Credential Manager. It is never written to disk or logs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderKey" }
      responses:
        "204":
          description: stored
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [providers]
      operationId: deleteProviderKey
      responses:
        "204":
          description: removed
        default: { $ref: "#/components/responses/Error" }
  /api/v1/providers/{provider}/test:
    parameters:
      - $ref: "#/components/parameters/provider"
    post:
      tags: [providers]
      operationId: testProvider
      summary: Make one cheap call with the stored key to confirm it works.
      responses:
        "200":
          description: result of the test call (ok false when the key is missing or rejected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderTestResult" }
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------- query runs
  /api/v1/projects/{projectId}/query-runs/estimate:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [query-runs]
      operationId: estimateQueryRun
      summary: Images times tiles times the per-provider cost estimate, shown before starting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryRunCreate" }
      responses:
        "200":
          description: estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostEstimate" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/query-runs:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [query-runs]
      operationId: listQueryRuns
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: query runs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryRunPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [query-runs]
      operationId: createQueryRun
      summary: |
        Run a local model or a cloud vision provider over images through a job. Boxes are
        written as proposals with the run's provenance as each tile result arrives, so a
        restarted job skips finished tiles.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryRunCreate" }
      responses:
        "202":
          description: run created, job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryRunWithJob" }
        "409":
          description: "the chosen library model's weights file is missing (`code` is `model_unavailable`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/query-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    get:
      tags: [query-runs]
      operationId: getQueryRun
      responses:
        "200":
          description: the run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryRun" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/query-runs/{runId}/resume:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    post:
      tags: [query-runs]
      operationId: resumeQueryRun
      summary: |
        Re-submit the run's job. Tiles already persisted for this run are reused, so an interrupted
        run continues where it stopped; boxes the user has already reviewed on this run are kept.
      responses:
        "202":
          description: new job queued for the same run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "409":
          description: "the run's job is still queued or running (`code` is `conflict`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/query-runs/{runId}/promote:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    post:
      tags: [query-runs]
      operationId: promoteQueryRun
      summary: Mark the run's unreviewed boxes at or above `min_confidence` as accepted (a state change, not a copy).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoteRequest" }
      responses:
        "200":
          description: run with `promoted_at` set and the number of boxes accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoteResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/query-runs/{runId}/unpromote:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    post:
      tags: [query-runs]
      operationId: unpromoteQueryRun
      summary: Undo a promotion. Boxes the promotion accepted go back to unreviewed; boxes a person accepted, edited or rejected are left alone. Refuses with 409 `finding_has_content` (nothing changes) when a reverted box's finding has a note, photo, comment, a status other than reviewed, or a person-set severity.
      responses:
        "200":
          description: run with `promoted_at` cleared and the number of boxes returned to unreviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnpromoteResult" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------------- maps
  /api/v1/projects/{projectId}/maps:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [maps]
      operationId: listMaps
      summary: Every map in the project, newest first.
      responses:
        "200":
          description: maps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoMapList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [maps]
      operationId: createMap
      summary: Import a GeoTIFF (a `map_import` job). The source file is only read. A file without coordinates imports with `crs_wkt` null.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeoMapCreate" }
      responses:
        "202":
          description: map created in `importing`, job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoMapWithJob" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/maps/{mapId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/mapId"
    get:
      tags: [maps]
      operationId: getMap
      responses:
        "200":
          description: the map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoMap" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [maps]
      operationId: patchMap
      summary: Correct the survey date - when the imagery was flown, not when the file was imported.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeoMapPatch" }
            example: { captured_on: "2026-04-15" }
      responses:
        "200":
          description: the updated map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoMap" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [maps]
      operationId: deleteMap
      summary: Delete the map, its runs, zones and labels, and its folder under `maps/`. 409 while one of its jobs is queued or running.
      responses:
        "204": { description: deleted }
        "409":
          description: "one of the map's jobs is queued or running (`code` is `conflict`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/maps/{mapId}/preview:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/mapId"
    get:
      tags: [maps]
      operationId: getMapPreview
      summary: About 1024 px long-side JPEG of the whole map.
      responses:
        "200":
          description: JPEG bytes
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/maps/{mapId}/tiles/{z}/{x}/{y}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/mapId"
      - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 30 } }
      - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
      - { name: y, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      tags: [maps]
      operationId: getMapTile
      summary: One 256 px tile of the map's pixel grid; one bounded read. PNG with alpha when the tile holds nodata.
      responses:
        "200":
          description: tile image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "204": { description: the tile is outside the map or entirely nodata }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/maps/{mapId}/runs:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/mapId"
    get:
      tags: [maps]
      operationId: listMapRuns
      responses:
        "200":
          description: the map's runs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapRunList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs/estimate:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [maps]
      operationId: estimateMapRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapRunCreate" }
      responses:
        "200":
          description: windows, skipped windows and cost
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapRunEstimate" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [maps]
      operationId: createMapRun
      summary: Detect across the whole map (a `map_detect` job).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapRunCreate" }
      responses:
        "202":
          description: run created, job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapRunWithJob" }
        "409":
          description: "the chosen library model's weights file is missing (`code` is `model_unavailable`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    get:
      tags: [maps]
      operationId: getMapRun
      responses:
        "200":
          description: the run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapRun" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [maps]
      operationId: deleteMapRun
      summary: Delete the run and its detections. 409 while its job is queued or running.
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs/{runId}/resume:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    post:
      tags: [maps]
      operationId: resumeMapRun
      summary: Start a new job for the run; finished windows are reused.
      responses:
        "202":
          description: job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs/{runId}/detections:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    get:
      tags: [maps]
      operationId: listMapDetections
      summary: Boxes intersecting `bbox` (map pixels), at most 5000.
      parameters:
        - { name: bbox, in: query, required: false, schema: { type: string, pattern: "^-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?$" }, description: "x0,y0,x1,y1" }
        - { name: min_conf, in: query, required: false, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: class_id, in: query, required: false, schema: { type: string } }
        - $ref: "#/components/parameters/siteFrame"
      responses:
        "200":
          description: boxes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapDetectionPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [detect]
      operationId: addMapDetection
      summary: Draw a missed object. It is stored with `provenance_kind` `person` and `review_state` `accepted`, and counts as verified.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapDetectionCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapDetection" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs/{runId}/density:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    get:
      tags: [maps]
      operationId: getMapDensity
      summary: Detection counts per class on a grid over the whole map; for zoomed-out views.
      parameters:
        - { name: cells, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 256, default: 128 } }
        - { name: min_conf, in: query, required: false, schema: { type: number, minimum: 0, maximum: 1 } }
        - $ref: "#/components/parameters/siteFrame"
      responses:
        "200":
          description: grid counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapDensity" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs/{runId}/score:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    get:
      tags: [maps]
      operationId: getMapRunScore
      summary: The run scored against the map's labels inside its zones.
      parameters:
        - { name: iou, in: query, required: false, schema: { type: number, minimum: 0.05, maximum: 0.95, default: 0.5 } }
      responses:
        "200":
          description: score
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapScore" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/survey-timeline:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [maps]
      operationId: getSurveyTimeline
      summary: Counts per class for every survey (map) of this project, oldest first, with the change since the previous comparable survey.
      parameters:
        - { name: model_id, in: query, required: false, schema: { type: string }, description: compare on this model instead of the newest run's }
        - { name: conf, in: query, required: false, schema: { type: number, minimum: 0, maximum: 1 }, description: compare at this confidence instead of the newest run's }
        - { name: verified_only, in: query, required: false, schema: { type: boolean, default: false }, description: "count only verified detections (accepted, edited or drawn by a person): `counts` and `deltas` are built from each run's `verified_counts`" }
      responses:
        "200":
          description: the timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurveyTimeline" }
              example:
                basis: { model_id: "m0000000-2222-4000-8000-000000000001", model_name: "yolo11m-coco", conf: 0.25 }
                classes:
                  - { id: "c1a2b3c4-0000-4000-8000-000000000001", name: "excavator", colour: "#f97316" }
                surveys:
                  - map_id: "7c9e1b2a-5555-4000-8000-000000000001"
                    map_name: "April survey"
                    captured_on: "2026-04-15"
                    date_is_import_date: false
                    run_id: "5e4d3c2b-0000-4000-8000-000000000001"
                    model_name: "yolo11m-coco"
                    conf: 0.25
                    counts: { "c1a2b3c4-0000-4000-8000-000000000001": 12 }
                    verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 9 }
                    pinned: false
                    deltas: {}
                    state: ok
                    reason: null
                  - map_id: "7c9e1b2a-5555-4000-8000-000000000002"
                    map_name: "May survey"
                    captured_on: "2026-05-20"
                    date_is_import_date: false
                    run_id: "5e4d3c2b-0000-4000-8000-000000000002"
                    model_name: "yolo11m-coco"
                    conf: 0.25
                    counts: { "c1a2b3c4-0000-4000-8000-000000000001": 15 }
                    verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 15 }
                    pinned: true
                    deltas: { "c1a2b3c4-0000-4000-8000-000000000001": 3 }
                    state: ok
                    reason: null
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/maps/{mapId}/zones:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/mapId"
    get:
      tags: [maps]
      operationId: listMapZones
      responses:
        "200":
          description: zones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapZoneList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [maps]
      operationId: createMapZone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapZoneCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapZone" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/maps/{mapId}/zones/{zoneId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/mapId"
      - $ref: "#/components/parameters/zoneId"
    patch:
      tags: [maps]
      operationId: updateMapZone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapZoneUpdate" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapZone" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [maps]
      operationId: deleteMapZone
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/maps/{mapId}/labels:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/mapId"
    get:
      tags: [maps]
      operationId: listMapLabels
      summary: Every ground-truth box on the map (at most 20000).
      responses:
        "200":
          description: labels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapLabelList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [maps]
      operationId: createMapLabel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapLabelCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapLabel" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/maps/{mapId}/labels/{labelId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/mapId"
      - $ref: "#/components/parameters/labelId"
    patch:
      tags: [maps]
      operationId: updateMapLabel
      summary: Edit a label; its `source` becomes `manual`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapLabelUpdate" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapLabel" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [maps]
      operationId: deleteMapLabel
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/maps/{mapId}/labels/seed:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/mapId"
    post:
      tags: [maps]
      operationId: seedMapLabels
      summary: Copy a run's detections whose centre is inside a zone into labels (`source` `from_run:<id>`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapLabelSeed" }
      responses:
        "200":
          description: labels created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapLabelSeedResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-exports:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [maps]
      operationId: createMapExport
      summary: Write GeoJSON (WGS84), GeoPackage (map CRS) and/or CSV (both) to `exports/<stamp>/` (a `map_export` job).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapExportRequest" }
      responses:
        "202":
          description: job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ detect
  /api/v1/projects/{projectId}/runs:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [detect]
      operationId: listRuns
      summary: |
        Photo runs (query runs) and map runs of the project in one list, newest first
        (`created_at desc, id desc`). Review progress comes from grouped counts.
      parameters:
        - { name: source_id, in: query, required: false, schema: { type: string }, description: only this source's runs }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: runs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunSummaryPage" }
              example:
                items:
                  - id: "r0000000-7777-4000-8000-000000000001"
                    kind: map
                    source_id: "50000000-3333-4000-8000-000000000002"
                    source_label: "May survey"
                    model_id: "m0000000-2222-4000-8000-000000000001"
                    model_name: "machinery-v3"
                    conf: 0.25
                    job_state: succeeded
                    pinned: false
                    counts: { "c1a2b3c4-0000-4000-8000-000000000001": 42, "c1a2b3c4-0000-4000-8000-000000000004": 17 }
                    verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 30 }
                    review: { total: 59, reviewed: 34 }
                    created_at: "2026-09-22T11:00:00Z"
                  - id: "q0000000-8888-4000-8000-000000000001"
                    kind: images
                    source_id: "50000000-3333-4000-8000-000000000001"
                    source_label: "Flight 15 Apr"
                    model_id: "m0000000-2222-4000-8000-000000000001"
                    model_name: "machinery-v3"
                    conf: 0.25
                    job_state: succeeded
                    pinned: false
                    counts: { "c1a2b3c4-0000-4000-8000-000000000001": 31, "c1a2b3c4-0000-4000-8000-000000000004": 9 }
                    verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 12 }
                    review: { total: 40, reviewed: 12 }
                    created_at: "2026-09-21T15:00:00Z"
                next_cursor: null
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [detect]
      operationId: createRuns
      summary: |
        Start one run per source: a photo source gets a query run (an `infer` job), a map source a
        map run (a `map_detect` job). The model's classes must all map onto project classes (or be
        ignored); otherwise nothing is queued and the answer is `422 unmapped_classes`. The first
        run in a project with no classes seeds the class list from the model. Cloud-provider runs
        (`provider` and `query`) skip the mapping.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunCreate" }
      responses:
        "202":
          description: runs created, one job per run queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunCreated" }
              example:
                added_type_ids: []
                runs:
                  - run_id: "q0000000-8888-4000-8000-000000000002"
                    source_id: "50000000-3333-4000-8000-000000000001"
                    kind: images
                    job:
                      id: "j0000000-4444-4000-8000-000000000010"
                      project_id: "7f1c2e3a-1111-4000-8000-000000000001"
                      type: infer
                      state: queued
                      progress: 0
                      message: ""
                      log_path: "runs/j0000000-4444-4000-8000-000000000010/job.log"
                      params: { query_run_id: "q0000000-8888-4000-8000-000000000002" }
                      result: null
                      error: null
                      created_at: "2026-09-23T10:00:00Z"
                      started_at: null
                      finished_at: null
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "the chosen library model's weights file is missing (`code` is `model_unavailable`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/UnmappedClasses" }
        "503": { $ref: "#/components/responses/LibraryOrCatalogueUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    patch:
      tags: [detect]
      operationId: updateRun
      summary: Pin or unpin a run. Pinning a run unpins the other runs of its source; a pinned run represents its source in analytics and the survey timeline.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunPatch" }
      responses:
        "200":
          description: the updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/runs/{runId}/accept-above:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    post:
      tags: [detect]
      operationId: acceptRunAbove
      summary: Accept every unreviewed detection of the run at or above `min_confidence` (an `accept_above` job, in batches; the counts follow).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptAbove" }
      responses:
        "202":
          description: job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/runs/{runId}/recount:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    post:
      tags: [detect]
      operationId: recountRun
      summary: Rebuild the run's `counts`, `verified_counts` and (map runs) `area_counts` from its detections (a `recount` job).
      responses:
        "202":
          description: job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/model-class-maps/{modelId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/modelId"
    get:
      tags: [detect]
      operationId: getModelClassMap
      summary: How a library model's classes map onto this project's classes (the remembered mapping, else by name and aliases), and which are still unmapped.
      responses:
        "200":
          description: the mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelClassMapOut" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/LibraryOrCatalogueUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [detect]
      operationId: putModelClassMap
      summary: |
        Remember the mapping for this model. Every mapped id must be a project class. Each name
        in `new_classes` is added as a project class and mapped to itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelClassMapPut" }
      responses:
        "200":
          description: the stored mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelClassMapOut" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: a mapped id is not a project class, or a name is not one of the model's classes (`code` is `validation_error`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryOrCatalogueUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs/{runId}/review:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    post:
      tags: [detect]
      operationId: reviewMapDetections
      summary: |
        Accept, reject, reset or reclass detections of a map run. Reclass sets the class and the
        state `edited`. The run's counts change in the same transaction. Accepting a detection of a
        defect type also creates its finding (status `reviewed`) in that transaction; rejecting,
        unaccepting or reclassing it to an object type deletes that finding, and only with
        `confirm_finding_delete=true`.
      parameters:
        - {
            name: confirm_finding_delete,
            in: query,
            required: false,
            schema: { type: boolean },
            description: "false when absent; true lets the review delete the findings accepted defect detections created",
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapDetectionReview" }
      responses:
        "200":
          description: detections updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapDetectionReviewResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "the review would delete findings and `confirm_finding_delete` is not true (`code` is `finding_would_be_deleted`; details `{finding_ids}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs/{runId}/next-unreviewed:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    get:
      tags: [detect]
      operationId: nextUnreviewedMapDetection
      summary: The next unreviewed detection in reading order (`y`, then `x`) after `after_id`, and how many remain.
      parameters:
        - { name: after_id, in: query, required: false, schema: { type: string }, description: the detection the viewer is on; omitted starts from the top }
        - $ref: "#/components/parameters/siteFrame"
      responses:
        "200":
          description: the next detection, or null when none is left
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NextUnreviewed" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/site-areas:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [detect]
      operationId: listSiteAreas
      parameters:
        - $ref: "#/components/parameters/siteFrame"
      responses:
        "200":
          description: site areas, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteAreaList" }
              example:
                items:
                  - id: "5a000000-aaaa-4000-8000-000000000001"
                    name: "North laydown yard"
                    category: laydown
                    polygon_wgs84: [[47.7610, 29.4960], [47.7640, 29.4960], [47.7640, 29.4980], [47.7610, 29.4980]]
                    created_at: "2026-09-23T09:00:00Z"
                  - id: "5a000000-aaaa-4000-8000-000000000002"
                    name: "Batching plant"
                    category: general
                    polygon_wgs84: [[47.7650, 29.4930], [47.7680, 29.4930], [47.7680, 29.4950]]
                    created_at: "2026-09-23T09:05:00Z"
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [detect]
      operationId: createSiteArea
      summary: |
        Add a site area, given in WGS84 or as a polygon drawn in one map's pixels (converted with
        that map's georeference). Starts an `area_recount` job over every map run.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteAreaCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteArea" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "the outline breaks the `polygon_wgs84` / `map_id`+`polygon_px` shape rule (both or neither given, or only one of `map_id`/`polygon_px`), has fewer than three or more than 1000 points, a point that is not a finite `[longitude, latitude]` or pixel `[x, y]`, or `map_id` names a map with no georeference (`code` is `invalid_outline`); a malformed body is `validation_error`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/site-areas/{areaId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/areaId"
    patch:
      tags: [detect]
      operationId: updateSiteArea
      summary: Rename or redraw a site area. A new polygon starts an `area_recount` job.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteAreaPatch" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteArea" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "a new outline breaks the `polygon_wgs84` / `map_id`+`polygon_px` shape rule (both given together, or only one of `map_id`/`polygon_px`), has fewer than three or more than 1000 points, a point that is not a finite `[longitude, latitude]` or pixel `[x, y]`, or `map_id` names a map with no georeference (`code` is `invalid_outline`); a malformed body is `validation_error`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [detect]
      operationId: deleteSiteArea
      summary: Delete a site area. Starts an `area_recount` job.
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/analytics/sources/{sourceId}:
