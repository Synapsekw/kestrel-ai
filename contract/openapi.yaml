            group_key: "0031"
            capture_time: "2019-04-15T06:35:36Z"
            lat: 29.49469
            lon: 47.76513
            alt: 191.3
            phash: "82a81f67f94615ae"
            box_count: 3
            pending_count: 2
            max_pending_confidence: 0.81
            labeled: true
            marked_empty: false
            created_at: "2026-09-17T10:06:00Z"
          - id: "10000000-5555-4000-8000-000000000002"
            path: "images/ahmadia/IX-12-02491_0031_0002.jpg"
            file_name: "IX-12-02491_0031_0002.jpg"
            width: 4000
            height: 2667
            source_id: "50000000-3333-4000-8000-000000000001"
            group_key: "0031"
            capture_time: "2019-04-15T06:35:39Z"
            lat: 29.49476
            lon: 47.76486
            alt: 191.8
            phash: "8488349d3494bffb"
            box_count: 0
            pending_count: 0
            max_pending_confidence: null
            labeled: false
            marked_empty: false
            created_at: "2026-09-17T10:06:00Z"
        next_cursor: null
        total: 2
    ImageUpdate:
      type: object
      required: [marked_empty]
      properties:
        marked_empty: { type: boolean }
      example: { marked_empty: true }
    BulkMarkEmpty:
      type: object
      required: [image_ids, marked_empty]
      properties:
        image_ids:
          type: array
          items: { type: string }
          minItems: 1
        marked_empty: { type: boolean }
      example: { image_ids: ["10000000-5555-4000-8000-000000000002"], marked_empty: true }
    BulkMarkEmptyResult:
      type: object
      required: [updated, skipped]
      properties:
        updated: { type: integer, description: images whose mark changed }
        skipped: { type: integer, description: images left alone because they have accepted or edited boxes }
      example: { updated: 1, skipped: 0 }
    BulkDelete:
      type: object
      required: [image_ids]
      properties:
        image_ids:
          type: array
          items: { type: string }
          minItems: 1
      example: { image_ids: ["10000000-5555-4000-8000-000000000002"] }
    BulkDeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer }
      example: { deleted: 1 }
    PreannotateRequest:
      type: object
