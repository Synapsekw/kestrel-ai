        model_id: { type: string, description: "a library model id; defaults to the project's pre-annotation model" }
        imgsz: { type: integer, minimum: 320, maximum: 6400, default: 2560 }
        conf: { type: number, minimum: 0, maximum: 1, default: 0.25 }
      example: { imgsz: 2560, conf: 0.25 }
    PreannotateResult:
      type: object
      required: [skipped, model_id, items]
      properties:
