    # ------------------------------------------------------------ map workspace (M-C0)
    SiteFrameKind:
      type: string
      enum: [crs, local]
    SiteFrame:
      type: object
      description: the project's display frame (map-workspace spec §6); every `*_site` coordinate is in it
      required: [kind, crs_wkt, epsg, proj4, name]
      properties:
        kind: { $ref: "#/components/schemas/SiteFrameKind" }
        crs_wkt: { type: [string, "null"], description: null for local }
        epsg: { type: [integer, "null"] }
        proj4:
          {
            type: [string, "null"],
            description: "for the client's proj4 registration; null for local",
          }
        name: { type: string, description: "the CRS name, or Local metres" }
      example:
        {
          kind: crs,
          crs_wkt: 'PROJCRS["WGS 84 / UTM zone 38N"]',
          epsg: 32638,
          proj4: "+proj=utm +zone=38 +datum=WGS84 +units=m +no_defs",
          name: "WGS 84 / UTM zone 38N",
        }
    PlannedSurvey:
      type: object
      required: [date, note]
      properties:
        date: { type: string, format: date }
        note: { type: [string, "null"], maxLength: 200 }
    FrameItemCounts:
      type: object
      description: how many maps and surfaces each frame can show; the CRS chip offers the switch when both are above zero
      required: [crs, local]
      properties:
        crs: { type: integer, minimum: 0 }
        local: { type: integer, minimum: 0 }
    MapWorkspace:
      type: object
      required: [frame, state, planned_surveys, frame_items, updated_at]
      properties:
        frame: { $ref: "#/components/schemas/SiteFrame" }
        state:
          {
            type: object,
            additionalProperties: true,
            description: "the client's view state (layers, compare mode and dates, blend, last view), opaque to the server; empty until first saved",
          }
        planned_surveys:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/PlannedSurvey" },
          }
        frame_items: { $ref: "#/components/schemas/FrameItemCounts" }
        updated_at: { type: string, format: date-time }
      example:
        frame:
          {
            kind: crs,
            crs_wkt: 'PROJCRS["WGS 84 / UTM zone 38N"]',
            epsg: 32638,
            proj4: "+proj=utm +zone=38 +datum=WGS84 +units=m +no_defs",
            name: "WGS 84 / UTM zone 38N",
          }
        state: {}
        planned_surveys: [{ date: "2026-10-14", note: "October flight" }]
        frame_items: { crs: 4, local: 0 }
        updated_at: "2026-09-27T10:00:00Z"
    MapWorkspacePut:
      type: object
      required: [state]
      properties:
        state:
          {
            type: object,
            additionalProperties: true,
            description: at most 64 KB as JSON,
          }
        planned_surveys:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/PlannedSurvey" },
            description: unchanged when absent,
          }
      example: { state: { mode: swipe, l: "2026-08-14", r: "2026-09-14" } }
    SiteFrameSet:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/SiteFrameKind" }
        epsg:
          {
            type: integer,
            minimum: 1024,
            maximum: 999999,
            description: "for crs: a projected CRS in metres; omitted, the server picks the site CRS by rule M3 (422 invalid_epsg while nothing has coordinates)",
          }
      example: { kind: crs, epsg: 32639 }
    ElevationRole:
      type: string
      description: "dsm is the surface including objects; dtm is bare ground"
      enum: [dsm, dtm]
    DrawingFormat:
      type: string
      enum: [dxf, pdf, png, jpg, tif, landxml]
    WorkspaceSurveyMap:
