      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        note: { type: [string, "null"], maxLength: 2000, description: null clears it }
        finding_id: { type: [string, "null"], description: "attach to this cloud finding on this cloud; null detaches" }
    CloudMeasurementResults:
      type: object
      description: computed by the server from the stored points; a quantity that does not apply to the kind is null
      required: [lon, lat, dx, dy, dz, distance_3d, distance_horizontal, distance_vertical, height_difference, lean_offset_m, lean_angle_deg, lean_azimuth_deg, lean_mm_per_m, uncertainty_m, angle_uncertainty_deg, area_m2, area_surface_m2, area_plan_m2, perimeter_m, plane_rms_m, plane_tilt_deg, plane_azimuth_deg, uncertainty_m2, ring_radius_lower_m, ring_radius_upper_m, ring_rms_lower_m, ring_rms_upper_m, profile_length_m, profile_z_min, profile_z_max, profile_width_max_m, profile_point_count]
