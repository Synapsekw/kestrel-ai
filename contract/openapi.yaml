      type: object
      required: [image, meta]
      properties:
        image: { type: string, format: binary, description: "PNG or JPEG, exactly 1600 x 1000, at most 6 MiB" }
        meta: { $ref: "#/components/schemas/CloudViewMeta" }
    CloudViewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1500
          items: { $ref: "#/components/schemas/CloudViewOut" }
      example:
        items: []
    CloudProfile:
      type: object
      description: "a stored cross-section: s (metres along the line from A) against z, thinned to at most `max_points`"
      required: [s, z, rgb, count, thickness_m, length_m]
      properties:
        s: { type: array, items: { type: number }, maxItems: 500000 }
        z: { type: array, items: { type: number }, maxItems: 500000 }
        rgb:
          type: [array, "null"]
          description: "r, g, b per point (3 x `count` values); null when the cloud has no colour"
          items: { type: integer, minimum: 0, maximum: 255 }
          maxItems: 1500000
        count: { type: integer, minimum: 0 }
        thickness_m: { type: number }
        length_m: { type: number }
      example:
        s: [0.0, 0.5, 1.0]
        z: [-44.8, -44.7, -30.2]
        rgb: [120, 120, 118, 121, 119, 117, 200, 40, 30]
        count: 3
        thickness_m: 0.2
        length_m: 12.84
    CloudCameraSource:
      type: object
      required: [id, label, count, height_offset_m, posed_count]
      properties:
        id: { type: string, description: the image set (source) id }
        label: { type: string, description: "the set's label, else its site, else its folder name" }
        count: { type: integer, minimum: 0, description: this set's cameras in the payload }
        height_offset_m: { type: number, minimum: -500, maximum: 500 }
        posed_count: { type: integer, minimum: 0, description: those with a gimbal pose }
      example: { id: "s0000000-3333-4000-8000-000000000001", label: "Flight 14 Sep", count: 2, height_offset_m: -31.5, posed_count: 1 }
    CloudCameraOffsetPut:
      type: object
      additionalProperties: false
      required: [height_offset_m]
      properties:
        height_offset_m: { type: number, minimum: -500, maximum: 500 }
    CloudCameraSet:
      type: object
      description: |
        The drone photos near a cloud as parallel arrays (index i is one camera) in the cloud's
        native CRS: at most 20 000, ordered by capture time, `truncated` when more exist.
      required: [image_id, source_idx, x, y, z, yaw, pitch, roll, hfov, vfov, fov_assumed, width, height, sigma_m, sources, truncated, z_p1, z_p99, without_gps]
      properties:
        image_id: { type: array, items: { type: string }, maxItems: 20000 }
        source_idx: { type: array, items: { type: integer, minimum: 0 }, maxItems: 20000, description: "an index into `sources`" }
        x: { type: array, items: { type: number }, maxItems: 20000 }
        y: { type: array, items: { type: number }, maxItems: 20000 }
        z: { type: array, items: { type: [number, "null"] }, maxItems: 20000, description: "EXIF altitude plus the set's height offset; null without an altitude" }
        yaw: { type: array, items: { type: [number, "null"] }, maxItems: 20000, description: "grid yaw in degrees, clockwise from grid north; null without a pose" }
        pitch: { type: array, items: { type: [number, "null"] }, maxItems: 20000, description: "degrees, -90 is nadir; null without a pose" }
        roll: { type: array, items: { type: [number, "null"] }, maxItems: 20000 }
        hfov: { type: array, items: { type: number }, maxItems: 20000, description: horizontal field of view in degrees }
        vfov: { type: array, items: { type: number }, maxItems: 20000 }
        fov_assumed: { type: array, items: { type: boolean }, maxItems: 20000, description: "true when the FOV is the assumed 84 degree diagonal" }
        width: { type: array, items: { type: integer }, maxItems: 20000, description: "the stored image's pixel size" }
        height: { type: array, items: { type: integer }, maxItems: 20000 }
        sigma_m: { type: array, items: { type: number }, maxItems: 20000, description: "position uncertainty; 3.0 until an RTK flag exists" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/CloudCameraSource" }
        truncated: { type: boolean }
        z_p1: { type: [number, "null"], description: "the cloud's `z_stats.p1`, for the plausibility check" }
        z_p99: { type: [number, "null"], description: "the cloud's `z_stats.p99`" }
        without_gps: { type: integer, minimum: 0, description: "project images with no GPS position (lat or lon null), one COUNT query; the cloud panel shows it as \"n photos without GPS\"" }
      example:
        image_id: ["i0000000-5555-4000-8000-000000000001", "i0000000-5555-4000-8000-000000000002"]
        source_idx: [0, 0]
        x: [243540.2, 243561.9]
        y: [3178030.5, 3178044.1]
        z: [12.4, null]
        yaw: [131.2, null]
        pitch: [-45.0, null]
        roll: [0.0, null]
        hfov: [73.7, 73.7]
        vfov: [53.1, 53.1]
        fov_assumed: [false, true]
        width: [2048, 2048]
        height: [1536, 1536]
        sigma_m: [3.0, 3.0]
        sources: [{ id: "s0000000-3333-4000-8000-000000000001", label: "Flight 14 Sep", count: 2, height_offset_m: -31.5, posed_count: 1 }]
        truncated: false
        z_p1: -45.9
        z_p99: -5.1
        without_gps: 0
    # ------------------------------------------------------------ surfaces and volumes (S2)
    SurfaceKind:
      type: string
      description: "dem is a DSM or DTM GeoTIFF imported as elevation (map workspace)"
      enum: [cloud_dsm, design, dem]
    SurfaceStatus:
      type: string
      enum: [building, ready, failed]
    SurfaceMethod:
      type: string
      description: "median, mean, max and min are cloud statistics (S2); tin, delaunay, dem_resample and dem_copy are design methods (S3)"
      enum: [median, mean, max, min, tin, delaunay, dem_resample, dem_copy]
    SurfaceBuildMethod:
      type: string
      enum: [median, mean, max, min]
    SurfaceBuildParams:
      type: object
      description: the build request with the defaults resolved
      required: [point_cloud_id, name, method, cell_size_m, auto_cell, hole_fill_max_gap_m, despike_m, z_clip, drop_noise_classes, assume_metres]
      properties:
        point_cloud_id: { type: string }
        name: { type: string }
        method: { $ref: "#/components/schemas/SurfaceBuildMethod" }
        cell_size_m: { type: [number, "null"], description: "the cell size actually used; null while an auto cell is being chosen" }
        auto_cell: { type: boolean }
        hole_fill_max_gap_m: { type: number }
        despike_m: { type: [number, "null"] }
        z_clip:
          type: [array, "null"]
          items: { type: number }
          minItems: 2
          maxItems: 2
        drop_noise_classes: { type: boolean }
        assume_metres: { type: boolean }
    SurfaceBuildStats:
      type: object
      required: [points_read, points_used, points_dropped, density_per_m2, spacing_m, auto_cell, cells_valid, cells_despiked, cells_filled, z_p02, z_p98, reprojected_from_epsg, build_s]
      properties:
        points_read: { type: integer }
        points_used: { type: integer }
        points_dropped:
          type: object
          required: [noise_class, withheld, z_clip]
          properties:
            noise_class: { type: integer }
            withheld: { type: integer }
            z_clip: { type: integer }
        density_per_m2: { type: [number, "null"] }
        spacing_m: { type: [number, "null"] }
        auto_cell: { type: boolean }
        cells_valid: { type: integer }
        cells_despiked: { type: integer }
        cells_filled: { type: integer }
        z_p02: { type: [number, "null"] }
        z_p98: { type: [number, "null"] }
        reprojected_from_epsg: { type: [integer, "null"] }
        build_s: { type: number }
    Surface:
      type: object
      required: [id, name, kind, status, error, point_cloud_id, design_source, crs_wkt, epsg, proj4, cell_size_m, width, height, geotransform, bounds_native, z_min, z_max, coverage_fraction, method, build_params, stats, captured_on, elevation_role, map_id, tile_grid, measurement_count, job_id, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/SurfaceKind" }
        status: { $ref: "#/components/schemas/SurfaceStatus" }
        error: { type: [string, "null"] }
        point_cloud_id: { type: [string, "null"] }
        design_source: { oneOf: [{ $ref: "#/components/schemas/DesignSource" }, { type: "null" }], description: null for cloud_dsm }
        crs_wkt: { type: [string, "null"], description: null means local metres }
        epsg: { type: [integer, "null"] }
        proj4: { type: [string, "null"], description: derived from crs_wkt at response time }
        cell_size_m: { type: [number, "null"], description: null while building }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        geotransform:
          type: [array, "null"]
          description: GDAL order, north-up
          items: { type: number }
          minItems: 6
          maxItems: 6
        bounds_native:
          type: [array, "null"]
          description: minx, miny, maxx, maxy of the grid
          items: { type: number }
          minItems: 4
          maxItems: 4
        z_min: { type: [number, "null"] }
        z_max: { type: [number, "null"] }
        coverage_fraction: { type: [number, "null"] }
        method: { oneOf: [{ $ref: "#/components/schemas/SurfaceMethod" }, { type: "null" }], description: null while building }
        build_params: { oneOf: [{ $ref: "#/components/schemas/SurfaceBuildParams" }, { type: "null" }], description: null for design }
        stats: { oneOf: [{ $ref: "#/components/schemas/SurfaceBuildStats" }, { type: "null" }], description: null for design }
        captured_on:
          {
            type: [string, "null"],
            format: date,
            description: "the survey date; a cloud DSM's comes from its cloud, a dem's from its import; null for a design",
          }
        elevation_role:
          {
            oneOf: [{ $ref: "#/components/schemas/ElevationRole" }, { type: "null" }],
            description: "dem only; null for cloud_dsm and design",
          }
        map_id: { type: [string, "null"], description: read through from the cloud; the ortho of the same flight }
        tile_grid: { oneOf: [{ $ref: "#/components/schemas/TileGrid" }, { type: "null" }] }
        measurement_count: { type: integer }
        job_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    SurfaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Surface" }
    SurfaceBuildRequest:
      type: object
      required: [point_cloud_id]
      properties:
        point_cloud_id: { type: string }
        name: { type: string, minLength: 1 }
        method: { $ref: "#/components/schemas/SurfaceBuildMethod" }
        cell_size_m: { type: [number, "null"], minimum: 0.01, maximum: 5, description: auto when absent or null }
        hole_fill_max_gap_m: { type: number, minimum: 0, maximum: 10, description: "1.0 when absent; 0 = off" }
        despike_m: { type: [number, "null"], minimum: 0.1, maximum: 100, description: "1.0 when absent; null = off" }
        z_clip:
          type: [array, "null"]
          items: { type: number }
          minItems: 2
          maxItems: 2
        drop_noise_classes: { type: boolean, description: true when absent }
        assume_metres: { type: boolean, description: false when absent }
    SurfacePatch:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        captured_on:
          {
            type: [string, "null"],
            format: date,
            minLength: 10,
            maxLength: 10,
            description: "the survey date of a dem (the workspace's set date); null clears it",
          }
        elevation_role: { $ref: "#/components/schemas/ElevationRole" }
    SurfaceWithJob:
      type: object
      required: [surface, job]
      properties:
        surface: { $ref: "#/components/schemas/Surface" }
        job: { $ref: "#/components/schemas/Job" }
    SurfaceSample:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: [number, "null"], description: null over nodata }
    VolumeStatus:
      type: string
      enum: [calculating, ready, failed, stale]
    VolumeBaseKind:
      type: string
      enum: [toe_plane, toe_surface, flat, surface, toe_lowest]
    VolumeBase:
      type: object
      required: [kind]
      description: z is required for flat and surface_id for surface; the server answers 422 otherwise
      properties:
        kind: { $ref: "#/components/schemas/VolumeBaseKind" }
        z: { type: [number, "null"] }
        surface_id: { type: [string, "null"] }
    VolumeRing:
      type: array
      description: "[x, y] vertices in the top surface's CRS"
      minItems: 3
      maxItems: 5000
      items:
        type: array
        items: { type: number }
        minItems: 2
        maxItems: 2
    ExclusionMode:
      type: string
      enum: [patch, exclude]
    ExclusionPolygon:
      type: object
      required: [id, ring, mode]
      properties:
        id: { type: string, description: client-generated (a UUID) so edits can target it }
        ring: { $ref: "#/components/schemas/VolumeRing" }
        mode: { $ref: "#/components/schemas/ExclusionMode" }
    VolumeMasks:
      type: object
      required: [detection_run_ids, class_ids, buffer_m, exclusion_polygons]
      properties:
        detection_run_ids: { type: array, items: { type: string } }
        class_ids: { type: [array, "null"], items: { type: string }, description: null means every class }
        buffer_m: { type: number, minimum: 0, maximum: 5 }
        exclusion_polygons: { type: array, items: { $ref: "#/components/schemas/ExclusionPolygon" } }
    VolumeMasksInput:
      type: object
      description: fields that are sent replace the stored ones
      properties:
        detection_run_ids: { type: array, items: { type: string }, description: "[] when absent" }
        class_ids: { type: [array, "null"], items: { type: string }, description: null when absent }
        buffer_m: { type: number, minimum: 0, maximum: 5, description: "1.0 when absent" }
        exclusion_polygons: { type: array, items: { $ref: "#/components/schemas/ExclusionPolygon" }, description: "[] when absent" }
    AlignmentMeasured:
      type: object
      required: [n_cells, median_dz, mad, sigma, tilt_mm_per_m, span_m]
      properties:
        n_cells: { type: integer }
        median_dz: { type: number }
        mad: { type: number }
        sigma: { type: number }
        tilt_mm_per_m: { type: number }
        span_m: { type: number }
    VolumeAlignment:
      type: object
      required: [stable_polygon, apply_shift, measured]
      properties:
        stable_polygon: { oneOf: [{ $ref: "#/components/schemas/VolumeRing" }, { type: "null" }] }
        apply_shift: { type: boolean }
        measured: { oneOf: [{ $ref: "#/components/schemas/AlignmentMeasured" }, { type: "null" }] }
    VolumeAlignmentInput:
      type: object
      properties:
        stable_polygon: { oneOf: [{ $ref: "#/components/schemas/VolumeRing" }, { type: "null" }], description: null when absent }
        apply_shift: { type: boolean, description: false when absent }
    VolumeWarningCode:
      type: string
      enum: [nodata_high, patch_too_large, patch_failed, edge_coverage_low, base_fit_poor, stable_area_small, no_stable_area, alignment_offset, alignment_datum, alignment_noisy, alignment_tilt, mask_other_flight]
    VolumeWarning:
      type: object
      required: [code, severity, message]
      properties:
        code: { $ref: "#/components/schemas/VolumeWarningCode" }
        severity: { type: string, enum: [warn, danger] }
        message: { type: string }
    VolumeTotals:
      type: object
      required: [fill_m3, cut_m3, net_m3]
      properties:
        fill_m3: { type: number }
        cut_m3: { type: number }
        net_m3: { type: number }
    BaseFit:
      type: object
      required: [kind, samples, rejected, usable_edge_fraction, rms_m, plane]
      properties:
        kind: { $ref: "#/components/schemas/VolumeBaseKind" }
        samples: { type: integer }
        rejected: { type: integer }
        usable_edge_fraction: { type: number }
        rms_m: { type: number }
        plane:
          type: [array, "null"]
          items: { type: number }
          minItems: 3
          maxItems: 3
        z: { type: [number, "null"], description: "toe_lowest: the level of the flat base (the lowest kept edge sample)" }
    VolumeUncertainty:
      type: object
      required: [total_m3, base_m3, alignment_m3, cell_size_m3, nodata_m3, patch_m3, complete]
      properties:
        total_m3: { type: [number, "null"] }
        base_m3: { type: [number, "null"] }
        alignment_m3: { type: [number, "null"] }
        cell_size_m3: { type: [number, "null"] }
        nodata_m3: { type: [number, "null"] }
        patch_m3: { type: [number, "null"] }
        complete: { type: boolean }
    SurfaceRef:
      type: object
      description: a provenance snapshot of a surface at calculation time
      required: [id, name, kind, method, cell_size_m, captured_on, cloud_file, cloud_sha256]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/SurfaceKind" }
        method: { oneOf: [{ $ref: "#/components/schemas/SurfaceMethod" }, { type: "null" }] }
        cell_size_m: { type: number }
        captured_on: { type: [string, "null"], format: date }
        cloud_file: { type: [string, "null"] }
        cloud_sha256: { type: [string, "null"] }
    VolumeResults:
      type: object
      additionalProperties: false
      required: [fill_m3, cut_m3, net_m3, area_m2, polygon_area_m2, measured_area_m2, masked_area_m2, excluded_area_m2, nodata_area_m2, cell_size_m, areal_scale_factor, shift_applied_m, diff_scale_m, duration_s, footprints_used, patch_regions, unshifted, alignment, base_fit, uncertainty, warnings, top_surface, base_surface, inputs, inputs_fingerprint, engine_version, computed_at]
      properties:
        fill_m3: { type: number }
        cut_m3: { type: number }
        net_m3: { type: number }
        area_m2: { type: number }
        polygon_area_m2: { type: number }
        measured_area_m2: { type: number }
        masked_area_m2: { type: number }
        excluded_area_m2: { type: number }
        nodata_area_m2: { type: number }
        cell_size_m: { type: number }
        areal_scale_factor: { type: number }
        shift_applied_m: { type: number }
        diff_scale_m: { type: number }
        duration_s: { type: number }
        footprints_used: { type: integer }
        patch_regions: { type: integer }
        unshifted: { oneOf: [{ $ref: "#/components/schemas/VolumeTotals" }, { type: "null" }] }
        alignment: { oneOf: [{ $ref: "#/components/schemas/AlignmentMeasured" }, { type: "null" }] }
        base_fit: { oneOf: [{ $ref: "#/components/schemas/BaseFit" }, { type: "null" }] }
        uncertainty: { $ref: "#/components/schemas/VolumeUncertainty" }
        warnings: { type: array, items: { $ref: "#/components/schemas/VolumeWarning" } }
        top_surface: { $ref: "#/components/schemas/SurfaceRef" }
        base_surface: { oneOf: [{ $ref: "#/components/schemas/SurfaceRef" }, { type: "null" }] }
        inputs: { type: object, additionalProperties: true, description: a canonical snapshot of the inputs }
        inputs_fingerprint: { type: string, description: sha256 of the canonical JSON of `inputs` }
        engine_version: { type: integer }
        computed_at: { type: string, format: date-time }
    VolumeMeasurement:
      type: object
      required: [id, name, status, error, polygon_native, top_surface_id, base, masks, alignment, material, results, stale_reasons, job_id, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/VolumeStatus" }
        error: { type: [string, "null"] }
        polygon_native: { $ref: "#/components/schemas/VolumeRing" }
        top_surface_id: { type: string }
        base: { $ref: "#/components/schemas/VolumeBase" }
        masks: { $ref: "#/components/schemas/VolumeMasks" }
        alignment: { $ref: "#/components/schemas/VolumeAlignment" }
        material:
          {
            oneOf: [{ $ref: "#/components/schemas/VolumeMaterial" }, { type: "null" }],
            description: "not a calculation input; changing it never makes the result stale",
          }
        polygon_site:
          {
            oneOf: [{ $ref: "#/components/schemas/SiteRing" }, { type: "null" }],
            description: "only with frame=site: the polygon in the site frame; absent or null otherwise",
          }
        results: { oneOf: [{ $ref: "#/components/schemas/VolumeResults" }, { type: "null" }] }
        stale_reasons: { type: array, items: { type: string }, description: "response only: the inputs that changed, e.g. \"masks: detection run deleted\"" }
        job_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VolumeMeasurementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VolumeMeasurement" }
    VolumeMeasurementCreate:
      type: object
      description: "exactly one of polygon_native and polygon_site; both or neither is 422 invalid_geometry"
      required: [name, top_surface_id, base]
      properties:
        name: { type: string, minLength: 1 }
        polygon_native: { $ref: "#/components/schemas/VolumeRing" }
        polygon_site:
          {
            $ref: "#/components/schemas/SiteRing",
            description: "the polygon in the site frame; the server converts it into the top surface's CRS",
          }
        material: { $ref: "#/components/schemas/VolumeMaterial" }
        top_surface_id: { type: string }
        base: { $ref: "#/components/schemas/VolumeBase" }
        masks: { $ref: "#/components/schemas/VolumeMasksInput" }
        alignment: { $ref: "#/components/schemas/VolumeAlignmentInput" }
    VolumeMeasurementPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        polygon_native: { $ref: "#/components/schemas/VolumeRing" }
        top_surface_id: { type: string }
        base: { $ref: "#/components/schemas/VolumeBase" }
        masks: { $ref: "#/components/schemas/VolumeMasksInput" }
        alignment: { $ref: "#/components/schemas/VolumeAlignmentInput" }
        polygon_site: { $ref: "#/components/schemas/SiteRing" }
        material:
          {
            oneOf: [{ $ref: "#/components/schemas/VolumeMaterial" }, { type: "null" }],
            description: null clears it,
          }
    VolumeMeasurementWithJob:
      type: object
      required: [measurement, job]
      properties:
        measurement: { $ref: "#/components/schemas/VolumeMeasurement" }
        job: { $ref: "#/components/schemas/Job" }
    VolumeFootprint:
      type: object
      required: [run_id, detection_id, class_id, ring]
      properties:
        run_id: { type: string }
        detection_id: { type: string }
        class_id: { type: string }
        ring: { $ref: "#/components/schemas/VolumeRing" }
        ring_site:
          {
            oneOf: [{ $ref: "#/components/schemas/SiteRing" }, { type: "null" }],
            description: "only with frame=site; absent or null otherwise",
          }
    VolumeFootprints:
      type: object
      required: [items, truncated]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/VolumeFootprint" } }
        truncated: { type: boolean, description: true past 5 000 footprints }
    VolumeExportFormat:
      type: string
      enum: [pdf, gpkg, csv, xlsx]
    VolumeExportRequest:
      type: object
      required: [measurement_ids, formats]
      properties:
        measurement_ids: { type: array, items: { type: string }, minItems: 1, uniqueItems: true }
        formats: { type: array, items: { $ref: "#/components/schemas/VolumeExportFormat" }, minItems: 1, uniqueItems: true }
        title: { type: string, maxLength: 200, description: the project name when absent }
    # ------------------------------------------------------------ design surfaces (S3)
    DesignFormat: { type: string, enum: [geotiff, landxml, dxf] }
    LinearUnit: { type: string, enum: [millimetre, centimetre, metre, international_foot, us_survey_foot] }
    DesignGeometry: { type: string, enum: [faces, points, raster, none] }
    DesignCandidateKind: { type: string, enum: [dem, tin_surface, dxf_layer] }
    DesignWarningLevel: { type: string, enum: [info, warn, block] }
    DesignInspectionCreate:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, description: absolute path of a .tif/.tiff, .xml/.landxml or .dxf file }
    DesignRasterInfo:
      type: object
      required: [width, height, cell_x, cell_y, dtype, nodata, band_count]
      properties:
        width: { type: integer }
        height: { type: integer }
        cell_x: { type: number }
        cell_y: { type: number }
        dtype: { type: string }
        nodata: { type: [number, "null"] }
        band_count: { type: integer }
    DesignCandidate:
      type: object
      required: [id, kind, name, geometry, bounds_file, z_min, z_max, point_count, face_count, entity_counts, default_selected, notes, raster]
      properties:
        id: { type: string, pattern: "^c[0-9]{1,6}$" }
        kind: { $ref: "#/components/schemas/DesignCandidateKind" }
        name: { type: string }
        geometry: { $ref: "#/components/schemas/DesignGeometry" }
        bounds_file: { type: array, items: { type: number }, minItems: 4, maxItems: 4, description: "[minx, miny, maxx, maxy] in file units, x = easting (LandXML N/E already applied)" }
        z_min: { type: [number, "null"] }
        z_max: { type: [number, "null"] }
        point_count: { type: integer }
        face_count: { type: integer }
        entity_counts: { type: object, additionalProperties: { type: integer }, description: "DXF: 3dface, mesh, polyface, polymesh, polyline_3d, polyline_2d, lwpolyline, line, point, unsupported; LandXML: invisible_faces" }
        default_selected: { type: boolean }
        notes: { type: array, items: { $ref: "#/components/schemas/DesignWarning" } }
        raster: { oneOf: [{ $ref: "#/components/schemas/DesignRasterInfo" }, { type: "null" }] }
    DesignDetected:
      type: object
      required: [horizontal_unit, vertical_unit, unit_source, crs_wkt, epsg, crs_source, crs_hint]
      properties:
        horizontal_unit: { oneOf: [{ $ref: "#/components/schemas/LinearUnit" }, { type: "null" }] }
        vertical_unit: { oneOf: [{ $ref: "#/components/schemas/LinearUnit" }, { type: "null" }] }
        unit_source: { type: string, description: "e.g. 'LandXML <Imperial linearUnit=USSurveyFoot>', 'DXF $INSUNITS=6', 'CRS axis unit', 'none'" }
        crs_wkt: { type: [string, "null"] }
        epsg: { type: [integer, "null"] }
        crs_source: { type: [string, "null"] }
        crs_hint: { type: [string, "null"], description: an unverified CRS name (DXF GEODATA, LandXML name) }
    DesignInspection:
      type: object
      required: [id, state, error, job_id, path, format, file_size, sha256, detected, candidates, default_target_surface_id, created_at]
      properties:
        id: { type: string }
        state: { type: string, enum: [inspecting, ready, failed] }
        error: { type: [string, "null"] }
        job_id: { type: string }
        path: { type: string }
        format: { $ref: "#/components/schemas/DesignFormat" }
        file_size: { type: integer }
        sha256: { type: [string, "null"] }
        detected: { oneOf: [{ $ref: "#/components/schemas/DesignDetected" }, { type: "null" }] }
        candidates: { type: array, items: { $ref: "#/components/schemas/DesignCandidate" } }
        default_target_surface_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    DesignInspectionWithJob:
      type: object
      required: [inspection, job]
      properties:
        inspection: { $ref: "#/components/schemas/DesignInspection" }
        job: { $ref: "#/components/schemas/Job" }
    DesignImportOptions:
      type: object
      required: [candidate_ids, source_crs, horizontal_unit, vertical_unit]
      properties:
        candidate_ids: { type: array, minItems: 1, items: { type: string, pattern: "^c[0-9]{1,6}$" } }
        source_crs: { type: string, minLength: 1, description: "'EPSG:<code>' or WKT; parsed with pyproj.CRS.from_user_input" }
        horizontal_unit: { $ref: "#/components/schemas/LinearUnit" }
        vertical_unit: { $ref: "#/components/schemas/LinearUnit" }
        swap_xy: { type: boolean, description: "false when absent" }
        target_surface_id: { type: [string, "null"], description: "null when absent. A ready cloud_dsm surface; the output adopts its CRS and cell size on the aligned lattice (same_lattice with it)" }
        cell_size_m: { type: [number, "null"], exclusiveMinimum: 0, description: "null when absent; required when target_surface_id is null; ignored otherwise; default in the UI 0.25" }
        max_edge_m: { type: [number, "null"], minimum: 0, description: "null when absent. Points geometry only; null = automatic, 0 = off" }
    DesignWarning:
      type: object
      required: [code, level, message]
      properties:
        code: { type: string, description: "no_overlap, low_overlap, no_target, looks_geographic, looks_local, foot_ambiguity, units_mismatch_crs, units_assumed, z_offset, z_units, crs_assumed, crs_from_file, overlapping_triangles, long_edges_removed, duplicate_points, degenerate_triangles, sentinel_nodata, nodata_unknown, no_heights, unsupported_entities, chorded_arcs, mixed_geometry, nothing_to_triangulate, empty_result, geographic_output, non_metric_output, unsupported_crs_unit, grid_too_large, large_grid, not_tin" }
        level: { $ref: "#/components/schemas/DesignWarningLevel" }
        message: { type: string }
    DesignSuggestion:
      type: object
      required: [code, message, overlap_fraction, options_patch]
      properties:
        code: { type: string, enum: [swap_xy, horizontal_unit] }
        message: { type: string }
        overlap_fraction: { type: number }
        options_patch: { type: object, additionalProperties: true, description: keys of DesignImportOptions to overwrite }
    DesignPreviewOutput:
      type: object
      required: [crs_wkt, epsg, cell_size_m, width, height, bounds_native, preview_cell_size_m]
      properties:
        crs_wkt: { type: string }
        epsg: { type: [integer, "null"] }
        cell_size_m: { type: number }
        width: { type: integer }
        height: { type: integer }
        bounds_native: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        preview_cell_size_m: { type: number }
    DesignZCheck:
      type: object
      required: [median_dz_m, p05_dz_m, p95_dz_m, n_samples, design_z_min_m, design_z_max_m]
      properties:
        median_dz_m: { type: number }
        p05_dz_m: { type: number }
        p95_dz_m: { type: number }
        n_samples: { type: integer }
        design_z_min_m: { type: number }
        design_z_max_m: { type: number }
    DesignPreview:
      type: object
      required: [id, inspection_id, state, error, job_id, options, output, triangle_count, overlap_fraction, target_covered_fraction, design_area_m2, z_check, warnings, suggestions, created_at]
      properties:
        id: { type: string }
        inspection_id: { type: string }
        state: { type: string, enum: [running, ready, failed] }
        error: { type: [string, "null"] }
        job_id: { type: string }
        options: { $ref: "#/components/schemas/DesignImportOptions" }
        output: { oneOf: [{ $ref: "#/components/schemas/DesignPreviewOutput" }, { type: "null" }] }
        triangle_count: { type: [integer, "null"] }
        overlap_fraction: { type: [number, "null"] }
        target_covered_fraction: { type: [number, "null"] }
        design_area_m2: { type: [number, "null"] }
        z_check: { oneOf: [{ $ref: "#/components/schemas/DesignZCheck" }, { type: "null" }] }
        warnings: { type: array, items: { $ref: "#/components/schemas/DesignWarning" } }
        suggestions: { type: array, items: { $ref: "#/components/schemas/DesignSuggestion" } }
        created_at: { type: string, format: date-time }
    DesignPreviewWithJob:
      type: object
      required: [preview, job]
      properties:
        preview: { $ref: "#/components/schemas/DesignPreview" }
        job: { $ref: "#/components/schemas/Job" }
    DesignSurfaceCreate:
      type: object
      required: [inspection_id, preview_id]
      properties:
        inspection_id: { type: string }
        preview_id: { type: string }
        name: { type: string, minLength: 1, maxLength: 200 }
        accept_warnings: { type: boolean, description: "false when absent" }
    DesignSource:
      type: object
      required: [path, format, units, vertical_units, sha256, candidates, source_crs_wkt, source_epsg, swap_xy, max_edge_m, aligned_to_surface_id, accepted_warnings]
      properties:
        path: { type: string }
        format: { $ref: "#/components/schemas/DesignFormat" }
        units: { oneOf: [{ $ref: "#/components/schemas/LinearUnit" }, { type: "null" }] }
        vertical_units: { $ref: "#/components/schemas/LinearUnit" }
        sha256: { type: string }
        candidates: { type: array, items: { type: string } }
        source_crs_wkt: { type: string }
        source_epsg: { type: [integer, "null"] }
        swap_xy: { type: boolean }
        max_edge_m: { type: [number, "null"] }
        aligned_to_surface_id: { type: [string, "null"] }
        accepted_warnings: { type: array, items: { type: string } }
    JobType:
      type: string
      enum: [import, dataset, train, infer, export, results_export, map_import, map_detect, map_export, library_import, library_export, library_starter, library_adopt, map_move, accept_above, recount, area_recount, detect_export, pointcloud_import, pointcloud_export, surface_build, volume_calc, volume_export, design_import, project_migrate, findings_backfill, findings_recount, dataset_build, image_metadata, summary_rebuild, assist_acquire, elevation_import, drawing_import, pointcloud_profile]
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    Job:
      type: object
      required: [id, project_id, type, state, progress, message, log_path, params, result, error, created_at, started_at, finished_at]
      properties:
        id: { type: string }
        project_id: { type: string, description: "the project id, or `library` for library jobs" }
        type: { $ref: "#/components/schemas/JobType" }
        state: { $ref: "#/components/schemas/JobState" }
        progress: { type: number, minimum: 0, maximum: 1 }
        message: { type: string }
        log_path: { type: string, description: "relative: runs/<job_id>/job.log" }
        params:
          type: object
          additionalProperties: true
        result:
          type: [object, "null"]
          additionalProperties: true
          description: "type-specific: import {source_id, imported, duplicates, failed}; dataset {dataset_id}; train {model_id, metrics} (a library model id); infer {query_run_id, boxes}; library_import and library_starter {model_id}; library_export {format, path}; accept_above {run_id, accepted}; recount {run_id}; area_recount {runs}; detect_export {format, paths}; project_migrate {folder, report_path}; findings_backfill {projects, created}; findings_recount {findings}; dataset_build {dataset_id}; image_metadata {images, updated, skipped}; summary_rebuild {images}; assist_acquire {key}; elevation_import {surface_id}; drawing_import {inspection_id} (phase inspect) or {drawing_id} (phase build); pointcloud_profile {measurement_id, count}"
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
      example:
        id: "j0000000-4444-4000-8000-000000000001"
        project_id: "7f1c2e3a-1111-4000-8000-000000000001"
        type: import
        state: running
        progress: 0.42
        message: "1386 / 3299 images"
        log_path: "runs/j0000000-4444-4000-8000-000000000001/job.log"
        params: { source_id: "50000000-3333-4000-8000-000000000001" }
        result: null
        error: null
        created_at: "2026-09-17T10:05:00Z"
        started_at: "2026-09-17T10:05:01Z"
        finished_at: null
    JobPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        next_cursor: { type: [string, "null"] }
    JobLog:
      type: object
      required: [lines, path]
      properties:
        lines:
          type: array
          items: { type: string }
        path: { type: string }
      example:
        lines: ["2026-09-17 10:05:01 INFO job started", "2026-09-17 10:05:09 INFO 50 / 3299 images"]
        path: "runs/j0000000-4444-4000-8000-000000000001/job.log"

    Event:
      type: object
      description: websocket message (see `x-websocket`)
      required: [type, project_id, job_id, progress, message, payload]
      properties:
        type:
          type: string
          enum:
            [
              job.progress,
              job.state,
              images.changed,
              boxes.changed,
              agent.changed,
              maps.changed,
              map_runs.changed,
              map_labels.changed,
              pointclouds.changed,
              surfaces.changed,
              volumes.changed,
              findings.changed,
              data.changed,
              catalogue.changed,
              migration.changed,
              drawings.changed,
              map_measurements.changed,
              map_workspace.changed,
            ]
        project_id: { type: string, description: "the project id, or `library` for library jobs and `catalogue.changed`" }
        job_id: { type: [string, "null"] }
        progress: { type: [number, "null"] }
        message: { type: string }
        payload:
          type: object
          additionalProperties: true
      example:
        type: job.progress
        project_id: "7f1c2e3a-1111-4000-8000-000000000001"
        job_id: "j0000000-4444-4000-8000-000000000001"
        progress: 0.42
        message: "1386 / 3299 images"
        payload: {}
    # ------------------------------------------------------------ foundation: projects (F-C0)
    CatalogueKind:
      type: string
      enum: [defect, object]
      description: "`defect` types become findings; `object` types are counted, not tracked (umbrella D7)"
    ProjectCover:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [map, image] }
        id: { type: string, description: a map id or an image id }
      example: { kind: map, id: "a0000000-6666-4000-8000-000000000001" }
    ProjectSummary:
      type: object
      description: pre-aggregated counts for the Projects card (foundation §9.2); never a scan of findings, boxes or images
      required: [image_count, maps, point_clouds, elevations, open_findings, open_top_severity, cover]
      properties:
        image_count: { type: integer, minimum: 0 }
        maps: { type: integer, minimum: 0 }
        point_clouds: { type: integer, minimum: 0 }
        elevations: { type: integer, minimum: 0 }
        open_findings: { type: integer, minimum: 0 }
        open_top_severity: { type: integer, minimum: 0, description: open findings at the highest level of the severity scale }
        cover:
          oneOf:
            - $ref: "#/components/schemas/ProjectCover"
            - type: "null"
          description: the newest ready map, else the newest image; null for an empty project
      example: { image_count: 3299, maps: 2, point_clouds: 1, elevations: 1, open_findings: 47, open_top_severity: 3, cover: { kind: map, id: "a0000000-6666-4000-8000-000000000001" } }
    MigrationState:
      type: object
      description: >-
        The foundation upgrade of one project (foundation §11), from `migrations.json`. `pending`
        waits for its `project_migrate` job (or for the model library or the catalogue to open),
        `running` has a live job, `failed` keeps the reason, the failed step and the backup. Every
        field but `state` may be absent or null.
      required: [state]
      properties:
        state: { type: string, enum: [ok, pending, running, failed] }
        job_id: { type: [string, "null"], description: the `project_migrate` library job }
        error: { type: [string, "null"], description: readable text when `failed` }
        code: { type: [string, "null"], description: "why it failed: `backup_failed`, `step_failed`, `open_failed` or `cancelled`" }
        step: { type: [string, "null"], description: "the data step that failed, e.g. `rewrite_class_ids`" }
        backup_path: { type: [string, "null"], description: absolute path of the copy taken before the schema upgrade }
        report_path: { type: [string, "null"], description: "absolute path of `backups\\migration-v2.json`" }
      example: { state: failed, job_id: "j0000000-4444-4000-8000-000000000040", error: "database is locked", code: step_failed, step: rewrite_class_ids, backup_path: "E:\\Projects\\North\\backups\\project.db.v1-20260926T090000Z.bak", report_path: "E:\\Projects\\North\\backups\\migration-v2.json" }
    MigrationFolder:
      type: object
      required: [folder]
      properties:
        folder: { type: string, description: absolute path of the project folder }
      example: { folder: "E:\\Projects\\North" }
    ProjectTypesUpdate:
      type: object
      required: [type_ids]
      properties:
        type_ids:
          type: array
          uniqueItems: true
          maxItems: 500
          description: catalogue type ids, in list order
          items: { type: string }
        hotkeys:
          type: object
          description: type id to the project's hotkey override (a digit 1-9 or a letter); null clears it; a type left out keeps its override
          additionalProperties: { type: [string, "null"], pattern: "^[1-9A-Za-z]$" }
      example: { type_ids: ["c1a2b3c4-0000-4000-8000-000000000001", "c1a2b3c4-0000-4000-8000-000000000009"], hotkeys: { "c1a2b3c4-0000-4000-8000-000000000009": "c" } }
    # ------------------------------------------------------------ foundation: catalogue (F-C0)
    CatalogueType:
      type: object
      description: an app-wide defect or object type in `catalogue.db`; never deleted, only archived
      required: [id, name, colour, kind, default_severity, hotkey, group, archived, origin]
      properties:
        id: { type: string }
        name: { type: string }
        colour: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        kind: { $ref: "#/components/schemas/CatalogueKind" }
        default_severity: { type: [integer, "null"], minimum: 1, maximum: 9, description: the severity a new finding of this type starts with }
        hotkey: { type: [string, "null"], description: "live only inside a type picker, never at workspace level" }
        group: { type: [string, "null"] }
        archived: { type: boolean }
        origin: { type: string, enum: [user, migrated], description: "`migrated` when the foundation migration created it from a project class" }
      example: { id: "c1a2b3c4-0000-4000-8000-000000000009", name: crack, colour: "#ff5a4f", kind: defect, default_severity: 2, hotkey: "c", group: Concrete defects, archived: false, origin: user }
    CatalogueTypePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogueType" }
        next_cursor: { type: [string, "null"] }
        needs_classification: { type: boolean, description: "true after migration merged project classes in as `object` types, until `POST /catalogue/classification/done`; absent means false" }
      example:
        items:
          - { id: "c1a2b3c4-0000-4000-8000-000000000009", name: crack, colour: "#ff5a4f", kind: defect, default_severity: 2, hotkey: "c", group: Concrete defects, archived: false, origin: user }
          - { id: "c1a2b3c4-0000-4000-8000-000000000001", name: excavator, colour: "#f97316", kind: object, default_severity: null, hotkey: "1", group: Machinery, archived: false, origin: migrated }
        next_cursor: null
        needs_classification: true
    CatalogueTypeCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, pattern: '\S', description: must contain a non-whitespace character }
        colour: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$", description: picked by the server when absent }
        kind: { $ref: "#/components/schemas/CatalogueKind" }
        default_severity: { type: [integer, "null"], minimum: 1, maximum: 9, description: null when absent }
        hotkey: { type: [string, "null"], pattern: "^[1-9A-Za-z]$", description: null when absent }
        group: { type: [string, "null"], maxLength: 64, description: null when absent }
      example: { name: crack, colour: "#ff5a4f", kind: defect, default_severity: 2, hotkey: "c", group: Concrete defects }
    CatalogueTypePatch:
      type: object
      description: every field is optional; a field that is sent replaces the stored one
      properties:
        name: { type: string, minLength: 1, maxLength: 64, pattern: '\S' }
        colour: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        kind: { $ref: "#/components/schemas/CatalogueKind" }
        default_severity: { type: [integer, "null"], minimum: 1, maximum: 9 }
        hotkey: { type: [string, "null"], pattern: "^[1-9A-Za-z]$" }
        group: { type: [string, "null"], maxLength: 64 }
        archived: { type: boolean }
      example: { kind: defect, default_severity: 2 }
    CatalogueTypeUpdated:
      description: the patched type, plus whether to offer the findings backfill
      allOf:
        - $ref: "#/components/schemas/CatalogueType"
        - type: object
          required: [backfill_candidates]
          properties:
            backfill_candidates: { type: boolean, description: "true when the kind changed from `object` to `defect`: offer `POST /catalogue/types/{typeId}/backfill`" }
      example: { id: "c1a2b3c4-0000-4000-8000-000000000009", name: crack, colour: "#ff5a4f", kind: defect, default_severity: 2, hotkey: "c", group: Concrete defects, archived: false, origin: migrated, backfill_candidates: true }
    SeverityLevel:
      type: object
      required: [level, name, colour]
      properties:
        level: { type: integer, minimum: 1, maximum: 9 }
        name: { type: string, minLength: 1, maxLength: 32, pattern: '\S' }
        colour: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
      example: { level: 4, name: Critical, colour: "#ff5a4f" }
    SeverityScale:
      type: object
      description: at most nine levels, because the keys 1-9 set a finding's severity
      required: [levels]
      properties:
        levels:
          type: array
          minItems: 1
          maxItems: 9
          items: { $ref: "#/components/schemas/SeverityLevel" }
      example:
        levels:
          - { level: 1, name: Minor, colour: "#3fb68e" }
          - { level: 2, name: Moderate, colour: "#e2bf2e" }
          - { level: 3, name: Major, colour: "#ff9c3a" }
          - { level: 4, name: Critical, colour: "#ff5a4f" }
    OperatorSettings:
      type: object
      description: app-wide operator settings kept in the backend's `settings.json`
      required: [operator_name]
      properties:
        operator_name: { type: [string, "null"], maxLength: 80, description: "the author of new finding comments; null means unset (comments say Operator)" }
      example: { operator_name: Danijel }
    # ------------------------------------------------------------ foundation: findings (F-C0)
    DataItemType:
      type: string
      enum: [image_set, map, elevation, drawing, point_cloud]
      description: "`drawing` is declared now; the map workspace adds its storage and provider"
    FindingStatus:
      type: string
      enum: [open, reviewed, closed]
    FindingAnchorKind:
      type: string
      enum: [image, map, cloud]
    GeoJsonPoint:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Point] }
        coordinates: { type: array, items: { type: number }, minItems: 2, maxItems: 3 }
      example: { type: Point, coordinates: [583120.4, 3265410.2] }
    GeoJsonPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items: { type: array, items: { type: number }, minItems: 2, maxItems: 3 }
      example: { type: Polygon, coordinates: [[[583120.0, 3265410.0], [583130.0, 3265410.0], [583130.0, 3265420.0], [583120.0, 3265410.0]]] }
    FindingGeometry:
      description: a GeoJSON Point or Polygon in the anchor map's CRS
      oneOf:
        - $ref: "#/components/schemas/GeoJsonPoint"
        - $ref: "#/components/schemas/GeoJsonPolygon"
    FindingBox:
      type: object
      description: "a new annotation's box in image pixels, as `BoxCreate` (the type is the finding's); `angle` is 0 when absent"
      required: [x, y, w, h]
      properties:
        x: { type: number }
        y: { type: number }
        w: { type: number, exclusiveMinimum: 0 }
        h: { type: number, exclusiveMinimum: 0 }
        angle: { type: number }
      example: { x: 812, y: 404, w: 96, h: 40 }
    FindingImageAnchor:
      type: object
      required: [kind, image_id, annotation_id]
      properties:
        kind: { type: string, enum: [image] }
        image_id: { type: string }
        annotation_id: { type: string, description: "the annotation (`Box.id`) that is the finding's geometry" }
      example: { kind: image, image_id: "10000000-5555-4000-8000-000000000001", annotation_id: "b0000000-6666-4000-8000-000000000003" }
    FindingMapAnchor:
      type: object
      required: [kind, map_id, geometry]
      properties:
        kind: { type: string, enum: [map] }
        map_id: { type: string }
        geometry: { $ref: "#/components/schemas/FindingGeometry" }
      example: { kind: map, map_id: "a0000000-6666-4000-8000-000000000001", geometry: { type: Point, coordinates: [583120.4, 3265410.2] } }
    FindingCloudAnchor:
      type: object
      required: [kind, cloud_id, x, y, z, uncertainty_m]
      properties:
        kind: { type: string, enum: [cloud] }
        cloud_id: { type: string }
        x: { type: number }
        y: { type: number }
        z: { type: number }
        uncertainty_m: { type: [number, "null"], minimum: 0 }
      example: { kind: cloud, cloud_id: "p0000000-1111-4000-8000-000000000001", x: 583121.2, y: 3265411.8, z: 41.3, uncertainty_m: 0.05 }
    FindingAnchor:
      description: where the finding is; its kind never changes
      oneOf:
        - $ref: "#/components/schemas/FindingImageAnchor"
        - $ref: "#/components/schemas/FindingMapAnchor"
        - $ref: "#/components/schemas/FindingCloudAnchor"
      discriminator:
        propertyName: kind
        mapping:
          image: "#/components/schemas/FindingImageAnchor"
          map: "#/components/schemas/FindingMapAnchor"
          cloud: "#/components/schemas/FindingCloudAnchor"
    FindingImageAnchorInput:
      type: object
      description: exactly one of `annotation_id` (an existing annotation) and `box` (a new one)
      required: [kind, image_id]
      properties:
        kind: { type: string, enum: [image] }
        image_id: { type: string }
        annotation_id: { type: string }
        box: { $ref: "#/components/schemas/FindingBox" }
      oneOf:
        - required: [annotation_id]
        - required: [box]
      example: { kind: image, image_id: "10000000-5555-4000-8000-000000000001", box: { x: 812, y: 404, w: 96, h: 40 } }
    FindingAnchorInput:
      oneOf:
        - $ref: "#/components/schemas/FindingImageAnchorInput"
        - $ref: "#/components/schemas/FindingMapAnchor"
        - $ref: "#/components/schemas/FindingCloudAnchor"
      discriminator:
        propertyName: kind
        mapping:
          image: "#/components/schemas/FindingImageAnchorInput"
          map: "#/components/schemas/FindingMapAnchor"
          cloud: "#/components/schemas/FindingCloudAnchor"
    FindingAnchorPatch:
      type: object
      description: >-
        Moves a map anchor (`geometry`) or a cloud anchor (`x`, `y`, `z`, optional `uncertainty_m`);
        the map, cloud and anchor kind stay. An image anchor moves with its annotation
        (`PATCH /boxes/{boxId}`).
      properties:
        geometry: { $ref: "#/components/schemas/FindingGeometry" }
        x: { type: number }
        y: { type: number }
        z: { type: number }
        uncertainty_m: { type: [number, "null"], minimum: 0 }
      example: { geometry: { type: Point, coordinates: [583122.0, 3265412.5] } }
    Finding:
      type: object
      required: [id, number, type_id, severity, status, note, created_by, confidence, anchor, lon, lat, data_type, data_id, created_at, updated_at, reviewed_at, closed_at]
      properties:
        id: { type: string }
        number: { type: integer, minimum: 1, description: "the human number, shown as `F-` plus at least four digits (`F-0217`); never reused" }
        type_id: { type: string, description: a catalogue type id of kind `defect` }
        severity: { type: [integer, "null"], minimum: 1, maximum: 9, description: "a severity scale level; null is \"No severity\"" }
        status: { $ref: "#/components/schemas/FindingStatus" }
        note: { type: string }
        created_by: { type: string, pattern: "^(human|model:.+)$", description: "`human`, or `model:<library model id>` for an accepted detection" }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        anchor: { $ref: "#/components/schemas/FindingAnchor" }
        lon: { type: [number, "null"], description: "WGS84, for maps and dashboards" }
        lat: { type: [number, "null"] }
        data_type: { $ref: "#/components/schemas/DataItemType" }
        data_id: { type: string, description: "the anchor's data item: the image's source, the map or the point cloud" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
      example:
        id: "f0000000-1212-4000-8000-000000000217"
        number: 217
        type_id: "c1a2b3c4-0000-4000-8000-000000000009"
        severity: 3
        status: open
        note: "Crack along the north parapet, about 40 cm."
        created_by: "model:m0000000-2222-4000-8000-000000000001"
        confidence: 0.87
        anchor: { kind: image, image_id: "10000000-5555-4000-8000-000000000001", annotation_id: "b0000000-6666-4000-8000-000000000003" }
        lon: 47.7625
        lat: 29.4951
        data_type: image_set
        data_id: "50000000-3333-4000-8000-000000000001"
        created_at: "2026-09-26T10:15:00Z"
        updated_at: "2026-09-26T10:20:00Z"
        reviewed_at: null
        closed_at: null
    FindingDetail:
      allOf:
        - $ref: "#/components/schemas/Finding"
        - type: object
          required: [attachment_count, comment_count]
          properties:
            attachment_count: { type: integer, minimum: 0 }
            comment_count: { type: integer, minimum: 0 }
      example:
        id: "f0000000-1212-4000-8000-000000000217"
        number: 217
        type_id: "c1a2b3c4-0000-4000-8000-000000000009"
        severity: 3
        status: open
        note: "Crack along the north parapet, about 40 cm."
        created_by: "model:m0000000-2222-4000-8000-000000000001"
        confidence: 0.87
        anchor: { kind: image, image_id: "10000000-5555-4000-8000-000000000001", annotation_id: "b0000000-6666-4000-8000-000000000003" }
        lon: 47.7625
        lat: 29.4951
        data_type: image_set
        data_id: "50000000-3333-4000-8000-000000000001"
        created_at: "2026-09-26T10:15:00Z"
        updated_at: "2026-09-26T10:20:00Z"
        reviewed_at: null
        closed_at: null
        attachment_count: 2
        comment_count: 3
    FindingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        next_cursor: { type: [string, "null"] }
      example:
        items:
          - id: "f0000000-1212-4000-8000-000000000217"
            number: 217
            type_id: "c1a2b3c4-0000-4000-8000-000000000009"
            severity: 3
            status: open
            note: "Crack along the north parapet, about 40 cm."
            created_by: "model:m0000000-2222-4000-8000-000000000001"
            confidence: 0.87
            anchor: { kind: image, image_id: "10000000-5555-4000-8000-000000000001", annotation_id: "b0000000-6666-4000-8000-000000000003" }
            lon: 47.7625
            lat: 29.4951
            data_type: image_set
            data_id: "50000000-3333-4000-8000-000000000001"
            created_at: "2026-09-26T10:15:00Z"
            updated_at: "2026-09-26T10:20:00Z"
            reviewed_at: null
            closed_at: null
          - id: "f0000000-1212-4000-8000-000000000218"
            number: 218
            type_id: "c1a2b3c4-0000-4000-8000-000000000009"
            severity: null
            status: reviewed
            note: ""
            created_by: human
            confidence: null
            anchor: { kind: map, map_id: "a0000000-6666-4000-8000-000000000001", geometry: { type: Point, coordinates: [583120.4, 3265410.2] } }
            lon: 47.7631
            lat: 29.4948
            data_type: map
            data_id: "a0000000-6666-4000-8000-000000000001"
            created_at: "2026-09-26T10:30:00Z"
            updated_at: "2026-09-26T10:31:00Z"
            reviewed_at: "2026-09-26T10:31:00Z"
            closed_at: null
        next_cursor: null
    FindingCreate:
      type: object
      required: [type_id, anchor]
      properties:
        type_id: { type: string }
        anchor: { $ref: "#/components/schemas/FindingAnchorInput" }
        severity: { type: [integer, "null"], minimum: 1, maximum: 9, description: "the type's `default_severity` when absent" }
        note: { type: string, maxLength: 20000, description: empty when absent }
        status: { $ref: "#/components/schemas/FindingStatus" }
        lon: { type: [number, "null"], description: "WGS84; map anchors send the anchor's centroid; image anchors take the image's GPS when absent" }
        lat: { type: [number, "null"] }
      example: { type_id: "c1a2b3c4-0000-4000-8000-000000000009", anchor: { kind: image, image_id: "10000000-5555-4000-8000-000000000001", box: { x: 812, y: 404, w: 96, h: 40 } }, severity: 3, note: "Crack along the north parapet." }
    FindingPatch:
      type: object
      description: every field is optional; a field that is sent replaces the stored one
      properties:
        type_id: { type: string }
        severity: { type: [integer, "null"], minimum: 1, maximum: 9 }
        status: { $ref: "#/components/schemas/FindingStatus" }
        note: { type: string, maxLength: 20000 }
        anchor: { $ref: "#/components/schemas/FindingAnchorPatch" }
      example: { severity: 4, status: reviewed }
    FindingBulkUpdate:
      type: object
      required: [ids, set]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string }
        set:
          type: object
          minProperties: 1
          properties:
            status: { $ref: "#/components/schemas/FindingStatus" }
            severity: { type: [integer, "null"], minimum: 1, maximum: 9 }
            type_id: { type: string }
      example: { ids: ["f0000000-1212-4000-8000-000000000217", "f0000000-1212-4000-8000-000000000218"], set: { status: closed } }
    FindingBulkResult:
      type: object
      required: [updated, skipped]
      properties:
        updated: { type: integer, minimum: 0 }
        skipped:
          type: array
          items:
            type: object
            required: [id, code]
            properties:
              id: { type: string }
              code: { type: string, description: "`invalid_transition`, `not_a_defect` or `not_found`" }
      example: { updated: 1, skipped: [{ id: "f0000000-1212-4000-8000-000000000218", code: invalid_transition }] }
    FindingTrendDay:
      type: object
      required: [day, open, closed, open_by_severity]
      properties:
        day: { type: string, format: date }
        open: { type: integer, minimum: 0, description: open findings at the end of the day }
        closed: { type: integer, minimum: 0, description: findings closed that day }
        open_by_severity:
          type: object
          description: "severity level (as a string, `\"3\"`) to open findings at that level"
          additionalProperties: { type: integer, minimum: 0 }
    FindingSummary:
      type: object
      description: read only from `finding_count` and `finding_daily`
      required: [by_status, open_by_severity, open_no_severity, by_type, trend]
      properties:
        by_status:
          type: object
          required: [open, reviewed, closed]
          properties:
            open: { type: integer, minimum: 0 }
            reviewed: { type: integer, minimum: 0 }
            closed: { type: integer, minimum: 0 }
        open_by_severity:
          type: object
          description: "every level of the scale (as a string) to its open findings"
          additionalProperties: { type: integer, minimum: 0 }
        open_no_severity: { type: integer, minimum: 0 }
        by_type:
          type: array
          maxItems: 10
          description: the ten types with the most open findings, most first
          items:
            type: object
            required: [type_id, n]
            properties:
              type_id: { type: string }
              n: { type: integer, minimum: 0, description: open findings of the type }
        trend: { type: array, maxItems: 60, items: { $ref: "#/components/schemas/FindingTrendDay" }, description: "up to 60 days, oldest first" }
      example:
        by_status: { open: 47, reviewed: 12, closed: 88 }
        open_by_severity: { "1": 9, "2": 21, "3": 11, "4": 3 }
        open_no_severity: 3
        by_type: [{ type_id: "c1a2b3c4-0000-4000-8000-000000000009", n: 30 }]
        trend:
          - { day: "2026-09-25", open: 49, closed: 2, open_by_severity: { "4": 4 } }
          - { day: "2026-09-26", open: 47, closed: 3, open_by_severity: { "4": 3 } }
    FindingComment:
      type: object
      required: [id, finding_id, author, text, created_at, edited_at]
      properties:
        id: { type: string }
        finding_id: { type: string }
        author: { type: string }
        text: { type: string, maxLength: 4000 }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, "null"], format: date-time }
      example: { id: "k0000000-1313-4000-8000-000000000001", finding_id: "f0000000-1212-4000-8000-000000000217", author: Danijel, text: "Seen again on the May flight, slightly longer.", created_at: "2026-09-26T10:40:00Z", edited_at: null }
    FindingCommentCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000, pattern: '\S' }
      example: { text: "Seen again on the May flight, slightly longer." }
    FindingCommentUpdate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000, pattern: '\S' }
      example: { text: "Seen again on the May flight, about 45 cm now." }
    FindingCommentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FindingComment" }
        next_cursor: { type: [string, "null"] }
      example:
        items:
          - { id: "k0000000-1313-4000-8000-000000000001", finding_id: "f0000000-1212-4000-8000-000000000217", author: Danijel, text: "Seen again on the May flight, slightly longer.", created_at: "2026-09-26T10:40:00Z", edited_at: null }
        next_cursor: null
    FindingAttachment:
      type: object
      required: [id, finding_id, path, original_name, width, height, bytes, created_at]
      properties:
        id: { type: string }
        finding_id: { type: string }
        path: { type: string, description: "project-relative: `findings/<finding_id>/<id>.<ext>`" }
        original_name: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        bytes: { type: integer, minimum: 1, maximum: 52428800 }
        created_at: { type: string, format: date-time }
      example: { id: "h0000000-1414-4000-8000-000000000001", finding_id: "f0000000-1212-4000-8000-000000000217", path: "findings/f0000000-1212-4000-8000-000000000217/h0000000-1414-4000-8000-000000000001.jpg", original_name: "IMG_2041.JPG", width: 4000, height: 3000, bytes: 5242880, created_at: "2026-09-26T10:45:00Z" }
    FindingAttachmentCreate:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, description: "absolute path of a local JPEG, PNG or WebP file; only read" }
      example: { path: "E:\\Site photos\\IMG_2041.JPG" }
    FindingAttachmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FindingAttachment" }
      example:
        items:
          - { id: "h0000000-1414-4000-8000-000000000001", finding_id: "f0000000-1212-4000-8000-000000000217", path: "findings/f0000000-1212-4000-8000-000000000217/h0000000-1414-4000-8000-000000000001.jpg", original_name: "IMG_2041.JPG", width: 4000, height: 3000, bytes: 5242880, created_at: "2026-09-26T10:45:00Z" }
    # ------------------------------------------------------------ foundation: app jobs (F-C0)
    AppJob:
