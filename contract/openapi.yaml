    MapDetection:
      type: object
      required: [id, class_id, confidence, x, y, w, h, angle, review_state, provenance_kind]
      properties:
        id: { type: string }
        review_state: { $ref: "#/components/schemas/ReviewState" }
        provenance_kind: { $ref: "#/components/schemas/ProvenanceKind" }
        class_id: { type: string }
        confidence: { type: number }
        x: { type: number, description: full-resolution map pixels }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        angle: { type: [number, "null"] }
        corners_site: { type: [array, "null"], minItems: 4, maxItems: 4, items: { $ref: "#/components/schemas/SiteVertex" }, description: "only with frame=site: the box's four corners in the site frame" }
    MapDetectionPage:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MapDetection" }
        truncated: { type: boolean, description: more than 5000 boxes matched; the client should switch to density }
      example:
        items: [{ id: "d0000000-1111-4000-8000-000000000001", class_id: "c1a2b3c4-0000-4000-8000-000000000001", confidence: 0.91, x: 1200, y: 800, w: 180, h: 120, angle: null, review_state: unreviewed, provenance_kind: local_model }]
        truncated: false
    MapDensityCell:
      type: object
      required: [gx, gy, class_id, count]
      properties:
        gx: { type: integer }
        gy: { type: integer }
        class_id: { type: string }
        count: { type: integer }
        center_site: { oneOf: [{ $ref: "#/components/schemas/SiteVertex" }, { type: "null" }], description: "only with frame=site: the cell centre in the site frame; absent or null otherwise" }
    MapDensity:
      type: object
      required: [cell_size, cells]
      properties:
        cell_size: { type: number, description: cell edge in map pixels; cell (gx, gy) starts at (gx*cell_size, gy*cell_size) }
        cells:
          type: array
          items: { $ref: "#/components/schemas/MapDensityCell" }
    MapPoint:
      type: array
      items: { type: number }
      minItems: 2
      maxItems: 2
    MapZone:
      type: object
      required: [id, map_id, name, polygon]
      properties:
        id: { type: string }
        map_id: { type: string }
        name: { type: string }
        polygon:
          type: array
          items: { $ref: "#/components/schemas/MapPoint" }
          minItems: 3
      example: { id: "z0000000-9999-4000-8000-000000000001", map_id: "a0000000-6666-4000-8000-000000000001", name: "Zone 1", polygon: [[1000, 1000], [6000, 1000], [6000, 5000], [1000, 5000]] }
    MapZoneCreate:
      type: object
      required: [name, polygon]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        polygon:
          type: array
          items: { $ref: "#/components/schemas/MapPoint" }
          minItems: 3
          maxItems: 1000
    MapZoneUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        polygon:
          type: array
          items: { $ref: "#/components/schemas/MapPoint" }
          minItems: 3
          maxItems: 1000
    MapZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MapZone" }
    MapLabel:
      type: object
      required: [id, map_id, class_id, x, y, w, h, angle, source, created_at, updated_at]
      properties:
        id: { type: string }
        map_id: { type: string }
        class_id: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        angle: { type: [number, "null"] }
        source: { type: string, description: "`manual`, or `from_run:<run id>` until a person edits it" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      example: { id: "l0000000-1212-4000-8000-000000000001", map_id: "a0000000-6666-4000-8000-000000000001", class_id: "c1a2b3c4-0000-4000-8000-000000000001", x: 1210, y: 805, w: 175, h: 118, angle: null, source: manual, created_at: "2026-09-22T12:00:00Z", updated_at: "2026-09-22T12:00:00Z" }
    MapLabelCreate:
      type: object
      required: [class_id, x, y, w, h]
      properties:
        class_id: { type: string }
        x: { type: number, minimum: 0 }
        y: { type: number, minimum: 0 }
        w: { type: number, exclusiveMinimum: 0 }
        h: { type: number, exclusiveMinimum: 0 }
    MapLabelUpdate:
      type: object
      properties:
        class_id: { type: string }
        x: { type: number, minimum: 0 }
        y: { type: number, minimum: 0 }
        w: { type: number, exclusiveMinimum: 0 }
        h: { type: number, exclusiveMinimum: 0 }
    MapLabelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MapLabel" }
    MapLabelSeed:
      type: object
      required: [run_id, zone_id]
      properties:
        run_id: { type: string }
        zone_id: { type: string }
        min_conf: { type: number, minimum: 0, maximum: 1, default: 0.25 }
    MapLabelSeedResult:
      type: object
      required: [created]
      properties:
        created: { type: integer }
    MapScoreRow:
      type: object
      required: [class_id, tp, fp, fn, precision, recall, f1, predicted, actual, count_error, count_error_pct]
      properties:
        class_id: { type: [string, "null"], description: null on the overall row }
        tp: { type: integer }
        fp: { type: integer }
        fn: { type: integer }
        precision: { type: [number, "null"] }
        recall: { type: [number, "null"] }
        f1: { type: [number, "null"] }
        predicted: { type: integer }
        actual: { type: integer }
        count_error: { type: integer, description: predicted minus actual }
        count_error_pct: { type: [number, "null"] }
    MapScoreZoneRow:
      allOf:
        - { $ref: "#/components/schemas/MapScoreRow" }
        - type: object
          required: [zone_id]
          properties:
            zone_id: { type: string }
    MapScoreMatch:
      type: object
      description: one scored box; its geometry is included so the client can step to any mistake without loading that part of the map first
      required: [kind, id, match, zone_id, class_id, x, y, w, h]
      properties:
        kind: { type: string, enum: [detection, label] }
        id: { type: string }
        match: { type: string, enum: [tp, fp, fn] }
        zone_id: { type: string }
        class_id: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
    MapScore:
      type: object
      required: [run_id, iou, labels_version, has_zones, overall, per_class, per_zone, matches]
      properties:
        run_id: { type: string }
        iou: { type: number }
        labels_version: { type: integer }
        has_zones: { type: boolean }
        overall: { $ref: "#/components/schemas/MapScoreRow" }
        per_class:
          type: array
          items: { $ref: "#/components/schemas/MapScoreRow" }
        per_zone:
          type: array
          items: { $ref: "#/components/schemas/MapScoreZoneRow" }
        matches:
          type: array
          items: { $ref: "#/components/schemas/MapScoreMatch" }
      example:
        run_id: "r0000000-7777-4000-8000-000000000001"
        iou: 0.5
        labels_version: 3
        has_zones: true
        overall: { class_id: null, tp: 18, fp: 2, fn: 3, precision: 0.9, recall: 0.857, f1: 0.878, predicted: 20, actual: 21, count_error: -1, count_error_pct: -4.76 }
        per_class: [{ class_id: "c1a2b3c4-0000-4000-8000-000000000001", tp: 18, fp: 2, fn: 3, precision: 0.9, recall: 0.857, f1: 0.878, predicted: 20, actual: 21, count_error: -1, count_error_pct: -4.76 }]
        per_zone: []
        matches:
          - { kind: detection, id: "d0000000-1111-4000-8000-000000000001", match: tp, zone_id: "z0000000-9999-4000-8000-000000000001", class_id: "c1a2b3c4-0000-4000-8000-000000000001", x: 1200, y: 1200, w: 180, h: 120 }
          - { kind: detection, id: "d0000000-1111-4000-8000-000000000002", match: fp, zone_id: "z0000000-9999-4000-8000-000000000001", class_id: "c1a2b3c4-0000-4000-8000-000000000001", x: 3000, y: 2400, w: 170, h: 110 }
          - { kind: label, id: "l0000000-1212-4000-8000-000000000001", match: fn, zone_id: "z0000000-9999-4000-8000-000000000001", class_id: "c1a2b3c4-0000-4000-8000-000000000004", x: 4100, y: 3300, w: 200, h: 140 }
    MapExportFormat:
      type: string
      enum: [geojson, gpkg, csv]
    MapExportContent:
      type: string
      enum: [run, labels, run_score]
    MapExportRequest:
      type: object
      required: [map_id, content, formats]
      properties:
        map_id: { type: string }
        content: { $ref: "#/components/schemas/MapExportContent" }
        run_id: { type: string, description: required for run and run_score }
        formats:
          type: array
          description: "gpkg (GeoPackage) includes review_state, the mapped class and a site_areas layer"
          items: { $ref: "#/components/schemas/MapExportFormat" }
          minItems: 1
          uniqueItems: true
    # ------------------------------------------------------------ detection workspace
    CountPair:
      type: object
      description: "a count shown as total (verified): total is every state except rejected; verified is accepted, edited or drawn by a person"
      required: [total, verified]
      properties:
        total: { type: integer, minimum: 0 }
        verified: { type: integer, minimum: 0 }
      example: { total: 6, verified: 4 }
    ModelSnapshot:
      type: object
      description: "the library model as it was when the run started, so the run still reads after the model is deleted; empty for cloud-provider runs and runs made before snapshots"
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        task: { type: string, enum: [detect, obb] }
        format: { type: string, enum: [pt, onnx] }
        class_names:
          type: array
          items: { type: string }
        origin: { type: string, enum: [trained, imported, starter] }
      example: { id: "m0000000-2222-4000-8000-000000000001", name: "yolo11m-coco", task: detect, format: pt, class_names: [truck, car], origin: starter }
    RunClassMap:
      type: object
      description: "model class name to project class id; null ignores that class (its detections are not written); empty when the run used no mapping"
      additionalProperties: { type: [string, "null"] }
      example: { truck: "c1a2b3c4-0000-4000-8000-000000000004", car: null }
    RunKind:
      type: string
      description: "`images` is a photo run (a query run over one photo source); `map` is a map run"
      enum: [images, map]
    ReviewProgress:
      type: object
      required: [total, reviewed]
      properties:
        total: { type: integer, minimum: 0, description: detections of the run }
        reviewed: { type: integer, minimum: 0, description: detections no longer unreviewed }
      example: { total: 530, reviewed: 412 }
    RunSummary:
      type: object
      required: [id, kind, source_id, source_label, model_id, model_name, conf, job_state, pinned, counts, verified_counts, review, created_at]
      properties:
        id: { type: string, description: the query run or map run id }
        kind: { $ref: "#/components/schemas/RunKind" }
        source_id: { type: [string, "null"] }
        source_label: { type: [string, "null"], description: "the source's label, else its folder or map name" }
        model_id: { type: [string, "null"] }
        model_name: { type: [string, "null"], description: "from the run's model snapshot, or the cloud provider's model" }
        conf: { type: number }
        job_state:
          description: the state of the run's latest job; null before one exists
          oneOf:
            - { $ref: "#/components/schemas/JobState" }
            - { type: "null" }
        pinned: { type: boolean }
        counts: { type: object, additionalProperties: { type: integer }, description: per project class id; every state except rejected }
        verified_counts: { type: object, additionalProperties: { type: integer }, description: per project class id; accepted, edited or drawn by a person }
        review: { $ref: "#/components/schemas/ReviewProgress" }
        created_at: { type: string, format: date-time }
        scope: { $ref: "#/components/schemas/MapRunScope", description: "map runs; absent for photo runs" }
      example:
        id: "r0000000-7777-4000-8000-000000000001"
        kind: map
        source_id: "50000000-3333-4000-8000-000000000002"
        source_label: "May survey"
        model_id: "m0000000-2222-4000-8000-000000000001"
        model_name: "machinery-v3"
        conf: 0.25
        job_state: succeeded
        pinned: false
        counts: { "c1a2b3c4-0000-4000-8000-000000000001": 42, "c1a2b3c4-0000-4000-8000-000000000004": 17 }
        verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 30 }
        review: { total: 59, reviewed: 34 }
        created_at: "2026-09-22T11:00:00Z"
    RunSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RunSummary" }
        next_cursor: { type: [string, "null"] }
    RunCreate:
      type: object
      description: "one run per source. A library model (`model_id`), or a cloud provider (`provider` and `query`)."
      required: [source_ids]
      properties:
        source_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        model_id: { type: string, description: a library model id }
        provider: { $ref: "#/components/schemas/ProviderName" }
        query: { type: string, minLength: 1, description: "free text for a cloud provider, e.g. dump trucks" }
        conf: { type: number, minimum: 0, maximum: 1, default: 0.25 }
        tiling: { $ref: "#/components/schemas/Tiling" }
        target_gsd_cm:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: "map runs: resample windows to this GSD; defaults to the model's training GSD"
        region: { $ref: "#/components/schemas/RunRegion" }
      example: { source_ids: ["50000000-3333-4000-8000-000000000001", "50000000-3333-4000-8000-000000000002"], model_id: "m0000000-2222-4000-8000-000000000001", conf: 0.25 }
    RunCreatedItem:
      type: object
      required: [run_id, source_id, kind, job]
      properties:
        run_id: { type: string }
        source_id: { type: string }
        kind: { $ref: "#/components/schemas/RunKind" }
        job: { $ref: "#/components/schemas/Job" }
    RunCreated:
      type: object
      required: [runs, added_type_ids]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/RunCreatedItem" }
        added_type_ids:
          type: array
          description: catalogue types this run added to the project's type list (foundation §7.4); empty when none
          items: { type: string }
    RunPatch:
      type: object
      required: [pinned]
      additionalProperties: false
      properties:
        pinned: { type: boolean, description: true pins this run and unpins the other runs of its source }
      example: { pinned: true }
    UnmappedClassesError:
      type: object
      description: the `Error` envelope for `createRuns`'s, `detectImage`'s and `detectImageBatch`'s 422s
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: "`unmapped_classes`, `task_not_supported` (`createRuns` only), `model_or_provider_required`, `query_required`, `no_images`, `too_many_images`, or `validation_error` for a malformed body"
            message: { type: string }
            details:
              type: object
              additionalProperties: true
              properties:
                model_id: { type: string }
                unmapped:
                  type: array
                  description: model class names with no project class
                  items: { type: string }
      example:
        error:
          code: unmapped_classes
          message: "2 of the model's classes are not mapped to project classes."
          details: { model_id: "m0000000-2222-4000-8000-000000000001", unmapped: [crane, "concrete mixer"] }
    ModelClassMapOut:
      type: object
      required: [model_id, model_classes, mapping, unmapped]
      properties:
        model_id: { type: string }
        model_classes:
          type: array
          description: the model's class names, in index order
          items: { type: string }
        mapping:
          type: object
          description: model class name to project class id, or null to ignore it
          additionalProperties: { type: [string, "null"] }
        unmapped:
          type: array
          description: model class names that have no entry in `mapping` yet
          items: { type: string }
      example:
        model_id: "m0000000-2222-4000-8000-000000000001"
        model_classes: [excavator, "dump truck", crane]
        mapping: { excavator: "c1a2b3c4-0000-4000-8000-000000000001", "dump truck": "c1a2b3c4-0000-4000-8000-000000000004" }
        unmapped: [crane]
    ModelClassMapPut:
      type: object
      required: [mapping]
      properties:
        mapping:
          type: object
          description: model class name to project class id, or null to ignore it
          additionalProperties: { type: [string, "null"] }
        new_classes:
          type: array
          default: []
          uniqueItems: true
          description: model class names to add as project classes, each mapped to itself
          items: { type: string, minLength: 1 }
      example: { mapping: { excavator: "c1a2b3c4-0000-4000-8000-000000000001", "dump truck": null }, new_classes: [crane] }
    MapDetectionReview:
      type: object
      required: [detection_ids, action]
      properties:
        detection_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        action:
          type: string
          enum: [accept, reject, unreview, reclass]
          description: "`unreview` puts a detection back to unreviewed; `reclass` needs `class_id` and sets the state `edited`"
        class_id: { type: string, description: required for reclass }
      example: { detection_ids: ["d0000000-1111-4000-8000-000000000001"], action: accept }
    MapDetectionReviewResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer, minimum: 0 }
      example: { updated: 1 }
    MapDetectionCreate:
      type: object
      required: [class_id, x, y, w, h]
      properties:
        class_id: { type: string }
        x: { type: number, description: full-resolution map pixels }
        y: { type: number }
        w: { type: number, exclusiveMinimum: 0 }
        h: { type: number, exclusiveMinimum: 0 }
        angle: { type: [number, "null"] }
      example: { class_id: "c1a2b3c4-0000-4000-8000-000000000001", x: 2400, y: 1300, w: 170, h: 110 }
    NextUnreviewed:
      type: object
      required: [detection, remaining]
      properties:
        detection:
          oneOf:
            - { $ref: "#/components/schemas/MapDetection" }
            - { type: "null" }
        remaining: { type: integer, minimum: 0, description: unreviewed detections left in the run }
      example:
        detection: { id: "d0000000-1111-4000-8000-000000000002", class_id: "c1a2b3c4-0000-4000-8000-000000000001", confidence: 0.64, x: 3000, y: 2400, w: 170, h: 110, angle: null, review_state: unreviewed, provenance_kind: local_model }
        remaining: 118
    AcceptAbove:
      type: object
      required: [min_confidence]
      properties:
        min_confidence: { type: number, minimum: 0, maximum: 1 }
      example: { min_confidence: 0.8 }
    LonLat:
      type: array
      description: "[longitude, latitude] in WGS84 degrees"
      minItems: 2
      maxItems: 2
      items: { type: number }
    PixelPoint:
      type: array
      description: "[x, y] in full-resolution map pixels"
      minItems: 2
      maxItems: 2
      items: { type: number }
    SiteArea:
      type: object
      required: [id, name, polygon_wgs84, category, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        polygon_wgs84:
          type: array
          minItems: 3
          description: the outline, not closed (the first point is not repeated)
          items: { $ref: "#/components/schemas/LonLat" }
        category: { $ref: "#/components/schemas/SiteAreaCategory" }
        polygon_site: { type: [array, "null"], items: { $ref: "#/components/schemas/SiteVertex" }, description: "only with frame=site: the outline in the site frame" }
        created_at: { type: string, format: date-time }
      example:
        id: "5a000000-aaaa-4000-8000-000000000001"
        name: "North laydown yard"
        category: laydown
        polygon_wgs84: [[47.7610, 29.4960], [47.7640, 29.4960], [47.7640, 29.4980], [47.7610, 29.4980]]
        created_at: "2026-09-23T09:00:00Z"
    SiteAreaCreate:
      type: object
      description: "either `polygon_wgs84`, or `map_id` with `polygon_px` drawn on that map (the server converts it with the map's georeference)"
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        polygon_wgs84:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/LonLat" }
        map_id: { type: string }
        polygon_px:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/PixelPoint" }
        category:
          {
            $ref: "#/components/schemas/SiteAreaCategory",
            description: "general when absent on create",
          }
      example: { name: "North laydown yard", map_id: "a0000000-6666-4000-8000-000000000001", polygon_px: [[1000, 800], [4000, 800], [4000, 3000], [1000, 3000]] }
    SiteAreaPatch:
      type: object
      description: "a new outline is either `polygon_wgs84`, or `map_id` with `polygon_px`"
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        polygon_wgs84:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/LonLat" }
        map_id: { type: string }
        polygon_px:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/PixelPoint" }
        category:
          {
            $ref: "#/components/schemas/SiteAreaCategory",
            description: "unchanged when absent",
          }
      example: { name: "North yard" }
    SiteAreaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SiteArea" }
    ClassCountRow:
      type: object
      required: [class_id, name, colour, total, verified]
      properties:
        class_id: { type: string }
        name: { type: string }
        colour: { type: string }
        total: { type: integer, minimum: 0 }
        verified: { type: integer, minimum: 0 }
      example: { class_id: "c1a2b3c4-0000-4000-8000-000000000001", name: excavator, colour: "#f97316", total: 6, verified: 4 }
    SourceAnalytics:
      type: object
      required: [source, unit, image_count, run, classes, review]
      properties:
        source: { $ref: "#/components/schemas/Source" }
        unit:
          type: string
          enum: [objects, detections]
          description: "`objects` for a map source; `detections` for photos, where one object can appear in several photos"
        image_count: { type: [integer, "null"], description: photos in a photo source; null for a map }
        run:
          description: the run that represents the source; null before any run
          oneOf:
            - { $ref: "#/components/schemas/RunSummary" }
            - { type: "null" }
        classes:
          type: array
          items: { $ref: "#/components/schemas/ClassCountRow" }
        review: { $ref: "#/components/schemas/ReviewProgress" }
    AreaRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    AreaSurveyCell:
      type: object
      required: [partial, counts]
      properties:
        partial: { type: boolean, description: part of the area lies outside this map }
        counts:
          type: object
          description: per class id
          additionalProperties: { $ref: "#/components/schemas/CountPair" }
    AreaSurvey:
      type: object
      required: [map_id, map_name, captured_on, state, per_area]
      properties:
        map_id: { type: string }
        map_name: { type: string }
        captured_on: { type: [string, "null"], format: date }
