        dx: { type: [number, "null"] }
        dy: { type: [number, "null"] }
        dz: { type: [number, "null"] }
        distance_3d: { type: [number, "null"] }
        distance_horizontal: { type: [number, "null"] }
        distance_vertical: { type: [number, "null"] }
        height_difference: { type: [number, "null"], description: second pick minus first, signed }
        lean_offset_m: { type: [number, "null"] }
        lean_angle_deg: { type: [number, "null"], description: degrees from vertical }
        lean_azimuth_deg: { type: [number, "null"], description: the top relative to the base, clockwise from grid north }
        lean_mm_per_m: { type: [number, "null"] }
        uncertainty_m: { type: [number, "null"] }
        angle_uncertainty_deg: { type: [number, "null"] }
        area_m2: { type: [number, "null"], description: "the primary area (`params.mode`)" }
        area_surface_m2: { type: [number, "null"], description: "on the polygon's best-fit plane (Newell)" }
        area_plan_m2: { type: [number, "null"], description: projected horizontally }
        perimeter_m: { type: [number, "null"] }
        plane_rms_m: { type: [number, "null"], description: the vertices' RMS distance from the best-fit plane }
        plane_tilt_deg: { type: [number, "null"], description: "the plane's tilt from horizontal (0 is a slab, 90 a wall)" }
        plane_azimuth_deg: { type: [number, "null"], description: "the plane normal's bearing, clockwise from grid north" }
        uncertainty_m2: { type: [number, "null"] }
        ring_radius_lower_m: { type: [number, "null"] }
        ring_radius_upper_m: { type: [number, "null"] }
        ring_rms_lower_m: { type: [number, "null"] }
        ring_rms_upper_m: { type: [number, "null"] }
        profile_length_m: { type: [number, "null"] }
