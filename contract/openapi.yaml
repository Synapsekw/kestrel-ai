            updated_at: "2026-09-17T11:00:00Z"
    BoxCreate:
      type: object
      required: [class_id]
      description: >-
        A person-drawn annotation. `shape` is `box` when absent. `box` and `rbox` need `x, y, w, h`
        (and `angle` for a rotated one); `polygon` needs `points` and ignores `x, y, w, h, angle`
        (the server derives the envelope); `point` needs `x, y`, ignores the rest and takes only a
        defect type. A missing field answers 422 `invalid_shape`. `x`/`y` have no minimum: they
        describe the *unrotated* box, so a box rotated near the left or top edge has a negative one
        while its centre is still inside the image. The server is the single judge of bounds and of
        polygon validity (image inspection spec §8.2).
      properties:
        class_id: { type: string }
        shape: { $ref: "#/components/schemas/BoxShape" }
        x: { type: number }
        y: { type: number }
        w: { type: number, exclusiveMinimum: 0 }
        h: { type: number, exclusiveMinimum: 0 }
        angle:
          type: number
          description: >-
            Rotation in degrees about the box's own centre. Optional; omitting it means 0.
            Any value is accepted and normalised into [0, 180) on write, because a rectangle has
            180 degree symmetry — 190 is a legitimate way to say 10. The bounds are therefore
            guaranteed on the way out (see Box.angle), not demanded on the way in.
        points:
          type: array
          minItems: 3
          maxItems: 2000
          description: polygon vertices in stored-image pixels, any orientation; the server repairs and clips them and says so in `repaired`
          items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        assist: { type: string, enum: [sam], description: "`sam` when the smart-polygon tool drew it; absent otherwise" }
      example: { class_id: "c1a2b3c4-0000-4000-8000-000000000001", x: 512, y: 300, w: 140, h: 90 }
    BoxUpdate:
      type: object
      description: >-
        Every field is optional and none is nullable. `x`/`y` have no minimum, for the reason given
        on BoxCreate. `points` replaces a polygon's vertices and is refused (422 `invalid_shape`) on
        any other shape; the shape itself never changes through an update, except that a rectangle
        is `rbox` exactly when its angle is not 0.
      properties:
        class_id: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number, exclusiveMinimum: 0 }
        h: { type: number, exclusiveMinimum: 0 }
        angle:
          type: number
          description: >-
            Rotation in degrees about the box's own centre. Optional; omitting it leaves the
            angle unchanged. Any value is accepted and normalised into [0, 180) on write, because
            a rectangle has 180 degree symmetry — 190 is a legitimate way to say 10. The bounds
            are therefore guaranteed on the way out (see Box.angle), not demanded on the way in.
        points:
          type: array
          minItems: 3
          maxItems: 2000
          items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
      example: { x: 520, y: 305 }
    BoxReview:
      type: object
      required: [box_ids, action]
      properties:
        box_ids:
          type: array
          items: { type: string }
          minItems: 1
        action:
          type: string
          enum: [accept, reject, unreview]
          description: accept/reject a proposal; unreview puts a reviewed proposal back to unreviewed (undo). Person-drawn boxes are ignored by all three.
      example: { box_ids: ["b0000000-6666-4000-8000-000000000002"], action: accept }
    BoxReviewResult:
      type: object
      required: [updated, finding_ids_created, finding_ids_deleted]
      properties:
        updated: { type: integer }
        finding_ids_created: { type: array, items: { type: string }, description: findings the accepts created (defect types) }
        finding_ids_deleted: { type: array, items: { type: string }, description: untouched findings the unreviews deleted }
      example: { updated: 1, finding_ids_created: ["f0000000-1212-4000-8000-000000000231"], finding_ids_deleted: [] }
    BoxWriteResult:
      description: the written annotation, plus what the write did (image inspection spec §8.3)
      allOf:
        - $ref: "#/components/schemas/Box"
        - type: object
          required: [repaired, finding_id]
          properties:
            repaired: { type: boolean, description: "the server changed the geometry (made valid, clipped to the image, re-oriented or rounded); the UI says so" }
            finding_id: { type: [string, "null"], description: "the annotation's finding (a person's annotation on a defect type creates one); null when it has none" }
      example:
        id: "b0000000-6666-4000-8000-000000000001"
        image_id: "10000000-5555-4000-8000-000000000001"
        class_id: "c1a2b3c4-0000-4000-8000-000000000001"
        x: 512.0
        y: 300.0
        w: 140.0
        h: 90.0
        angle: 0.0
        confidence: null
        provenance: { kind: person, model_id: null, provider: null, model_name: null, query_run_id: null }
        review_state: accepted
        reviewed_at: "2026-09-17T10:45:00Z"
        created_at: "2026-09-17T10:45:00Z"
        shape: box
        points: null
        assist: null
        area_px: 12600.0
        updated_at: "2026-09-17T10:45:00Z"
        repaired: false
        finding_id: null

    # ------------------------------------------------------------ images (I-C0)
    ImageIndex:
      type: object
      description: >-
        One entry per image matching the filters, in sort order, as parallel arrays (image
        inspection spec §7.1). At most 100,000 rows; above that the request answers 422
        `too_many_images`. Cell details come from `listImages?ids=` for the visible window.
      required: [total, ids, sev, count, flags]
      properties:
        total: { type: integer, minimum: 0 }
        ids: { type: array, items: { type: string } }
        sev: { type: array, items: { type: integer, minimum: 0, maximum: 9 }, description: "worst severity of the image's findings that are not `closed`; 0 when none" }
        count: { type: array, items: { type: integer, minimum: 0 }, description: "the image's findings that are not `closed`" }
        flags: { type: array, items: { type: integer, minimum: 0, maximum: 15 }, description: "bits: 1 reviewed, 2 pending suggestions, 4 has GPS, 8 marked empty" }
        lon: { type: array, items: { type: [number, "null"] }, description: "only with `fields=geo`" }
        lat: { type: array, items: { type: [number, "null"] }, description: "only with `fields=geo`" }
      example:
        total: 3
        ids: ["10000000-5555-4000-8000-000000000001", "10000000-5555-4000-8000-000000000002", "10000000-5555-4000-8000-000000000003"]
        sev: [4, 0, 2]
        count: [5, 0, 1]
        flags: [5, 8, 6]
    ImageFilter:
      type: object
      description: the browser's filters as a body, with the same meaning as `getImageIndex`'s query parameters
      properties:
        source_id: { type: string }
        has_findings: { type: boolean }
        severity: { type: array, uniqueItems: true, items: { type: integer, minimum: 1, maximum: 9 } }
        finding_status: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/FindingStatus" } }
        type_ids: { type: array, items: { type: string } }
        has_suggestions: { type: boolean }
        reviewed: { type: boolean }
        unlabeled: { type: boolean }
        search: { type: string }
      example: { source_id: "50000000-3333-4000-8000-000000000001", has_suggestions: true }
    ImageMeasurement:
      type: object
      description: "a length drawn on an image; the length is computed on read, so it follows later distance changes (spec §9.3)"
      required: [id, image_id, x1, y1, x2, y2, label, created_at, length_px, length_mm, sigma_mm]
      properties:
        id: { type: string }
        image_id: { type: string }
        x1: { type: number }
        y1: { type: number }
        x2: { type: number }
        y2: { type: number }
        label: { type: string }
        created_at: { type: string, format: date-time }
        length_px: { type: number, minimum: 0 }
        length_mm: { type: [number, "null"], description: from the image's current GSD; null when no distance is known }
        sigma_mm: { type: [number, "null"], description: "one standard deviation of `length_mm`" }
      example:
        id: "e0000000-1313-4000-8000-000000000001"
        image_id: "10000000-5555-4000-8000-000000000001"
        x1: 1200.0
        y1: 800.0
        x2: 1240.0
        y2: 830.0
        label: "crack width"
        created_at: "2026-09-27T09:00:00Z"
        length_px: 50.0
        length_mm: 90.0
        sigma_mm: 4.0
    ImageMeasurementCreate:
      type: object
      required: [x1, y1, x2, y2]
      description: "both ends inside the image (422 `out_of_bounds`); at most 500 per image (422 `too_many_measurements`)"
      properties:
        x1: { type: number }
        y1: { type: number }
        x2: { type: number }
        y2: { type: number }
        label: { type: string, maxLength: 200, description: empty when absent }
      example: { x1: 1200, y1: 800, x2: 1240, y2: 830, label: "crack width" }
    ImageMeasurementList:
      type: object
      required: [items]
