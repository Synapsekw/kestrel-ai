    ComputeDevice:
      type: string
      enum: [cuda, cpu]
    DetectRequest:
      type: object
      required: [model_id]
      properties:
        model_id: { type: string, description: "a library model whose task is detect, obb or segment" }
        conf: { type: number, minimum: 0, maximum: 1, description: confidence threshold; 0.25 when absent }
        imgsz: { type: integer, minimum: 320, maximum: 6400, description: "inference size; the model's training size when absent" }
