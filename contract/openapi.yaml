                    verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 9 }
                    pinned: false
                    deltas: {}
                    state: ok
                    reason: null
                  - map_id: "7c9e1b2a-5555-4000-8000-000000000002"
                    map_name: "May survey"
                    captured_on: "2026-05-20"
                    date_is_import_date: false
