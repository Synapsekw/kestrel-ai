      type: object
      required: [kind, points]
      properties:
        kind: { $ref: "#/components/schemas/CloudMeasurementKind" }
        points:
          type: array
          description: "point 1; distance, height and vertical (points) 2; vertical (rings) 6 to 64 with `group`; area 3 to 200 (the outline, not closed); profile 2 (the section line A, B)"
          items: { $ref: "#/components/schemas/CloudMeasurementPoint" }
          minItems: 1
          maxItems: 200
        name: { type: string, minLength: 1, maxLength: 200, description: "\"Distance 3\"-style numbering when absent" }
        note: { type: string, maxLength: 2000 }
        params:
          oneOf:
            - $ref: "#/components/schemas/CloudMeasurementParams"
            - type: "null"
        finding_id: { type: [string, "null"], description: "attach to this finding (a cloud finding on this cloud); null or absent for none" }
