    ProvenanceKind:
      type: string
      enum: [person, local_model, cloud_provider]
    ReviewState:
      type: string
      enum: [unreviewed, accepted, rejected, edited]
    BoxShape:
      type: string
      enum: [box, rbox, polygon, point]
      description: >-
        `box` and `rbox` are rectangles (the server keeps `rbox` exactly when `angle` is not 0);
        `polygon` has `points`, and `x, y, w, h` are its axis-aligned envelope with `angle` 0;
        `point` is a marker at `x, y` with `w = h = 0`, on defect types only (image inspection spec §8.1).
    Provenance:
      type: object
      required: [kind, model_id, provider, model_name, query_run_id]
      properties:
        kind: { $ref: "#/components/schemas/ProvenanceKind" }
        model_id: { type: [string, "null"] }
        provider: { type: [string, "null"] }
        model_name: { type: [string, "null"] }
        query_run_id: { type: [string, "null"] }
      example: { kind: person, model_id: null, provider: null, model_name: null, query_run_id: null }
    Box:
      type: object
      required: [id, image_id, class_id, x, y, w, h, angle, confidence, provenance, review_state, reviewed_at, created_at, shape, points, assist, area_px, updated_at]
      properties:
        id: { type: string }
        image_id: { type: string }
        class_id: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        angle:
          type: number
          minimum: 0
          exclusiveMaximum: 180
          description: >-
            Rotation in degrees about the box's own centre, clockwise in image coordinates.
            `x`, `y`, `w`, `h` always describe the unrotated box. A rectangle has 180 degree
            symmetry, so the range is [0, 180) and 190 is stored as 10.
        confidence: { type: [number, "null"] }
        provenance: { $ref: "#/components/schemas/Provenance" }
        review_state: { $ref: "#/components/schemas/ReviewState" }
        reviewed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        shape: { $ref: "#/components/schemas/BoxShape" }
        points:
          type: [array, "null"]
          description: "polygon vertices `[[x, y], ...]` in stored-image pixels: one ring, implicitly closed, counter-clockwise, 3 to 2,000 vertices; null for every other shape"
          items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        assist: { type: [string, "null"], enum: [sam, null], description: "`sam` when the smart-polygon tool drew it" }
        area_px: { type: number, minimum: 0, description: "area in square pixels; 0 for a point" }
        updated_at: { type: string, format: date-time }
      example:
        id: "b0000000-6666-4000-8000-000000000001"
        image_id: "10000000-5555-4000-8000-000000000001"
        class_id: "c1a2b3c4-0000-4000-8000-000000000001"
        x: 512.0
        y: 300.0
        w: 140.0
        h: 90.0
        angle: 0.0
        confidence: null
        provenance: { kind: person, model_id: null, provider: null, model_name: null, query_run_id: null }
        review_state: accepted
        reviewed_at: "2026-09-17T10:45:00Z"
        created_at: "2026-09-17T10:45:00Z"
        shape: box
        points: null
        assist: null
        area_px: 12600.0
        updated_at: "2026-09-17T10:45:00Z"
