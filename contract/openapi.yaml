      type: string
      description: "only a profile is ever `computing` (its `pointcloud_profile` job runs) or `failed`"
      enum: [ready, computing, failed]
    CloudMeasurementPoint:
      type: object
      required: [x, y, z, uncertainty_m]
      properties:
        x: { type: number, description: native CRS }
        y: { type: number }
        z: { type: number }
        uncertainty_m: { type: number, minimum: 0, description: the display spacing of the deepest loaded node that contains the pick }
        group: { type: [integer, "null"], minimum: 0, maximum: 1, description: "a rings vertical check: 0 is the lower ring and 1 the upper; null or absent for every other kind" }
    CloudMeasurementParams:
      type: object
      additionalProperties: false
      description: "per kind: area `{mode}`, vertical `{method}`, profile `{thickness_m, max_points}`; `view_dir` is the camera direction at save, used only to orient `plane_azimuth_deg`. A key that does not apply is absent or null"
      properties:
        mode: { type: [string, "null"], enum: [surface, plan, null], description: "area: which area is primary; surface when absent" }
        method: { type: [string, "null"], enum: [points, rings, null], description: "vertical: two picks, or two fitted rings (6 to 64 points with `group` 0 and 1, at least 3 each); points when absent" }
        thickness_m: { type: [number, "null"], minimum: 0.01, maximum: 5, description: "profile: the slab thickness; 0.20 when absent" }
        max_points: { type: [integer, "null"], minimum: 1000, maximum: 500000, description: "profile: the stored point cap; 200 000 when absent" }
        view_dir:
          type: [array, "null"]
          items: { type: number }
          minItems: 3
          maxItems: 3
