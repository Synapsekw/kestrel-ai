        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ detect
  /api/v1/projects/{projectId}/runs:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [detect]
      operationId: listRuns
      summary: |
        Photo runs (query runs) and map runs of a detection project in one list, newest first
        (`created_at desc, id desc`). Review progress comes from grouped counts.
      parameters:
        - { name: source_id, in: query, required: false, schema: { type: string }, description: only this source's runs }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: runs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunSummaryPage" }
              example:
                items:
                  - id: "r0000000-7777-4000-8000-000000000001"
                    kind: map
                    source_id: "50000000-3333-4000-8000-000000000002"
                    source_label: "May survey"
                    model_id: "m0000000-2222-4000-8000-000000000001"
                    model_name: "machinery-v3"
                    conf: 0.25
                    job_state: succeeded
                    pinned: false
                    counts: { "c1a2b3c4-0000-4000-8000-000000000001": 42, "c1a2b3c4-0000-4000-8000-000000000004": 17 }
                    verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 30 }
                    review: { total: 59, reviewed: 34 }
                    created_at: "2026-09-22T11:00:00Z"
                  - id: "q0000000-8888-4000-8000-000000000001"
                    kind: images
                    source_id: "50000000-3333-4000-8000-000000000001"
                    source_label: "Flight 15 Apr"
                    model_id: "m0000000-2222-4000-8000-000000000001"
                    model_name: "machinery-v3"
                    conf: 0.25
                    job_state: succeeded
                    pinned: false
                    counts: { "c1a2b3c4-0000-4000-8000-000000000001": 31, "c1a2b3c4-0000-4000-8000-000000000004": 9 }
                    verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 12 }
                    review: { total: 40, reviewed: 12 }
                    created_at: "2026-09-21T15:00:00Z"
                next_cursor: null
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [detect]
      operationId: createRuns
      summary: |
        Start one run per source: a photo source gets a query run (an `infer` job), a map source a
        map run (a `map_detect` job). The model's classes must all map onto project classes (or be
        ignored); otherwise nothing is queued and the answer is `422 unmapped_classes`. The first
        run in a project with no classes seeds the class list from the model. Cloud-provider runs
        (`provider` and `query`) skip the mapping.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunCreate" }
      responses:
        "202":
          description: runs created, one job per run queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunCreated" }
              example:
                runs:
                  - run_id: "q0000000-8888-4000-8000-000000000002"
                    source_id: "50000000-3333-4000-8000-000000000001"
                    kind: images
                    job:
                      id: "j0000000-4444-4000-8000-000000000010"
                      project_id: "7f1c2e3a-1111-4000-8000-000000000001"
                      type: infer
                      state: queued
                      progress: 0
                      message: ""
                      log_path: "runs/j0000000-4444-4000-8000-000000000010/job.log"
                      params: { query_run_id: "q0000000-8888-4000-8000-000000000002" }
                      result: null
                      error: null
                      created_at: "2026-09-23T10:00:00Z"
                      started_at: null
                      finished_at: null
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "the project is not a detection project (`code` is `wrong_project_kind`, details `{kind, allowed}`), or the chosen library model's weights file is missing (`code` is `model_unavailable`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/UnmappedClasses" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    patch:
      tags: [detect]
      operationId: updateRun
      summary: Pin or unpin a run. Pinning a run unpins the other runs of its source; a pinned run represents its source in analytics and the survey timeline.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunPatch" }
      responses:
        "200":
          description: the updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/runs/{runId}/accept-above:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    post:
      tags: [detect]
      operationId: acceptRunAbove
      summary: Accept every unreviewed detection of the run at or above `min_confidence` (an `accept_above` job, in batches; the counts follow).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptAbove" }
      responses:
        "202":
          description: job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/runs/{runId}/recount:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    post:
      tags: [detect]
      operationId: recountRun
      summary: Rebuild the run's `counts`, `verified_counts` and (map runs) `area_counts` from its detections (a `recount` job).
      responses:
        "202":
          description: job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/model-class-maps/{modelId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/modelId"
    get:
      tags: [detect]
      operationId: getModelClassMap
      summary: How a library model's classes map onto this project's classes (the remembered mapping, else by name and aliases), and which are still unmapped.
      responses:
        "200":
          description: the mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelClassMapOut" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [detect]
      operationId: putModelClassMap
      summary: |
        Remember the mapping for this model. Every mapped id must be a project class. Each name
        in `new_classes` is added as a project class and mapped to itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelClassMapPut" }
      responses:
        "200":
          description: the stored mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelClassMapOut" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        "422":
          description: a mapped id is not a project class, or a name is not one of the model's classes (`code` is `validation_error`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs/{runId}/review:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    post:
      tags: [detect]
      operationId: reviewMapDetections
      summary: |
        Accept, reject, reset or reclass detections of a map run. Reclass sets the class and the
        state `edited`. The run's counts change in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapDetectionReview" }
      responses:
        "200":
          description: detections updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapDetectionReviewResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/map-runs/{runId}/next-unreviewed:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/runId"
    get:
      tags: [detect]
      operationId: nextUnreviewedMapDetection
      summary: The next unreviewed detection in reading order (`y`, then `x`) after `after_id`, and how many remain.
      parameters:
        - { name: after_id, in: query, required: false, schema: { type: string }, description: the detection the viewer is on; omitted starts from the top }
      responses:
        "200":
          description: the next detection, or null when none is left
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NextUnreviewed" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/site-areas:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [detect]
      operationId: listSiteAreas
      responses:
        "200":
          description: site areas, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteAreaList" }
              example:
                items:
                  - id: "5a000000-aaaa-4000-8000-000000000001"
                    name: "North laydown yard"
                    polygon_wgs84: [[47.7610, 29.4960], [47.7640, 29.4960], [47.7640, 29.4980], [47.7610, 29.4980]]
                    created_at: "2026-09-23T09:00:00Z"
                  - id: "5a000000-aaaa-4000-8000-000000000002"
                    name: "Batching plant"
                    polygon_wgs84: [[47.7650, 29.4930], [47.7680, 29.4930], [47.7680, 29.4950]]
                    created_at: "2026-09-23T09:05:00Z"
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [detect]
      operationId: createSiteArea
      summary: |
        Add a site area, given in WGS84 or as a polygon drawn in one map's pixels (converted with
        that map's georeference). Starts an `area_recount` job over every map run.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteAreaCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteArea" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/site-areas/{areaId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/areaId"
    patch:
      tags: [detect]
      operationId: updateSiteArea
      summary: Rename or redraw a site area. A new polygon starts an `area_recount` job.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteAreaPatch" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteArea" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [detect]
      operationId: deleteSiteArea
      summary: Delete a site area. Starts an `area_recount` job.
      responses:
        "204": { description: deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/analytics/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/sourceId"
    get:
      tags: [detect]
      operationId: getSourceAnalytics
      summary: Counts per class for one source from its chosen run (pinned, else the comparison rule for maps and the newest run for photos). Reads run rows only.
      responses:
        "200":
          description: the source's counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceAnalytics" }
              example:
                source:
                  id: "50000000-3333-4000-8000-000000000002"
                  kind: map
                  label: "May survey"
                  captured_on: "2026-05-20"
                  map_id: "a0000000-6666-4000-8000-000000000001"
                  folder: "D:\\Surveys\\may-ortho.tif"
                  site: may-ortho
                  settings: { max_side: 4000, quality: 95, dedupe_threshold: 4 }
                  image_count: 0
                  duplicate_count: 0
                  job_id: "j0000000-4444-4000-8000-000000000002"
                  imported_at: "2026-05-21T10:00:00Z"
                  created_at: "2026-05-21T09:55:00Z"
                unit: objects
                image_count: null
                run:
                  id: "r0000000-7777-4000-8000-000000000001"
                  kind: map
                  source_id: "50000000-3333-4000-8000-000000000002"
                  source_label: "May survey"
                  model_id: "m0000000-2222-4000-8000-000000000001"
                  model_name: "machinery-v3"
                  conf: 0.25
                  job_state: succeeded
                  pinned: false
                  counts: { "c1a2b3c4-0000-4000-8000-000000000001": 42, "c1a2b3c4-0000-4000-8000-000000000004": 17 }
                  verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 30 }
                  review: { total: 59, reviewed: 34 }
                  created_at: "2026-09-22T11:00:00Z"
                classes:
                  - { class_id: "c1a2b3c4-0000-4000-8000-000000000001", name: excavator, colour: "#f97316", total: 42, verified: 30 }
                  - { class_id: "c1a2b3c4-0000-4000-8000-000000000004", name: "dump truck", colour: "#0ea5e9", total: 17, verified: 0 }
                review: { total: 59, reviewed: 34 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/analytics/areas:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [detect]
      operationId: getAreaAnalytics
      summary: Counts per site area and class for every survey, in survey-timeline order and on the same comparison basis. Reads run rows only.
      parameters:
        - { name: model_id, in: query, required: false, schema: { type: string }, description: compare on this model instead of the newest run's }
        - { name: conf, in: query, required: false, schema: { type: number, minimum: 0, maximum: 1 }, description: compare at this confidence instead of the newest run's }
        - { name: verified_only, in: query, required: false, schema: { type: boolean, default: false }, description: pick surveys as the verified-only timeline does }
      responses:
        "200":
          description: per-area counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AreaAnalytics" }
              example:
                areas:
                  - { id: "5a000000-aaaa-4000-8000-000000000001", name: "North laydown yard" }
                  - { id: "5a000000-aaaa-4000-8000-000000000002", name: "Batching plant" }
                surveys:
                  - map_id: "7c9e1b2a-5555-4000-8000-000000000001"
                    map_name: "April survey"
                    captured_on: "2026-04-15"
                    state: ok
                    per_area:
                      "5a000000-aaaa-4000-8000-000000000001":
                        partial: false
                        counts: { "c1a2b3c4-0000-4000-8000-000000000001": { total: 5, verified: 5 }, "c1a2b3c4-0000-4000-8000-000000000004": { total: 2, verified: 1 } }
                      "5a000000-aaaa-4000-8000-000000000002":
                        partial: true
                        counts: { "c1a2b3c4-0000-4000-8000-000000000001": { total: 1, verified: 0 } }
                  - map_id: "7c9e1b2a-5555-4000-8000-000000000002"
                    map_name: "May survey"
                    captured_on: "2026-05-20"
                    state: ok
                    per_area:
                      "5a000000-aaaa-4000-8000-000000000001":
                        partial: false
                        counts: { "c1a2b3c4-0000-4000-8000-000000000001": { total: 7, verified: 6 }, "c1a2b3c4-0000-4000-8000-000000000004": { total: 3, verified: 3 } }
                      "5a000000-aaaa-4000-8000-000000000002":
                        partial: false
                        counts: { "c1a2b3c4-0000-4000-8000-000000000001": { total: 2, verified: 2 } }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/analytics/photo-batches:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [detect]
      operationId: getPhotoBatchAnalytics
      summary: Detections per class for every photo source. These are detections, not objects - the same object appears in several photos - and never enter a trend.
      responses:
        "200":
          description: one row per photo source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoBatchAnalytics" }
              example:
                batches:
                  - source:
                      id: "50000000-3333-4000-8000-000000000001"
                      kind: images
                      label: "Flight 15 Apr"
                      captured_on: "2019-04-15"
                      map_id: null
                      folder: "E:\\Dev\\Yolo\\Ahmadia Construction Data"
                      site: ahmadia
                      settings: { max_side: 4000, quality: 95, dedupe_threshold: 4 }
                      image_count: 3299
                      duplicate_count: 0
                      job_id: "j0000000-4444-4000-8000-000000000001"
                      imported_at: "2026-09-17T10:30:00Z"
                      created_at: "2026-09-17T10:05:00Z"
                    run:
                      id: "q0000000-8888-4000-8000-000000000001"
                      kind: images
                      source_id: "50000000-3333-4000-8000-000000000001"
                      source_label: "Flight 15 Apr"
                      model_id: "m0000000-2222-4000-8000-000000000001"
                      model_name: "machinery-v3"
                      conf: 0.25
                      job_state: succeeded
                      pinned: false
                      counts: { "c1a2b3c4-0000-4000-8000-000000000001": 31, "c1a2b3c4-0000-4000-8000-000000000004": 9 }
                      verified_counts: { "c1a2b3c4-0000-4000-8000-000000000001": 12 }
                      review: { total: 40, reviewed: 12 }
                      created_at: "2026-09-21T15:00:00Z"
                    classes:
                      - { class_id: "c1a2b3c4-0000-4000-8000-000000000001", name: excavator, colour: "#f97316", total: 31, verified: 12 }
                      - { class_id: "c1a2b3c4-0000-4000-8000-000000000004", name: "dump truck", colour: "#0ea5e9", total: 9, verified: 0 }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/detect-exports:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [detect]
      operationId: createDetectExport
      summary: |
        Write the detection numbers to `exports/` (a `detect_export` job): a CSV with one row per
        source, class and site area, or a PDF report per source (`source_id` picks one; omitted
        means every source).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DetectExportRequest" }
      responses:
        "202":
          description: job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ exports
  /api/v1/projects/{projectId}/exports:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [exports]
      operationId: createResultsExport
      summary: Write the project's detections to `exports/<timestamp>/` in the chosen formats (a `results_export` job). Accepted and edited boxes; unreviewed proposals only on request; rejected boxes never.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultsExportRequest" }
      responses:
        "202":
          description: "the export job; when it succeeds its `result` is `{folder: \"exports/<timestamp>\" (project-relative, forward slashes), files: string[], image_count: integer, box_count: integer}`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/reveal:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [exports]
      operationId: revealInExplorer
      summary: Show a file or folder of the project in Windows Explorer. The path is relative to the project folder; 409 `conflict` when it leaves the folder (a schema-valid body is never answered 422), 404 when it does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevealRequest" }
      responses:
        "204":
          description: Explorer was started
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------------- jobs
  /api/v1/projects/{projectId}/jobs:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [jobs]
      operationId: listJobs
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/JobState" }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/JobType" }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: jobs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [jobs]
      operationId: getJob
      responses:
        "200":
          description: the job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/jobId"
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Request cancellation. The state becomes `cancelled` once the worker notices; finished jobs are returned unchanged.
      responses:
        "200":
          description: the job after the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/jobs/{jobId}/log:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [jobs]
      operationId: getJobLog
      parameters:
        - name: tail
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 200 }
      responses:
        "200":
          description: last lines of the job log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobLog" }
        default: { $ref: "#/components/responses/Error" }

  # ----------------------------------------------------------------- project agent
  /api/v1/projects/{projectId}/agent:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [agent]
      operationId: getAgentConversation
      summary: The project agent conversation (last 200 items, oldest first) and the latest turn.
      responses:
        "200":
          description: conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentConversation" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [agent]
      operationId: clearAgentConversation
      summary: Delete the project agent conversation. 409 `conflict` while a turn is running or awaiting approval.
      responses:
        "204": { description: cleared }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/agent/turns:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [agent]
      operationId: startAgentTurn
      summary: |
        Send a message to the project agent. The turn runs in the background with the configured
        provider and reports progress through `agent.changed` events. 409 `agent_busy` while another
        turn in this project is running or awaiting approval; 409 `provider_key_missing` without a key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentTurnCreate" }
      responses:
        "202":
          description: turn started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTurn" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/agent/turns/{turnId}/cancel:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/turnId"
    post:
      tags: [agent]
      operationId: cancelAgentTurn
      summary: Stop the turn. Background jobs it already started keep running. A finished turn is returned unchanged.
      responses:
        "200":
          description: turn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTurn" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/agent/turns/{turnId}/approval:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/turnId"
    post:
      tags: [agent]
      operationId: decideAgentApproval
      summary: Approve or deny the action the turn is waiting on, then continue the turn. 409 `conflict` when the turn is not awaiting approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentApprovalDecision" }
      responses:
        "200":
          description: turn, running again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTurn" }
        "409": { $ref: "#/components/responses/WrongProjectKind" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: the per-launch token passed to the sidecar in `APP_TOKEN`
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: same token as a query parameter, for image URLs and the websocket

  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    sourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string }
    imageId:
      name: imageId
      in: path
      required: true
      schema: { type: string }
    boxId:
      name: boxId
      in: path
      required: true
      schema: { type: string }
    datasetId:
      name: datasetId
      in: path
      required: true
      schema: { type: string }
    modelId:
      name: modelId
      in: path
      required: true
      schema: { type: string }
    turnId:
      name: turnId
      in: path
      required: true
      schema: { type: string }
    runId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    jobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    provider:
      name: provider
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ProviderName" }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    cursor:
      name: cursor
      in: query
      description: opaque cursor from the previous page's `next_cursor`
      schema: { type: string }
    mapId:
      name: mapId
      in: path
      required: true
      schema: { type: string }
    zoneId:
      name: zoneId
      in: path
      required: true
      schema: { type: string }
    labelId:
      name: labelId
      in: path
      required: true
      schema: { type: string }
    areaId:
      name: areaId
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WrongProjectKind:
      description: "the operation does not belong to this kind of project (`code` is `wrong_project_kind`, details `{kind, allowed}`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: wrong_project_kind
              message: "This is a detection project. Datasets belong in a training project."
              details: { kind: detect, allowed: [train] }
    LibraryUnavailable:
      description: "the model library could not be opened at startup (`code` is `library_unavailable`); `GET /library/status` has the reason"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: library_unavailable
              message: "The model library could not be opened."
              details: {}

    NotFound:
      description: "the project or the named resource does not exist (`code` is `not_found`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: not_found, message: "run r0000000… not found", details: {} }
    UnmappedClasses:
      description: "the model has classes with no project class and no remembered mapping (`code` is `unmapped_classes`); nothing was queued. Map them with `PUT /model-class-maps/{modelId}` and retry. A malformed body answers `validation_error`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UnmappedClassesError" }
          example:
            error:
              code: unmapped_classes
              message: "2 of the model's classes are not mapped to project classes."
              details: { model_id: "m0000000-2222-4000-8000-000000000001", unmapped: [crane, "concrete mixer"] }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: |
                machine-readable: unauthorized, not_found, validation_error, already_exists,
                class_in_use, conflict, not_implemented, provider_error, internal_error,
                wrong_project_kind (409: the operation does not belong to this kind of project;
                details `{kind, allowed}`), library_unavailable (503: the model library could not
                be opened), model_unavailable (409: the library model's weights file is missing),
                unmapped_classes (422: the run's model has classes with no project class and no
                remembered mapping; details `{model_id, unmapped}`)
            message: { type: string }
            details:
              type: object
              additionalProperties: true
      example:
        error: { code: not_found, message: "project 7f1c… not found", details: {} }

    Health:
      type: object
      required: [status, version, pid, started_at]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        pid: { type: integer }
        started_at: { type: string, format: date-time }
        gpu:
          type: object
          nullable: true
          description: >-
            CUDA availability, probed once in a background thread after the first health request
            (absent or null until the probe finishes so health stays fast; spec 10 smoke test).
          required: [available, name]
          properties:
            available: { type: boolean }
            name: { type: string, nullable: true }
      example:
        status: ok
        version: 0.1.0
        pid: 12345
        started_at: "2026-09-17T10:00:00Z"
        gpu: { available: true, name: "NVIDIA GeForce RTX 5070 Ti" }

    ClassDefInput:
      type: object
      required: [name, colour]
      properties:
        id: { type: string, description: keep the id to rename or recolour an existing class }
        name: { type: string, minLength: 1, maxLength: 64, pattern: '\S', description: must contain a non-whitespace character }
        colour: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        hotkey:
          type: [string, "null"]
          description: single character, 1 to 9 recommended
          maxLength: 1
      example: { name: excavator, colour: "#f97316", hotkey: "1" }
    ClassDef:
      type: object
      required: [id, name, colour, hotkey, order]
      properties:
        id: { type: string }
        name: { type: string }
        colour: { type: string }
        hotkey: { type: [string, "null"] }
        order: { type: integer }
      example: { id: "c1a2b3c4-0000-4000-8000-000000000001", name: excavator, colour: "#f97316", hotkey: "1", order: 0 }

    ImportSettings:
      type: object
      description: preparation settings (spec section 5); missing fields take the project defaults
      properties:
        max_side: { type: integer, minimum: 512, maximum: 12000, default: 4000 }
        quality: { type: integer, minimum: 50, maximum: 100, default: 95 }
        dedupe_threshold: { type: integer, minimum: 0, maximum: 32, default: 4, description: max phash Hamming distance for a duplicate }
        group_regex:
          type: string
          default: "^(?P<camera>[A-Za-z0-9-]+)_(?P<flight>\\d+)_(?P<frame>\\d+)"
          description: the named group `flight` is the group key (flights span cameras); fall back to a 250 m tile, then the source site
      example: { max_side: 4000, quality: 95, dedupe_threshold: 4, group_regex: "^(?P<camera>[A-Za-z0-9-]+)_(?P<flight>\\d+)_(?P<frame>\\d+)" }

    ProjectKind:
      type: string
      enum: [train, detect]
      description: "`train` labels images, builds datasets and trains models; `detect` runs library models over sources. Set at creation, never changed."
      example: train
    Project:
      type: object
      required: [id, name, folder, kind, classes, preannotation_model_id, import_defaults, schema_version, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        folder: { type: string, description: absolute path of the project folder }
        kind: { $ref: "#/components/schemas/ProjectKind" }
        classes:
