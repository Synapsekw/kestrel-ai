      responses:
        "200":
          description: tile image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "204": { description: the tile is outside the map or entirely nodata }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/maps/{mapId}/runs:
