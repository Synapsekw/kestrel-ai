  # ------------------------------------------------------------------ point clouds (S1)
  /api/v1/projects/{projectId}/pointclouds:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [pointclouds]
      operationId: listPointClouds
      summary: Every point cloud in the project, newest first.
      responses:
        "200":
          description: point clouds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PointCloudList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [pointclouds]
      operationId: createPointCloud
      summary: |
        Import a LAS or LAZ file (a `pointcloud_import` job). The source file is only read and is
        never kept in the project. Validation and the RAM and disk admission run again here; a
        refusal creates no row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PointCloudCreate" }
      responses:
        "202":
          description: cloud created in `importing`, job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PointCloudWithJob" }
        "409":
          description: "`map_id` names a map that is not `ready` (still importing or failed; `code` is `not_ready`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "the file is not a readable LAS/LAZ (`unsupported_point_cloud`), or the import needs more memory (`insufficient_memory`) or disk (`insufficient_disk`) than is free; `message` is the text the UI shows"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/pointclouds/inspect:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [pointclouds]
      operationId: inspectPointCloudFile
      summary: Read a LAS/LAZ file's header and VLRs (at most 1 MiB) and judge admission, without importing it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PointCloudInspectRequest" }
      responses:
        "200":
          description: the header facts and the admission verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PointCloudFileInfo" }
        "422":
          description: "the file is not a readable LAS/LAZ (`unsupported_point_cloud`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/pointclouds/{cloudId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/cloudId"
    get:
      tags: [pointclouds]
      operationId: getPointCloud
      responses:
        "200":
          description: the point cloud
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PointCloudOut" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [pointclouds]
      operationId: patchPointCloud
      summary: Rename, correct the survey date, link or unlink a map, or assign an EPSG to a cloud that has no CRS.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PointCloudPatch" }
      responses:
        "200":
          description: the updated point cloud
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PointCloudOut" }
        "409":
          description: "`map_id` names a map that is not `ready` (still importing or failed; `code` is `not_ready`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "a map link needs both entities to have a CRS (`link_needs_coordinates`) and overlapping WGS84 bounds (`no_overlap`); `assign_epsg` is refused when the file has a CRS (`crs_already_set`) or names an EPSG code pyproj does not know (`invalid_epsg`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [pointclouds]
      operationId: deletePointCloud
      summary: Delete the cloud, its measurements and its folder under `pointclouds/`. The source file is untouched.
      responses:
        "204": { description: deleted }
        "409":
          description: "its import or export job is queued or running (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/pointclouds/{cloudId}/octree/{octreeFile}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/cloudId"
      - $ref: "#/components/parameters/octreeFile"
    get:
      tags: [pointclouds]
      operationId: getPointCloudOctreeFile
      summary: |
        One file of the cloud's Potree 2.0 display copy, for the 3D viewer. Exactly one byte range
        (`bytes=a-b`, `bytes=a-` or `bytes=-n`) of at most 64 MiB is answered 206; no `Range`
        answers the whole file with 200 only when it is at most 64 MiB. Multiple ranges, malformed
        syntax, a start at or past the end, a range over 64 MiB, or no `Range` on a bigger file
        answer 416 with `Content-Range: bytes */<size>`. The body streams in 1 MiB chunks.
        `Cache-Control: private, max-age=31536000, immutable`. The token goes in the `token`
        query parameter. The loader's CORS preflight (`Range` and `Content-Type` request headers)
        is answered by the CORS middleware before routing, so there is no OPTIONS operation.
        An unknown cloud answers 404 `not_found`; a `ready` cloud whose display-copy file is
        missing on disk answers 404 `octree_missing` (both through the `default` response).
      parameters:
        - name: Range
          in: header
          required: false
          description: one byte range, e.g. `bytes=0-21`
          schema: { type: string }
      responses:
        "200":
          description: the whole file (at most 64 MiB)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: object, additionalProperties: true, description: "`metadata.json`" }
        "206":
          description: the requested byte range
          headers:
            Content-Range: { schema: { type: string }, description: "bytes a-b/size" }
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: string, format: binary, description: "a range of `metadata.json`" }
        "409":
          description: "the cloud is not `ready` (`code` is `not_ready`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "416":
          description: "the range cannot be served (`code` is `range_not_satisfiable`); `Content-Range: bytes */<size>`"
          headers:
            Content-Range: { schema: { type: string }, description: "bytes */size" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/pointclouds/{cloudId}/measurements:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/cloudId"
    get:
      tags: [pointclouds]
      operationId: listCloudMeasurements
      summary: The cloud's saved measurements, oldest first (at most 1 000).
      responses:
        "200":
          description: measurements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudMeasurementList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [pointclouds]
      operationId: createCloudMeasurement
      summary: Save a measurement. The server recomputes `results` from the points; a client never sends them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudMeasurementCreate" }
      responses:
        "201":
          description: the saved measurement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudMeasurementOut" }
        "409":
          description: "the cloud is not `ready` (`code` is `not_ready`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "the wrong number of points for the kind (`wrong_point_count`), a distance, height difference or vertical check on a cloud in a geographic CRS (`needs_projected_crs`), a `vertical` check whose points are less than 0.5 m apart vertically (`vertical_span_too_small`), or the cloud already has 1 000 measurements (`measurement_limit`); a malformed body is `validation_error`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/pointclouds/{cloudId}/measurements/{cloudMeasurementId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/cloudId"
      - $ref: "#/components/parameters/cloudMeasurementId"
    patch:
      tags: [pointclouds]
      operationId: updateCloudMeasurement
      summary: Rename a measurement or change its note.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudMeasurementUpdate" }
      responses:
        "200":
          description: the updated measurement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudMeasurementOut" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [pointclouds]
      operationId: deleteCloudMeasurement
      responses:
        "204": { description: deleted }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/pointclouds/{cloudId}/exports:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/cloudId"
    post:
      tags: [pointclouds]
      operationId: createPointCloudExport
      summary: |
        Write a LAZ copy of the source file (a `pointcloud_export` job) into
        `exports/<stamp>[_n]/`, as `cloud-<slug>.laz` with `cloud-<slug>.json` and, when asked and
        any exist, `cloud-<slug>-measurements.csv`. The source must still be reachable, with its
        size and mtime unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PointCloudExportRequest" }
      responses:
        "202":
          description: job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "409":
          description: "the cloud is not `ready` (`code` is `not_ready`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ surfaces (S2 paths 1-8)
  /api/v1/projects/{projectId}/surfaces:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [surfaces]
      operationId: listSurfaces
      summary: Every surface in the project, cloud DSMs and designs.
      responses:
        "200":
          description: surfaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurfaceList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [surfaces]
      operationId: createSurface
      summary: Build a surface from a ready point cloud (a `surface_build` job).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SurfaceBuildRequest" }
      responses:
        "202":
          description: surface created in `building`, job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurfaceWithJob" }
        "409":
          description: "the point cloud is not `ready` (`code` is `not_ready`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "a cloud CRS the build cannot use, i.e. none without `assume_metres` or one in feet (`unsupported_crs`); the source file gone or changed in size (`source_missing`), build parameters that contradict each other such as a Z clip upside down (`invalid_build_request`), a grid over the cell ceiling (`grid_too_large`), or not enough free disk (`insufficient_disk`); a malformed body is `validation_error`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/surfaces/{surfaceId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/surfaceId"
    get:
      tags: [surfaces]
      operationId: getSurface
      responses:
        "200":
          description: the surface
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Surface" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [surfaces]
      operationId: patchSurface
      summary: Rename a surface.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SurfacePatch" }
      responses:
        "200":
          description: the updated surface
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Surface" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [surfaces]
      operationId: deleteSurface
      summary: Delete the surface and its folder under `surfaces/`.
      responses:
        "204": { description: deleted }
        "409":
          description: "a volume measurement uses the surface (`code` is `conflict`; the message names them), or its build job is queued or running (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/surfaces/{surfaceId}/tiles/{z}/{x}/{y}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/surfaceId"
      - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 30 } }
      - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
      - { name: y, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      tags: [surfaces]
      operationId: getSurfaceTile
      summary: |
        One 256 px hillshade tile in the surface's grid; one bounded read. NaN cells are transparent.
        A surface that is not `ready` answers 409 `not_ready` (through the `default` response).
      parameters:
        - name: tint
          in: query
          required: false
          description: "multiply by a hypsometric ramp; false when absent"
          schema: { type: boolean }
      responses:
        "200":
          description: tile image
          content:
            image/png:
              schema: { type: string, format: binary }
        "204": { description: the tile is outside the grid or all nodata }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/surfaces/{surfaceId}/ortho-tiles/{z}/{x}/{y}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/surfaceId"
      - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 30 } }
      - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
      - { name: y, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      tags: [surfaces]
      operationId: getSurfaceOrthoTile
      summary: |
        One 256 px tile of a map's display raster warped into this surface's grid, for the ortho
        underlay. A surface that is not `ready`, or a map that is not `ready`, answers 409
        `not_ready` (through the `default` response).
      parameters:
        - name: map_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: tile image; PNG when it holds nodata
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "204": { description: the map does not overlap this tile }
        "422":
          description: "the map or the surface has no CRS (`code` is `no_coordinates`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/surfaces/{surfaceId}/sample:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/surfaceId"
    get:
      tags: [surfaces]
      operationId: getSurfaceSample
      summary: |
        The surface height at one native point (bilinear over 2 x 2 cells); `z` is null over nodata.
        A surface that is not `ready` answers 409 `not_ready` (through the `default` response).
      parameters:
        - { name: x, in: query, required: true, schema: { type: number } }
        - { name: y, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: the sample
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurfaceSample" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ design surfaces (S3)
  /api/v1/projects/{projectId}/design-inspections:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [surfaces]
      operationId: createDesignInspection
      summary: Read a design file (a `design_import` job, phase `inspect`) - hash it, detect units and CRS, and list its candidate surfaces.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesignInspectionCreate" }
      responses:
        "202":
          description: inspection created in `inspecting`, job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignInspectionWithJob" }
        "422":
          description: "the file is a DWG (`code` is `validation_error`, `details.reason` is `\"dwg\"`) or an existing file has an unknown extension (`details.reason` is `\"extension\"`); a missing file is `404 not_found`, never a 422"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/design-inspections/{inspectionId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/inspectionId"
    get:
      tags: [surfaces]
      operationId: getDesignInspection
      responses:
        "200":
          description: the inspection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignInspection" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [surfaces]
      operationId: deleteDesignInspection
      summary: Cancel a running inspect or preview and delete the inspection folder.
      responses:
        "204": { description: deleted }
        "409":
          description: "a build of this inspection is queued or running (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/design-inspections/{inspectionId}/candidates/{candidateId}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/inspectionId"
      - $ref: "#/components/parameters/candidateId"
    get:
      tags: [surfaces]
      operationId: getDesignCandidateThumbnail
      summary: A 160 px plan view of one candidate.
      responses:
        "200":
          description: thumbnail
          content:
            image/png:
              schema: { type: string, format: binary }
        "204": { description: the candidate has no thumbnail }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/design-inspections/{inspectionId}/previews:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/inspectionId"
    post:
      tags: [surfaces]
      operationId: createDesignPreview
      summary: Place, triangulate and rasterise the chosen candidates onto a coarse preview grid and validate them (a `design_import` job, phase `preview`). It cancels the inspection's running preview first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesignImportOptions" }
      responses:
        "202":
          description: preview created in `running`, job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignPreviewWithJob" }
        "409":
          description: "the inspection has not been read yet or reading it failed, or the target cloud surface is building, failed or missing its grid (`code` is `not_ready`); a design surface is being imported from this inspection (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "an unknown or repeated candidate, an unparseable CRS, a LandXML or DEM selection of other than one candidate, a `target_surface_id` that is not a cloud surface (unknown, or not a `cloud_dsm`), or neither a target nor `cell_size_m` (`code` is `validation_error`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/design-inspections/{inspectionId}/previews/{previewId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/inspectionId"
      - $ref: "#/components/parameters/previewId"
    get:
      tags: [surfaces]
      operationId: getDesignPreview
      responses:
        "200":
          description: the preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignPreview" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/design-inspections/{inspectionId}/previews/{previewId}/image:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/inspectionId"
      - $ref: "#/components/parameters/previewId"
    get:
      tags: [surfaces]
      operationId: getDesignPreviewImage
      summary: The preview's plan image.
      responses:
        "200":
          description: preview image
          content:
            image/png:
              schema: { type: string, format: binary }
        "204": { description: the preview is not ready or failed }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/design-surfaces:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [surfaces]
      operationId: createDesignSurface
      summary: Build the design surface from a ready preview (a `design_import` job, phase `build`); the new `Surface` has `kind` `design`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesignSurfaceCreate" }
      responses:
        "202":
          description: surface created in `building`, job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurfaceWithJob" }
        "409":
          description: "the preview is not ready, or the target cloud surface is no longer ready (`code` is `not_ready`); the preview is not the newest, has `block` warnings, or has `warn` warnings without `accept_warnings` (`code` is `conflict`); the design is already being imported (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ volumes (S2 paths 9-17)
  /api/v1/projects/{projectId}/volumes:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [volumes]
      operationId: listVolumeMeasurements
      summary: Every volume measurement. Recomputes each fingerprint; a changed ready one becomes `stale`.
      responses:
        "200":
          description: measurements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeMeasurementList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [volumes]
      operationId: createVolumeMeasurement
      summary: Create a measurement and queue its `volume_calc` job.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeMeasurementCreate" }
      responses:
        "202":
          description: measurement created in `calculating`, job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeMeasurementWithJob" }
        "409":
          description: "the top or base surface is not `ready` (`code` is `not_ready`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "a polygon the rules refuse (`invalid_geometry`: self-crossing, too small, too large or off the surface) or a base that does not fit (`invalid_base`: a flat base without `z`, a surface base without `surface_id`, or a base surface with local coordinates under a georeferenced top or the reverse; a base in any other georeferenced CRS is accepted and reprojected); a malformed body is `validation_error`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/volumes/{measurementId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/measurementId"
    get:
      tags: [volumes]
      operationId: getVolumeMeasurement
      responses:
        "200":
          description: the measurement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeMeasurement" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [volumes]
      operationId: patchVolumeMeasurement
      summary: Change a measurement's inputs; any change other than `name` makes it `stale`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeMeasurementPatch" }
      responses:
        "200":
          description: the updated measurement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeMeasurement" }
        "409":
          description: "the measurement is calculating (`code` is `job_running`), or a surface its changed inputs name is not `ready` (`code` is `not_ready`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "changed inputs the rules refuse (`invalid_geometry`, `invalid_base`: as on create, and a new top in another CRS than the polygon); a malformed body is `validation_error`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [volumes]
      operationId: deleteVolumeMeasurement
      responses:
        "204": { description: deleted }
        "409":
          description: "the measurement is calculating (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/volumes/{measurementId}/calculate:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/measurementId"
    post:
      tags: [volumes]
      operationId: calculateVolumeMeasurement
      summary: Recalculate a measurement (a `volume_calc` job).
      responses:
        "202":
          description: job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeMeasurementWithJob" }
        "409":
          description: "the measurement is already calculating (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/volumes/{measurementId}/diff-tiles/{z}/{x}/{y}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/measurementId"
      - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 30 } }
      - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
      - { name: y, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      tags: [volumes]
      operationId: getVolumeDiffTile
      summary: One 256 px cut/fill tile in the top surface's grid (red below the base, blue above).
      parameters:
        - name: v
          in: query
          required: false
          description: "the results' `computed_at`, for cache busting"
          schema: { type: string }
      responses:
        "200":
          description: tile image
          content:
            image/png:
              schema: { type: string, format: binary }
        "204": { description: the tile is outside the measured cells }
        "409":
          description: "the measurement has no results (`code` is `not_ready`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/volumes/{measurementId}/footprints:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/measurementId"
    get:
      tags: [volumes]
      operationId: getVolumeFootprints
      summary: The buffered detection footprints the measurement masks, in the surface CRS; at most 5 000.
      responses:
        "200":
          description: footprints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeFootprints" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/volume-exports:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [volumes]
      operationId: createVolumeExport
      summary: Write PDF, GeoPackage with cut/fill GeoTIFF, CSV and/or XLSX to `exports/<stamp>/` (a `volume_export` job; its `result` is `{folder, files}`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeExportRequest" }
      responses:
        "202":
          description: job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "409":
          description: "a measurement is not `ready` - stale or failed, recalculate it first (`code` is `not_ready`); a measurement is being calculated (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ exports
  /api/v1/projects/{projectId}/exports:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [exports]
      operationId: createResultsExport
      summary: Write the project's detections to `exports/<timestamp>/` in the chosen formats (a `results_export` job). Accepted and edited boxes; unreviewed proposals only on request; rejected boxes never.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultsExportRequest" }
      responses:
        "202":
          description: "the export job; when it succeeds its `result` is `{folder: \"exports/<timestamp>\" (project-relative, forward slashes), files: string[], image_count: integer, box_count: integer}`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/reveal:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [exports]
      operationId: revealInExplorer
      summary: Show a file or folder of the project in Windows Explorer. The path is relative to the project folder; 409 `conflict` when it leaves the folder (a schema-valid body is never answered 422), 404 when it does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevealRequest" }
      responses:
        "204":
          description: Explorer was started
        default: { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------------- jobs
  /api/v1/projects/{projectId}/jobs:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [jobs]
      operationId: listJobs
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/JobState" }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/JobType" }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: jobs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [jobs]
      operationId: getJob
      responses:
        "200":
          description: the job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/jobId"
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Request cancellation. The state becomes `cancelled` once the worker notices; finished jobs are returned unchanged.
      responses:
        "200":
          description: the job after the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/jobs/{jobId}/log:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/jobId"
    get:
      tags: [jobs]
      operationId: getJobLog
      parameters:
        - name: tail
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 200 }
      responses:
        "200":
          description: last lines of the job log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobLog" }
        default: { $ref: "#/components/responses/Error" }

  # ----------------------------------------------------------------- project agent
  /api/v1/projects/{projectId}/agent:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [agent]
      operationId: getAgentConversation
      summary: The project agent conversation (last 200 items, oldest first) and the latest turn.
      responses:
        "200":
          description: conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentConversation" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [agent]
      operationId: clearAgentConversation
      summary: Delete the project agent conversation. 409 `conflict` while a turn is running or awaiting approval.
      responses:
        "204": { description: cleared }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/agent/turns:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [agent]
      operationId: startAgentTurn
      summary: |
        Send a message to the project agent. The turn runs in the background with the configured
        provider and reports progress through `agent.changed` events. 409 `agent_busy` while another
        turn in this project is running or awaiting approval; 409 `provider_key_missing` without a key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentTurnCreate" }
      responses:
        "202":
          description: turn started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTurn" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/agent/turns/{turnId}/cancel:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/turnId"
    post:
      tags: [agent]
      operationId: cancelAgentTurn
      summary: Stop the turn. Background jobs it already started keep running. A finished turn is returned unchanged.
      responses:
        "200":
          description: turn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTurn" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/agent/turns/{turnId}/approval:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/turnId"
    post:
      tags: [agent]
      operationId: decideAgentApproval
      summary: Approve or deny the action the turn is waiting on, then continue the turn. 409 `conflict` when the turn is not awaiting approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentApprovalDecision" }
      responses:
        "200":
          description: turn, running again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTurn" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ foundation: projects (F-C0)
  /api/v1/projects/migrations/retry:
    post:
      tags: [projects]
      operationId: retryProjectMigration
      summary: |
        Submit a new `project_migrate` job (a library job) for a project folder whose upgrade
        failed or never started, and answer the project's migration state. The job resumes at the
        first data step not yet recorded; the backup taken before the schema upgrade is kept and
        never overwritten.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationFolder" }
      responses:
        "202":
          description: migration job queued in the library runner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationState" }
              example: { state: running, job_id: "j0000000-4444-4000-8000-000000000040", error: null, code: null, step: null, backup_path: "E:\\Projects\\North\\backups\\project.db.v1-20260926T090000Z.bak", report_path: null }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "a migration job for the folder is already queued or running (`code` is `job_running`, details `{job_id}`), or the project is already upgraded (`code` is `conflict`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/migrations/reveal-backup:
    post:
      tags: [projects]
      operationId: revealProjectBackup
      summary: |
        Show the pre-upgrade backup of a project folder in Explorer (the Projects card's "Reveal
        backup"). Only reads `migrations.json`; the project need not open, and nothing is
        restored: the operator restores a backup by hand.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationFolder" }
      responses:
        "204":
          description: Explorer was started
        "404":
          description: "no backup is recorded for that folder, or its file is gone (`code` is `not_found`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/types:
    parameters:
      - $ref: "#/components/parameters/projectId"
    put:
      tags: [projects]
      operationId: putProjectTypes
      summary: |
        Replace the project's type list with catalogue types, in list order. `Project.classes` is
        derived from this list (`id` is the catalogue type id, `order` the position). `hotkeys`
        overrides a type's catalogue hotkey inside this project; null clears the override. Removing
        a type that still has annotations or findings fails with 409 `class_in_use`. A type id the
        catalogue does not know fails with 422 `unknown_type`: create it with `POST /catalogue/types`
        first. Replaces the deprecated `PUT /projects/{projectId}/classes`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectTypesUpdate" }
      responses:
        "200":
          description: the project with its new type list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "a removed type still has annotations or findings (`code` is `class_in_use`, details `{type_id, box_count, finding_count}`), or a hotkey is taken in the project (`code` is `hotkey_conflict`, details `{type_id}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "a type id is not in the catalogue (`code` is `unknown_type`, details `{type_ids}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/CatalogueUnavailable" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ foundation: catalogue (F-C0)
  /api/v1/catalogue/types:
    get:
      tags: [catalogue]
      operationId: listCatalogueTypes
      summary: |
        The app-wide catalogue of defect and object types, ordered by group then name. Archived
        types are left out unless `include_archived` is true. `needs_classification` is set after
        the foundation migration merged project classes in, until the operator has reviewed them.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 64 }, description: matches the normalised name or the group }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/CatalogueKind" } }
        - { name: origin, in: query, required: false, schema: { type: string, enum: [user, migrated] } }
        - { name: include_archived, in: query, required: false, schema: { type: boolean }, description: false when absent }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: catalogue types
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueTypePage" }
        "503": { $ref: "#/components/responses/CatalogueUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [catalogue]
      operationId: createCatalogueType
      summary: |
        Add a type. Names are unique among non-archived types after normalising (casefold, trim,
        `_` and `-` as spaces, runs of spaces collapsed), so "dump_truck" and "Dump truck" are the
        same type: a clash answers 409 `type_exists` with the existing id. A hotkey is a digit 1-9
        or a letter, unique among non-archived types. A missing `colour` is picked by the server; a
        missing `kind` is `object`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueTypeCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueType" }
        "409":
          description: "the name exists (`code` is `type_exists`, details `{type_id}`), or the hotkey is taken (`code` is `hotkey_conflict`, details `{type_id}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/CatalogueUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/catalogue/types/{typeId}:
    parameters:
      - $ref: "#/components/parameters/typeId"
    get:
      tags: [catalogue]
      operationId: getCatalogueType
      responses:
        "200":
          description: the type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueType" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CatalogueUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [catalogue]
      operationId: patchCatalogueType
      summary: |
        Rename, recolour, regroup, change the kind, default severity or hotkey, or archive. Types
        are never deleted: an archived type still renders everywhere but is not offered for new
        annotations or findings. The answer is the type plus `backfill_candidates`, true when the
        kind changed from `object` to `defect`, so the UI can offer `POST .../backfill`; from
        `defect` to `object` existing findings are kept and no new ones are created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueTypePatch" }
      responses:
        "200":
          description: the updated type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueTypeUpdated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "the new name exists (`code` is `type_exists`, details `{type_id}`), or the hotkey is taken (`code` is `hotkey_conflict`, details `{type_id}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/CatalogueUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/catalogue/types/{typeId}/backfill:
    parameters:
      - $ref: "#/components/parameters/typeId"
    post:
      tags: [catalogue]
      operationId: backfillCatalogueType
      summary: |
        Create findings from the accepted and person-drawn annotations of this defect type in every
        recent project, one project at a time (a `findings_backfill` library job). Each becomes a
        `reviewed` finding without a severity. Idempotent: an annotation that already has a finding
        is skipped.
      responses:
        "202":
          description: backfill job queued in the library runner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
              example:
                job:
                  id: "j0000000-4444-4000-8000-000000000041"
                  project_id: library
                  type: findings_backfill
                  state: queued
                  progress: 0
                  message: ""
                  log_path: "runs/j0000000-4444-4000-8000-000000000041/job.log"
                  params: { type_id: "c1a2b3c4-0000-4000-8000-000000000009" }
                  result: null
                  error: null
                  created_at: "2026-09-26T10:00:00Z"
                  started_at: null
                  finished_at: null
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "a backfill of this type is already queued or running (`code` is `job_running`, details `{job_id}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "the type is not a defect type (`code` is `not_a_defect`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "the catalogue (`code` is `catalogue_unavailable`) or the model library (`code` is `library_unavailable`) could not be opened"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/catalogue/severity:
    get:
      tags: [catalogue]
      operationId: getSeverityScale
      summary: The app-wide severity scale, level 1 first. A fresh catalogue holds 1 Minor, 2 Moderate, 3 Major, 4 Critical.
      responses:
        "200":
          description: the scale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeverityScale" }
        "503": { $ref: "#/components/responses/CatalogueUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [catalogue]
      operationId: putSeverityScale
      summary: |
        Replace the scale. Levels must be exactly 1..n (422 `invalid_scale`). Names and colours may
        change freely and levels may be appended. Removing levels takes them from the top only, and
        only when no open project's findings use them (409 `severity_in_use`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeverityScale" }
      responses:
        "200":
          description: the new scale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeverityScale" }
        "409":
          description: "a level to remove is still used (`code` is `severity_in_use`, details `{level, projects}`, the names of the open projects that use it)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "the levels are not 1..n (`code` is `invalid_scale`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/CatalogueUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/catalogue/classification/done:
    post:
      tags: [catalogue]
      operationId: completeCatalogueClassification
      summary: The operator has reviewed the types the migration merged in; clears `needs_classification` (the Catalogue banner's "Done").
      responses:
        "204":
          description: cleared
        "503": { $ref: "#/components/responses/CatalogueUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/settings/operator:
    get:
      tags: [findings]
      operationId: getOperatorSettings
      summary: The operator's name, shown as the author of new finding comments (Settings, "Your name"). `operator_name` is null until it is set; comments then say "Operator".
      responses:
        "200":
          description: the operator settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [findings]
      operationId: putOperatorSettings
      summary: |
        Set the operator's name. It is trimmed; an empty or null name clears it. Stored as
        `operator_name` in the app-data `settings.json` (never a key); existing comments keep
        their author.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorSettings" }
      responses:
        "200":
          description: the stored operator settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorSettings" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ foundation: findings (F-C0)
  /api/v1/projects/{projectId}/findings:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [findings]
      operationId: listFindings
      summary: |
        The project's findings, keyset-paged over indexed filters. Repeat a list parameter to
        match any of its values (`status=open&status=reviewed`). The default sort is `-severity`:
        highest level first, findings without a severity last, then `-number`.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: array, items: { $ref: "#/components/schemas/FindingStatus" } }
        - name: severity
          in: query
          required: false
          description: a level, or `none` for findings without a severity
          schema: { type: array, items: { type: string, pattern: "^([1-9]|none)$" } }
        - name: type_id
          in: query
          required: false
          schema: { type: array, items: { type: string } }
        - name: anchor_kind
          in: query
          required: false
          schema: { type: array, items: { $ref: "#/components/schemas/FindingAnchorKind" } }
        - { name: data_id, in: query, required: false, schema: { type: string }, description: "the anchor's data item (an images source, a map, an elevation or a point cloud)" }
        - { name: image_id, in: query, required: false, schema: { type: string }, description: "image anchors on this image (image inspection spec §3, an agreed addition to this group)" }
        - { name: created_by, in: query, required: false, schema: { type: string, enum: [human, model] } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 }, description: "matches the note, the type name, or a number written as `F-0123`" }
        - { name: updated_from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: updated_to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: has_location, in: query, required: false, schema: { type: boolean }, description: only findings with (true) or without (false) `lon`/`lat` }
        - { name: sort, in: query, required: false, schema: { type: string, enum: ["-severity", number, "-updated_at", type] }, description: "`-severity` when absent" }
        - $ref: "#/components/parameters/findingsLimit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: findings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [findings]
      operationId: createFinding
      summary: |
        Create a finding. An `image` anchor names an existing annotation (`annotation_id`) or
        carries `box` geometry, which creates the annotation in the same transaction. A map anchor
        should carry `lon`/`lat` (the anchor's WGS84 centroid). `severity` defaults to the type's
        `default_severity`, `status` to `open`. A type of kind `object` answers 422 `not_a_defect`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "the annotation already has a finding (`code` is `conflict`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "the type is an object type (`code` is `not_a_defect`), the type is not in the catalogue (`code` is `unknown_type`), or the level is not on the scale (`code` is `severity_unknown`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/findings/summary:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [findings]
      operationId: getFindingSummary
      summary: Counts for the dashboard, read only from the pre-aggregated `finding_count` and `finding_daily` tables, never from `finding` itself.
      responses:
        "200":
          description: the summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/findings/bulk:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [findings]
      operationId: bulkUpdateFindings
      summary: Set the status, severity or type of up to 1000 findings in one transaction. A finding the change does not apply to (an invalid transition, an object type) is skipped with its code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingBulkUpdate" }
      responses:
        "200":
          description: what changed and what was skipped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingBulkResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/findings/recount:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [findings]
      operationId: recountFindings
      summary: Rebuild `finding_count` and `finding_daily` from the findings (a `findings_recount` job in this project); the repair tool for the dashboard counts.
      responses:
        "202":
          description: recount job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
              example:
                job:
                  id: "j0000000-4444-4000-8000-000000000042"
                  project_id: "7f1c2e3a-1111-4000-8000-000000000001"
                  type: findings_recount
                  state: queued
                  progress: 0
                  message: ""
                  log_path: "runs/j0000000-4444-4000-8000-000000000042/job.log"
                  params: {}
                  result: null
                  error: null
                  created_at: "2026-09-26T11:00:00Z"
                  started_at: null
                  finished_at: null
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "a recount is already queued or running (`code` is `job_running`, details `{job_id}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/findings/{findingId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/findingId"
    get:
      tags: [findings]
      operationId: getFinding
      responses:
        "200":
          description: the finding with its attachment and comment counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [findings]
      operationId: patchFinding
      summary: |
        Change the type, severity, status or note, or move a map anchor (`anchor.geometry`) or a
        cloud anchor (`anchor.x`, `y`, `z`, `uncertainty_m`). Status changes follow foundation
        §8.2: closed to reviewed is refused with 409 `invalid_transition` (reopen first). Severity
        is never required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingPatch" }
      responses:
        "200":
          description: the updated finding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "the status change is not allowed (`code` is `invalid_transition`, details `{from, to}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "the new type is an object type (`code` is `not_a_defect`), the level is not on the scale (`code` is `severity_unknown`), or `anchor` does not fit the finding's anchor kind; an image anchor moves with its annotation (`code` is `validation_error`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [findings]
      operationId: deleteFinding
      summary: Delete the finding with its comments and attachments; an image finding's annotation goes too (an annotation on a defect type is the finding's geometry). Attachment files move to `findings/_trash/` and are purged after 30 days.
      responses:
        "204":
          description: deleted
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/findings/{findingId}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/findingId"
    get:
      tags: [findings]
      operationId: getFindingThumbnail
      summary: A 160 x 120 JPEG. Image findings get a crop around the annotation (cached); other findings the first attachment's thumbnail; else 404.
      responses:
        "200":
          description: the thumbnail
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/findings/{findingId}/comments:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/findingId"
    get:
      tags: [findings]
      operationId: listFindingComments
      summary: The comment thread, oldest first.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingCommentPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [findings]
      operationId: createFindingComment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingCommentCreate" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingComment" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/findings/{findingId}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/findingId"
      - $ref: "#/components/parameters/commentId"
    patch:
      tags: [findings]
      operationId: patchFindingComment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingCommentUpdate" }
      responses:
        "200":
          description: the edited comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingComment" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [findings]
      operationId: deleteFindingComment
      responses:
        "204":
          description: deleted
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/findings/{findingId}/attachments:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/findingId"
    get:
      tags: [findings]
      operationId: listFindingAttachments
      summary: The finding's photos, oldest first; a finding holds a handful, so this list is not paged.
      responses:
        "200":
          description: attachments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingAttachmentList" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [findings]
      operationId: addFindingAttachment
      summary: |
        Attach a local photo chosen in the Tauri file dialog. The server checks it with Pillow
        (JPEG, PNG or WebP, at most 50 MB), copies it into `findings/<findingId>/` and writes a
        256 px thumbnail. The source file is only read. This one copy is synchronous: it is capped
        and validated first, and takes well under a second.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingAttachmentCreate" }
      responses:
        "201":
          description: attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingAttachment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "not a JPEG, PNG or WebP, over 50 MB, or unreadable (`code` is `attachment_invalid`, details `{reason}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/findings/{findingId}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/findingId"
      - $ref: "#/components/parameters/attachmentId"
    delete:
      tags: [findings]
      operationId: deleteFindingAttachment
      responses:
        "204":
          description: deleted
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/findings/{findingId}/attachments/{attachmentId}/file:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/findingId"
      - $ref: "#/components/parameters/attachmentId"
    get:
      tags: [findings]
      operationId: getFindingAttachmentFile
      summary: The original photo, for the lightbox only.
      responses:
        "200":
          description: the file
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/findings/{findingId}/attachments/{attachmentId}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/findingId"
      - $ref: "#/components/parameters/attachmentId"
    get:
      tags: [findings]
      operationId: getFindingAttachmentThumbnail
      summary: The 256 px JPEG thumbnail written at upload; lists and grids use it, never the original.
      responses:
        "200":
          description: the thumbnail
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ foundation: app jobs (F-C0)
  /api/v1/jobs:
    get:
      tags: [jobs]
      operationId: listAppJobs
      summary: |
        Every job in the app, newest first (`created_at desc, id desc`): the library runner's jobs
        and the jobs of every recent project that is open (only an open project can have a live
        job). A keyset merge that asks each source for `limit + 1` rows. Cancel and log use the
        per-project routes, or `/library/jobs/...` when `project_id` is `library`.
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: array, items: { $ref: "#/components/schemas/JobState" } }
        - name: type
          in: query
          required: false
          schema: { type: array, items: { $ref: "#/components/schemas/JobType" } }
        - { name: project_id, in: query, required: false, schema: { type: string }, description: "one project's jobs, or `library`" }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: jobs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppJobPage" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ foundation: data, overview, search, activity (F-C0)
  /api/v1/projects/{projectId}/data:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [data]
      operationId: listDataItems
      summary: |
        Everything imported into the project in one list: image sets, maps, elevations, drawings and
        point clouds, newest capture first (`captured_on desc nulls last, created_at desc, id`). A
        view over each type's own table: a page asks each provider for `limit + 1` rows after the
        cursor and merges them. Each type keeps its own endpoints for everything else.
      parameters:
        - name: type
          in: query
          required: false
          schema: { type: array, items: { $ref: "#/components/schemas/DataItemType" } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: data items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataItemPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/overview:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [data]
      operationId: getProjectOverview
      summary: The Overview dashboard in one read. It reads only pre-aggregated rows and small-table counts, a fixed number of statements whatever the project's size; it never scans findings, boxes or images.
      responses:
        "200":
          description: the overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectOverview" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/search:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [data]
      operationId: searchProject
      summary: "The command palette's project search: findings by number (`F-0123` or `123`), note or type name, and data items by label; at most `limit` of each. It never scans images."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 8 }, description: per group }
      responses:
        "200":
          description: the matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSearchResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/activity:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [data]
      operationId: listActivity
      summary: The project's activity feed, newest first; `subject_id` narrows it to one finding or data item (the inspector's history).
      parameters:
        - { name: subject_id, in: query, required: false, schema: { type: string } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: activity, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------ foundation: models (F-C0)
  /api/v1/library/models/{modelId}/class-map:
    parameters:
      - $ref: "#/components/parameters/modelId"
    put:
      tags: [library]
      operationId: putLibraryModelClassMap
      summary: |
        Merge `mapping` into the model's app-wide class map: model class name to catalogue type id,
        or null to ignore that class; names not sent keep their entry. Run creation resolves a model
        class by exact normalised name against the catalogue first, then the model's
        `class_aliases`, then this map; leftovers still answer `422 unmapped_classes` before any job
        is queued.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryModelClassMapPut" }
      responses:
        "200":
          description: the updated library model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryModel" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "a type id is not in the catalogue (`code` is `unknown_type`, details `{type_ids}`), or a key is not one of the model's class names (`code` is `validation_error`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "the model library (`code` is `library_unavailable`) or the catalogue (`code` is `catalogue_unavailable`) could not be opened"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/datasets:
    get:
      tags: [library]
      operationId: listLibraryDatasets
      summary: Training datasets built across projects (and the legacy per-project datasets the migration registered), newest first.
      parameters:
        - { name: task, in: query, required: false, schema: { $ref: "#/components/schemas/ModelTask" } }
        - { name: origin, in: query, required: false, schema: { type: string, enum: [built, legacy] } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: datasets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryDatasetPage" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [library]
      operationId: createLibraryDataset
      summary: |
        Create a dataset from a filter over projects and a `dataset_build` library job that pages
        each project's matching images 500 at a time, freezes the items and their labels, and
        assigns splits (a flight never straddles train and val). No image is copied until an export
        is built.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryDatasetCreate" }
      responses:
        "202":
          description: dataset created in `resolving`, build job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryDatasetWithJob" }
        "409":
          description: "a dataset with that name exists (`code` is `already_exists`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/datasets/preview:
    post:
      tags: [library]
      operationId: previewLibraryDataset
      summary: |
        What a filter would hold, from COUNT queries only (images with ground truth, boxes per type)
        with a 2-second timeout per project; a project that timed out or could not be opened is
        flagged, never fatal. The builder calls it as the filter changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetFilter" }
      responses:
        "200":
          description: the counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetPreview" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/datasets/{datasetId}:
    parameters:
      - $ref: "#/components/parameters/datasetId"
    get:
      tags: [library]
      operationId: getLibraryDataset
      responses:
        "200":
          description: the dataset with its sources and counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryDataset" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [library]
      operationId: deleteLibraryDataset
      summary: Delete the dataset row and its export folder. Project images are never touched; models trained on it are kept.
      responses:
        "204":
          description: deleted
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "its build or export job, or a training run that uses it, is queued or running (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/datasets/{datasetId}/export:
    parameters:
      - $ref: "#/components/parameters/datasetId"
    post:
      tags: [library]
      operationId: exportLibraryDataset
      summary: |
        Build the YOLO export (`images/`, `labels/`, `data.yaml`) under `library\datasets\<slug>-<id8>\`
        through a `dataset` library job, hard-linking images on the same volume and copying
        otherwise. `detect` writes axis-aligned labels, `obb` rotated ones; `segment` answers 422
        `task_not_supported` until image inspection adds YOLO-seg. A missing source project fails
        the job with the list of missing projects.
      responses:
        "202":
          description: export job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "the dataset is not `ready` (`code` is `not_ready`), or its export is already building (`code` is `job_running`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "a `segment` dataset (`code` is `task_not_supported`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/datasets/{datasetId}/items:
    parameters:
      - $ref: "#/components/parameters/datasetId"
    get:
      tags: [library]
      operationId: listLibraryDatasetItems
      summary: The dataset's frozen items, for the detail screen's sample grid; thumbnails come from each project's own image thumbnail route.
      parameters:
        - { name: split, in: query, required: false, schema: { type: string, enum: [train, val] } }
        - { name: project_id, in: query, required: false, schema: { type: string } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryDatasetItemPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/training-runs:
    get:
      tags: [library]
      operationId: listTrainingRuns
      summary: Training runs, newest first.
      parameters:
        - { name: dataset_id, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/JobState" } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: training runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingRunPage" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [library]
      operationId: startTrainingRun
      summary: |
        Start a `train` library job on a library dataset. It builds the export first when the
        dataset's `export_state` is not `ready`, as a step of the same job. The run folder is
        `library\runs\<job_id>`. When it succeeds the model is registered in the library
        (`origin: trained`, the dataset's `task`, a `class_map` pre-filled from the dataset's
        classes) and `model_id` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainRequest" }
      responses:
        "202":
          description: run created, training job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingRunWithJob" }
        "404":
          description: the dataset or the base library model does not exist (`code` is `not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "the base model's weights file is missing (`code` is `model_unavailable`), or the dataset is not `ready` (`code` is `not_ready`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "a `segment` dataset (`code` is `task_not_supported`), or a base model whose task differs from the dataset's (`code` is `task_mismatch`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/library/training-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      tags: [library]
      operationId: getTrainingRun
      summary: The run with its metrics; its curves and artefacts come from the registered model (`/library/models/{modelId}/artifacts/...`).
      responses:
        "200":
          description: the run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingRun" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/LibraryUnavailable" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: the per-launch token passed to the sidecar in `APP_TOKEN`
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: same token as a query parameter, for image URLs and the websocket

  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    sourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string }
    imageId:
      name: imageId
      in: path
      required: true
      schema: { type: string }
    boxId:
      name: boxId
      in: path
      required: true
      schema: { type: string }
    datasetId:
      name: datasetId
      in: path
      required: true
      schema: { type: string }
    modelId:
      name: modelId
      in: path
      required: true
      schema: { type: string }
    turnId:
      name: turnId
      in: path
      required: true
      schema: { type: string }
    runId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    jobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    provider:
      name: provider
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ProviderName" }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    cursor:
      name: cursor
      in: query
      description: opaque cursor from the previous page's `next_cursor`
      schema: { type: string }
    mapId:
      name: mapId
      in: path
      required: true
      schema: { type: string }
    zoneId:
      name: zoneId
      in: path
      required: true
      schema: { type: string }
    labelId:
      name: labelId
      in: path
      required: true
      schema: { type: string }
    areaId:
      name: areaId
      in: path
      required: true
      schema: { type: string }
    cloudId:
      name: cloudId
      in: path
      required: true
      schema: { type: string }
    cloudMeasurementId:
      name: cloudMeasurementId
      in: path
      required: true
      description: a point-cloud measurement; `measurementId` is a volume measurement
      schema: { type: string }
    octreeFile:
      name: octreeFile
      in: path
      required: true
      schema: { type: string, enum: [metadata.json, hierarchy.bin, octree.bin] }
    surfaceId:
      name: surfaceId
      in: path
      required: true
      schema: { type: string }
    measurementId:
      name: measurementId
      in: path
      required: true
      description: a volume measurement
      schema: { type: string }
    inspectionId:
      name: inspectionId
      in: path
      required: true
      schema: { type: string }
    previewId:
      name: previewId
      in: path
      required: true
      schema: { type: string }
    candidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string, pattern: "^c[0-9]{1,6}$" }
    typeId:
      name: typeId
      in: path
      required: true
      description: a catalogue type id
      schema: { type: string }
    findingId:
      name: findingId
      in: path
      required: true
      schema: { type: string }
    commentId:
      name: commentId
      in: path
      required: true
      schema: { type: string }
    attachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string }
    findingsLimit:
      name: limit
      in: query
      description: findings pages hold at most 500
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }

  responses:
    Error:
      description: error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LibraryUnavailable:
      description: "the model library could not be opened at startup (`code` is `library_unavailable`); `GET /library/status` has the reason"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: library_unavailable
              message: "The model library could not be opened."
              details: {}

    NotFound:
      description: "the project or the named resource does not exist (`code` is `not_found`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: not_found, message: "run r0000000… not found", details: {} }
    UnmappedClasses:
      description: "the model has classes with no project class and no remembered mapping (`code` is `unmapped_classes`); nothing was queued. Map them with `PUT /model-class-maps/{modelId}` and retry. A malformed body answers `validation_error`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UnmappedClassesError" }
          example:
            error:
              code: unmapped_classes
              message: "2 of the model's classes are not mapped to project classes."
              details: { model_id: "m0000000-2222-4000-8000-000000000001", unmapped: [crane, "concrete mixer"] }
    CatalogueUnavailable:
      description: "the catalogue could not be opened at startup (`code` is `catalogue_unavailable`); projects still render from their type snapshots"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: catalogue_unavailable
              message: "The catalogue could not be opened."
              details: {}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: |
                machine-readable: unauthorized, not_found, validation_error, already_exists,
                class_in_use, conflict, not_implemented, provider_error, internal_error,
                library_unavailable (503: the model library could not
                be opened), model_unavailable (409: the library model's weights file is missing),
                unmapped_classes (422: the run's model has classes with no project class and no
                remembered mapping; details `{model_id, unmapped}`), unsupported_point_cloud,
                insufficient_memory and insufficient_disk (422: a point cloud cannot be read or
                admitted), link_needs_coordinates, no_overlap and crs_already_set (422: a point
                cloud patch), invalid_epsg (422: an EPSG code pyproj does not know),
                wrong_point_count, needs_projected_crs, vertical_span_too_small and
                measurement_limit (422: a point-cloud measurement), octree_missing (404: a ready
                cloud's display-copy file is missing on disk), grid_too_large (422: a surface
                grid over the cell ceiling), unsupported_crs, source_missing and
                invalid_build_request (422: a surface build), no_coordinates (422: an ortho
                underlay without a CRS), invalid_geometry and invalid_base (422: a volume
                measurement's polygon or base), job_running (409: the resource's job is queued
                or running), not_ready (409: the resource has not finished importing),
                range_not_satisfiable (416), project_upgrading (409: the project's foundation
                upgrade is queued or running, or waits for the library or the catalogue; details
                `{job_id}`, null while waiting), project_upgrade_failed (409: the upgrade failed and
                the project stays closed; details `{error, backup_path}`), catalogue_unavailable
                (503: the catalogue could not be opened), unknown_type (422: a type id the
                catalogue does not know; details `{type_ids}`), type_exists (409: a catalogue type
                with that normalised name exists; details `{type_id}`), hotkey_conflict (409: the
                hotkey is taken; details `{type_id}` of the type holding it), severity_in_use (409:
                a severity level to remove is still used; details `{level, projects}` with project
                names), severity_unknown (422: a severity level not on the scale), invalid_scale
                (422: severity levels are not 1..n), not_a_defect (422: findings take defect types
                only; details `{type_id}`), invalid_transition (409: a finding status change that
                is not allowed), finding_would_be_deleted (409: reclassing the box to an object
                type deletes its finding; retry with `confirm_finding_delete=true`),
                attachment_invalid (422: not a JPEG, PNG or WebP, or over 50 MB; details
                `{reason}`), task_not_supported (422: a segment dataset cannot be exported yet),
                task_mismatch (422: the base model's task differs from the dataset's),
                class_in_use (409: also counts findings; details `{type_id, box_count,
                finding_count}`)
            message: { type: string }
            details:
              type: object
              additionalProperties: true
      example:
        error: { code: not_found, message: "project 7f1c… not found", details: {} }

    Health:
      type: object
      required: [status, version, pid, started_at]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        pid: { type: integer }
        started_at: { type: string, format: date-time }
        gpu:
          type: object
          nullable: true
          description: >-
            CUDA availability, probed once in a background thread after the first health request
            (absent or null until the probe finishes so health stays fast; spec 10 smoke test).
          required: [available, name]
          properties:
            available: { type: boolean }
            name: { type: string, nullable: true }
      example:
        status: ok
        version: 0.1.0
        pid: 12345
        started_at: "2026-09-17T10:00:00Z"
        gpu: { available: true, name: "NVIDIA GeForce RTX 5070 Ti" }

    ClassDefInput:
      type: object
      required: [name, colour]
      properties:
        id: { type: string, description: keep the id to rename or recolour an existing class }
        name: { type: string, minLength: 1, maxLength: 64, pattern: '\S', description: must contain a non-whitespace character }
        colour: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        hotkey:
          type: [string, "null"]
          description: single character, 1 to 9 recommended
          maxLength: 1
      example: { name: excavator, colour: "#f97316", hotkey: "1" }
    ClassDef:
      type: object
      description: >-
        One entry of the project's type list, read from the project's snapshot of a catalogue type
        (foundation F2), so a project renders even when the catalogue cannot open. `id` is the
        catalogue type id, `order` the list position, and `hotkey` the project's override or else
        the catalogue hotkey.
      required: [id, name, colour, hotkey, order, kind, default_severity, group]
      properties:
        id: { type: string, description: the catalogue type id }
        name: { type: string }
        colour: { type: string }
        hotkey: { type: [string, "null"] }
        order: { type: integer }
        kind: { $ref: "#/components/schemas/CatalogueKind" }
        default_severity: { type: [integer, "null"], minimum: 1, maximum: 9 }
        group: { type: [string, "null"], description: "e.g. `Concrete defects`, shown as Catalogue › group" }
      example: { id: "c1a2b3c4-0000-4000-8000-000000000001", name: excavator, colour: "#f97316", hotkey: "1", order: 0, kind: object, default_severity: null, group: Machinery }

    ImportSettings:
      type: object
      description: preparation settings (spec section 5); missing fields take the project defaults
      properties:
        max_side: { type: integer, minimum: 512, maximum: 12000, default: 4000 }
        quality: { type: integer, minimum: 50, maximum: 100, default: 95 }
        dedupe_threshold: { type: integer, minimum: 0, maximum: 32, default: 4, description: max phash Hamming distance for a duplicate }
        group_regex:
          type: string
          default: "^(?P<camera>[A-Za-z0-9-]+)_(?P<flight>\\d+)_(?P<frame>\\d+)"
          description: the named group `flight` is the group key (flights span cameras); fall back to a 250 m tile, then the source site
      example: { max_side: 4000, quality: 95, dedupe_threshold: 4, group_regex: "^(?P<camera>[A-Za-z0-9-]+)_(?P<flight>\\d+)_(?P<frame>\\d+)" }

    Project:
      type: object
      description: >-
        A project has no kind (foundation F5): every project may hold every data type and run every
        action. A project whose `migration.state` is not `ok` is still listed, but does not open
        (its project routes answer 409 `project_upgrading` or `project_upgrade_failed`); it is then
        built from its recent-list entry: `classes: []`, `schema_version: 0`, `summary: null`, and
        `created_at` equal to `last_opened_at`. A recent project whose folder or `project.db` is gone
        is listed too, with `availability: missing` (built the same way from its recent entry); it
        can only be removed from the list (`forgetProject`) or located again (`openProject` on its
        new folder, which replaces the stale recent entry of the same project id).
      required: [id, name, folder, classes, preannotation_model_id, import_defaults, schema_version, created_at, last_opened_at, summary, migration, availability]
      properties:
        id: { type: string }
        name: { type: string }
        folder: { type: string, description: absolute path of the project folder }
        classes:
          type: array
          description: the project's type list (`PUT /projects/{projectId}/types`), in list order
          items: { $ref: "#/components/schemas/ClassDef" }
        preannotation_model_id: { type: [string, "null"], description: a library model id }
        import_defaults: { $ref: "#/components/schemas/ImportSettings" }
        schema_version: { type: integer, description: "2 once the foundation migration has run" }
        created_at: { type: string, format: date-time }
        last_opened_at: { type: [string, "null"], format: date-time, description: "from the recent list; null when never opened here" }
        summary:
          oneOf:
            - $ref: "#/components/schemas/ProjectSummary"
            - type: "null"
          description: null while the project cannot be opened
        migration: { $ref: "#/components/schemas/MigrationState" }
        availability: { $ref: "#/components/schemas/ProjectAvailability" }
      example:
        id: "7f1c2e3a-1111-4000-8000-000000000001"
        name: Ahmadia
        folder: "E:\\Projects\\Ahmadia"
        classes:
          - { id: "c1a2b3c4-0000-4000-8000-000000000001", name: excavator, colour: "#f97316", hotkey: "1", order: 0, kind: object, default_severity: null, group: Machinery }
          - { id: "c1a2b3c4-0000-4000-8000-000000000002", name: wheel_loader, colour: "#eab308", hotkey: "2", order: 1, kind: object, default_severity: null, group: Machinery }
          - { id: "c1a2b3c4-0000-4000-8000-000000000003", name: bulldozer, colour: "#22c55e", hotkey: "3", order: 2, kind: object, default_severity: null, group: Machinery }
          - { id: "c1a2b3c4-0000-4000-8000-000000000004", name: dump_truck, colour: "#06b6d4", hotkey: "4", order: 3, kind: object, default_severity: null, group: Machinery }
          - { id: "c1a2b3c4-0000-4000-8000-000000000005", name: crane, colour: "#3b82f6", hotkey: "5", order: 4, kind: object, default_severity: null, group: Machinery }
          - { id: "c1a2b3c4-0000-4000-8000-000000000006", name: concrete_mixer, colour: "#a855f7", hotkey: "6", order: 5, kind: object, default_severity: null, group: Machinery }
          - { id: "c1a2b3c4-0000-4000-8000-000000000007", name: roller, colour: "#ec4899", hotkey: "7", order: 6, kind: object, default_severity: null, group: Machinery }
          - { id: "c1a2b3c4-0000-4000-8000-000000000008", name: backhoe, colour: "#ef4444", hotkey: "8", order: 7, kind: object, default_severity: null, group: Machinery }
        preannotation_model_id: "m0000000-2222-4000-8000-000000000001"
        import_defaults: { max_side: 4000, quality: 95, dedupe_threshold: 4, group_regex: "^(?P<camera>[A-Za-z0-9-]+)_(?P<flight>\\d+)_(?P<frame>\\d+)" }
        schema_version: 2
        created_at: "2026-09-17T10:00:00Z"
        last_opened_at: "2026-09-26T08:00:00Z"
        summary:
          image_count: 3299
          maps: 2
          point_clouds: 1
          elevations: 1
          open_findings: 47
          open_top_severity: 3
          cover: { kind: map, id: "a0000000-6666-4000-8000-000000000001" }
        migration: { state: ok, job_id: null, error: null, code: null, step: null, backup_path: "E:\\Projects\\Ahmadia\\backups\\project.db.v1-20260926T090000Z.bak", report_path: "E:\\Projects\\Ahmadia\\backups\\migration-v2.json" }
        availability: ok
    ProjectAvailability:
      type: string
      enum: [ok, missing]
      description: "`missing` when the recent project's folder or `project.db` no longer exists (the card reads \"Folder not found\")"
    ProjectCreate:
      type: object
      required: [name, folder]
      properties:
        name: { type: string, minLength: 1 }
        folder: { type: string, description: "absolute path; created when missing, must not already hold a project" }
        type_ids:
          type: array
          uniqueItems: true
          description: catalogue type ids to start with, in list order; empty when absent
          items: { type: string }
      example:
        name: Ahmadia
        folder: "E:\\Projects\\Ahmadia"
        type_ids: ["c1a2b3c4-0000-4000-8000-000000000001", "c1a2b3c4-0000-4000-8000-000000000009"]
    ProjectOpen:
      type: object
      required: [folder]
      properties:
        folder: { type: string }
      example: { folder: "E:\\Projects\\Ahmadia" }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        preannotation_model_id: { type: [string, "null"], description: a library model id }
        import_defaults: { $ref: "#/components/schemas/ImportSettings" }
      example: { name: Ahmadia, preannotation_model_id: "m0000000-2222-4000-8000-000000000001" }
    ProjectPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        next_cursor: { type: [string, "null"] }

    Stats:
      type: object
      description: dataset statistics for a project or one source (spec section 5)
      required: [image_count, labeled_count, unlabeled_count, box_count, pending_review_count, duplicate_count, boxes_per_class, sources, groups, resolution_histogram, capture_time_range, gps_bounds]
      properties:
        image_count: { type: integer }
        labeled_count: { type: integer, description: images with at least one accepted or edited box }
        unlabeled_count: { type: integer }
        box_count: { type: integer, description: accepted and edited boxes }
        pending_review_count: { type: integer, description: unreviewed proposals }
        duplicate_count: { type: integer, description: files skipped as near-duplicates at import }
        boxes_per_class:
          type: array
          items:
            type: object
            required: [class_id, class_name, count]
            properties:
              class_id: { type: string }
              class_name: { type: string }
              count: { type: integer }
        sources:
          type: array
          items:
            type: object
            required: [source_id, site, image_count]
            properties:
              source_id: { type: string }
              site: { type: string }
              image_count: { type: integer }
        groups:
          type: array
          items:
            type: object
            required: [group_key, image_count]
            properties:
              group_key: { type: string }
              image_count: { type: integer }
        resolution_histogram:
          type: array
          items:
            type: object
            required: [width, height, count]
            properties:
              width: { type: integer }
              height: { type: integer }
              count: { type: integer }
        capture_time_range:
          type: [object, "null"]
          required: [min, max]
          properties:
            min: { type: string, format: date-time }
            max: { type: string, format: date-time }
        gps_bounds:
          type: [object, "null"]
          required: [min_lat, min_lon, max_lat, max_lon]
          properties:
            min_lat: { type: number }
            min_lon: { type: number }
            max_lat: { type: number }
            max_lon: { type: number }
      example:
        image_count: 3299
        labeled_count: 30
        unlabeled_count: 3269
        box_count: 112
        pending_review_count: 41
        duplicate_count: 0
        boxes_per_class:
          - { class_id: "c1a2b3c4-0000-4000-8000-000000000001", class_name: excavator, count: 40 }
          - { class_id: "c1a2b3c4-0000-4000-8000-000000000004", class_name: dump_truck, count: 72 }
        sources:
          - { source_id: "50000000-3333-4000-8000-000000000001", site: ahmadia, image_count: 3299 }
        groups:
          - { group_key: "0031", image_count: 697 }
          - { group_key: "0033", image_count: 622 }
        resolution_histogram:
          - { width: 4000, height: 2667, count: 3299 }
        capture_time_range: { min: "2019-04-15T06:35:36Z", max: "2019-04-15T09:12:01Z" }
        gps_bounds: { min_lat: 29.4901, min_lon: 47.7602, max_lat: 29.4988, max_lon: 47.7701 }

    Source:
      type: object
      required: [id, kind, label, captured_on, map_id, folder, site, settings, image_count, duplicate_count, job_id, imported_at, created_at]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/SourceKind" }
        label: { type: [string, "null"], description: "the operator's name for the source, e.g. Flight 14 Sep; a map source starts with the map's name" }
        captured_on:
          type: [string, "null"]
          format: date
          description: "the survey date. Photos: the earliest capture time in the import, editable. Maps: the map's `captured_on`, kept equal to it. Null means date not set, and it is never guessed."
        map_id: { type: [string, "null"], description: the map a `map` source owns; null for photos }
        folder: { type: string, description: the imported folder; originals there are never modified }
        site: { type: string }
        settings: { $ref: "#/components/schemas/ImportSettings" }
        image_count: { type: integer }
        duplicate_count: { type: integer }
        job_id: { type: [string, "null"], description: the latest import job }
        imported_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
      example:
        id: "50000000-3333-4000-8000-000000000001"
        kind: images
        label: "Flight 15 Apr"
        captured_on: "2019-04-15"
        map_id: null
        folder: "E:\\Dev\\Yolo\\Ahmadia Construction Data"
        site: ahmadia
        settings: { max_side: 4000, quality: 95, dedupe_threshold: 4, group_regex: "^(?P<camera>[A-Za-z0-9-]+)_(?P<flight>\\d+)_(?P<frame>\\d+)" }
        image_count: 3299
        duplicate_count: 0
        job_id: "j0000000-4444-4000-8000-000000000001"
        imported_at: "2026-09-17T10:30:00Z"
        created_at: "2026-09-17T10:05:00Z"
    SourceKind:
      type: string
      description: "`images` owns the photos of one import; `map` owns one map (`video` is reserved)"
      enum: [images, map]
    SourcePatch:
      type: object
      additionalProperties: false
      properties:
        label: { type: [string, "null"], maxLength: 200, description: null clears it }
        captured_on: { type: [string, "null"], format: date, description: "the survey date; on a map source it is written to the map too; null clears it" }
      example: { label: "Flight 14 Sep", captured_on: "2026-09-14" }
    SourceCreate:
      type: object
      required: [folder]
      properties:
        folder: { type: string }
        site: { type: string, description: defaults to the folder name, slugified }
        settings: { $ref: "#/components/schemas/ImportSettings" }
      example: { folder: "E:\\Dev\\Yolo\\Ahmadia Construction Data", site: ahmadia }
    SourceWithJob:
      type: object
      required: [source, job]
      properties:
        source: { $ref: "#/components/schemas/Source" }
        job: { $ref: "#/components/schemas/Job" }
    SourcePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Source" }
        next_cursor: { type: [string, "null"] }

    Image:
      type: object
      required: [id, path, file_name, width, height, source_id, group_key, capture_time, lat, lon, alt, phash, box_count, pending_count, max_pending_confidence, labeled, marked_empty, created_at]
      properties:
        id: { type: string }
        path: { type: string, description: relative to the project folder, forward slashes }
        file_name: { type: string }
        width: { type: integer }
        height: { type: integer }
        source_id: { type: string }
        group_key: { type: string }
        capture_time: { type: [string, "null"], format: date-time }
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
        alt: { type: [number, "null"] }
        phash: { type: [string, "null"] }
        box_count: { type: integer, description: accepted and edited boxes }
        pending_count: { type: integer, description: unreviewed proposals }
        max_pending_confidence: { type: [number, "null"], description: highest confidence among unreviewed proposals (review queue sort key) }
        labeled: { type: boolean, description: has an accepted or edited box, or is marked empty }
        marked_empty: { type: boolean, description: "a person said there is no machinery on this image; it counts as labeled and enters datasets as a negative example" }
        created_at: { type: string, format: date-time }
      example:
        id: "10000000-5555-4000-8000-000000000001"
        path: "images/ahmadia/IX-12-02491_0031_0001.jpg"
