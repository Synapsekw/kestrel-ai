name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: contract/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: contract
      - run: pnpm check
        working-directory: contract

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv --python 3.11.15 .venv
        working-directory: backend
      # CPU wheels on the runner; the reference machine uses the cu130 pins from requirements.txt.
      - run: uv pip install --python .venv/Scripts/python.exe --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple --override ci-overrides-cpu.txt -r requirements-dev.txt
        working-directory: backend
        shell: bash
      - run: .venv/Scripts/ruff check . && .venv/Scripts/ruff format --check .
        working-directory: backend
        shell: bash
      # Pinned-SHA starter weights: the registry tests import yolo11n.pt (they skip without it).
      - uses: actions/cache@v6
        with: { path: backend/starter_weights, key: "starter-weights-${{ hashFiles('backend/scripts/fetch_starter_weights.ps1') }}" }
      - run: .\scripts\fetch_starter_weights.ps1
        working-directory: backend
      - run: .venv/Scripts/python -m pytest -q
        working-directory: backend
        shell: bash

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: contract
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint && pnpm test && pnpm build
        working-directory: frontend
        shell: bash
      - run: pnpm exec playwright install chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
      # A failed e2e run keeps its traces: the runner is the only machine where some races show.
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-results, path: frontend/test-results, retention-days: 7 }

  sidecar-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv --python 3.11.15 .venv
        working-directory: backend
      - run: uv pip install --python .venv/Scripts/python.exe --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple --override ci-overrides-cpu.txt -r requirements-dev.txt
        working-directory: backend
        shell: bash
      # build.ps1 bundles all three starter weights and refuses to run without them.
      - uses: actions/cache@v6
        with: { path: backend/starter_weights, key: "starter-weights-${{ hashFiles('backend/scripts/fetch_starter_weights.ps1') }}" }
      - run: .\scripts\fetch_starter_weights.ps1
        working-directory: backend
      - run: .\scripts\build.ps1
        working-directory: backend
      # Started the way the Tauri launcher does (smoke_frozen.ps1): port 0, the port read off the
      # startup JSON line. A cold 1 GB one-folder bundle can take well over 10 s to come up here.
      - run: |
          $env:APP_TOKEN = "ci"; $env:APP_PORT = "0"
          $env:APP_DATA_DIR = Join-Path $env:RUNNER_TEMP "kestrel-appdata"
          New-Item -ItemType Directory -Force $env:APP_DATA_DIR | Out-Null
          $out = Join-Path $env:RUNNER_TEMP "sidecar-out.txt"; $err = Join-Path $env:RUNNER_TEMP "sidecar-err.txt"
          $p = Start-Process -PassThru -WindowStyle Hidden -FilePath .\dist\kestrel-backend\kestrel-backend.exe `
            -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $port = $null; $deadline = (Get-Date).AddSeconds(180)
            while (-not $port -and (Get-Date) -lt $deadline) {
              if ($p.HasExited) { throw "sidecar exited with $($p.ExitCode)" }
              $line = Get-Content $out -ErrorAction SilentlyContinue | Where-Object { $_ -match '"port":\s*(\d+)' }
              if ($line) { $port = [int]$Matches[1] } else { Start-Sleep -Milliseconds 250 }
            }
            if (-not $port) { throw "no startup line within 180 s" }
            $ok = $false
            while (-not $ok -and (Get-Date) -lt $deadline) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Headers @{ Authorization = "Bearer ci" } "http://127.0.0.1:$port/api/v1/health"
                $ok = $r.StatusCode -eq 200
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw "health never answered 200 on port $port" }
            Write-Host "health ok on port $port"
          } catch {
            Write-Host "--- sidecar stdout ---"; Get-Content $out -ErrorAction SilentlyContinue
            Write-Host "--- sidecar stderr ---"; Get-Content $err -ErrorAction SilentlyContinue
            throw
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
        working-directory: backend
