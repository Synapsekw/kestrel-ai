name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: contract/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: contract
      - run: pnpm check
        working-directory: contract

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11.15 .venv
        working-directory: backend
      # CPU wheels on the runner; the reference machine uses the cu130 pins from requirements.txt.
      - run: uv pip install --python .venv/Scripts/python.exe --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple --override ci-overrides-cpu.txt -r requirements-dev.txt
        working-directory: backend
        shell: bash
      - run: .venv/Scripts/ruff check . && .venv/Scripts/ruff format --check .
        working-directory: backend
        shell: bash
      # Pinned-SHA starter weights: the registry tests import yolo11n.pt (they skip without it).
      - uses: actions/cache@v4
        with: { path: backend/starter_weights, key: "starter-weights-${{ hashFiles('backend/scripts/fetch_starter_weights.ps1') }}" }
      - run: .\scripts\fetch_starter_weights.ps1
        working-directory: backend
      - run: .venv/Scripts/python -m pytest -q
        working-directory: backend
        shell: bash

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: contract
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint && pnpm test && pnpm build
        working-directory: frontend
        shell: bash
      - run: pnpm exec playwright install chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
      # A failed e2e run keeps its traces: the runner is the only machine where some races show.
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-results, path: frontend/test-results, retention-days: 7 }

  sidecar-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11.15 .venv
        working-directory: backend
      - run: uv pip install --python .venv/Scripts/python.exe --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple --override ci-overrides-cpu.txt -r requirements-dev.txt
        working-directory: backend
        shell: bash
      # build.ps1 bundles all three starter weights and refuses to run without them.
      - uses: actions/cache@v4
        with: { path: backend/starter_weights, key: "starter-weights-${{ hashFiles('backend/scripts/fetch_starter_weights.ps1') }}" }
      - run: .\scripts\fetch_starter_weights.ps1
        working-directory: backend
      - run: .\scripts\build.ps1
        working-directory: backend
      - run: |
          $env:APP_TOKEN = "ci"; $env:APP_PORT = "8765"
          $p = Start-Process -PassThru -FilePath .\dist\kestrel-backend\kestrel-backend.exe
          Start-Sleep -Seconds 10
          $r = Invoke-WebRequest -Headers @{ Authorization = "Bearer ci" } http://127.0.0.1:8765/api/v1/health
          if ($r.StatusCode -ne 200) { throw "health returned $($r.StatusCode)" }
          Stop-Process -Id $p.Id
        working-directory: backend
