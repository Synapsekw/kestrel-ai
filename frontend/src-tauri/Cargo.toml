[package]
name = "machinery-app"
version = "0.1.0"
description = "Machinery Detection desktop shell"
authors = ["Synapse Solutions"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "machinery_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
