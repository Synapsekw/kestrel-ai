[project]
name = "kestrel-backend"
version = "0.1.0"
requires-python = "==3.11.*"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: needs an NVIDIA GPU",
    "live: calls a cloud provider, needs an API key in the environment",
    "potreeconverter: runs the real PotreeConverter from backend/third_party (skipped when fetch_potreeconverter.ps1 has not run)",
]
addopts = "-m 'not gpu and not live'"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
